<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频创作工坊 · 货袋子</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  button { border: 0; background: none; cursor: pointer; font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  input, select, textarea { font: inherit; }
  :root { --brand: #1f5eff; }
  body { background: #0b0d12; color: #e8ebf1; font: 13px/1.5 "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; overflow: hidden; }
  .app { display: grid; grid-template-rows: 54px 1fr; grid-template-columns: 316px 1fr 340px; height: 100vh; }
  .topbar { grid-column: 1 / -1; background: #000; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #1a1e27; }
  .topbar .l { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .topbar .l i { width: 26px; height: 26px; border-radius: 6px; background: var(--brand); display: flex; align-items: center; justify-content: center; font-style: normal; font-weight: 900; }
  .topbar .l input { background: #14171e; border: 1px solid #262b36; color: #fff; border-radius: 6px; height: 30px; padding: 0 10px; width: 220px; font-weight: 600; }
  .topbar .l small { color: #8a93a6; font-weight: 400; }
  .topbar .r { display: flex; align-items: center; gap: 8px; }
  .topbar .r a { color: #8a93a6; font-size: 12px; margin-right: 8px; }
  .topbar .r button { padding: 7px 14px; border-radius: 8px; background: #1f2430; color: #fff; font-size: 12px; font-weight: 700; }
  .topbar .r button.pri { background: var(--brand); }
  .left, .right { background: #11141b; overflow-y: auto; }
  .sec { padding: 14px 16px; border-bottom: 1px solid #1f2430; }
  .sec h4 { font-size: 11px; color: #8a93a6; letter-spacing: 1px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .sec h4 span { color: #5d6678; font-weight: 400; letter-spacing: 0; }
  .sec h4 button { font-size: 11px; color: #7fb0ff; }
  /* 模板库 */
  .tpls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tpls button { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; text-align: left; font-size: 11px; color: #c6ccd8; }
  .tpls button i { width: 100%; aspect-ratio: 9 / 12; border-radius: 8px; border: 2px solid transparent; position: relative; overflow: hidden; display: block; }
  .tpls button i::before { content: attr(data-t); position: absolute; left: 8px; top: 10px; right: 8px; font-size: 10px; font-weight: 900; color: var(--tc); font-style: normal; line-height: 1.2; }
  .tpls button i::after { content: ""; position: absolute; left: 8px; right: 30px; bottom: 8px; height: 5px; border-radius: 3px; background: var(--sw); }
  .tpls button.on i { border-color: #fff; } .tpls button.on { color: #fff; font-weight: 700; }
  .tpls button small { color: #5d6678; font-weight: 400; font-size: 10px; }
  .pals { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .pals button { display: flex; flex-direction: column; gap: 4px; align-items: center; font-size: 10px; color: #c6ccd8; }
  .pals button i { width: 100%; aspect-ratio: 1; border-radius: 8px; border: 2px solid transparent; position: relative; }
  .pals button i::after { content: ""; position: absolute; left: 25%; right: 25%; bottom: 6px; height: 4px; border-radius: 2px; background: var(--sw); }
  .pals button.on i { border-color: #fff; }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .field label { flex: none; color: #c6ccd8; }
  .field select, .field input[type=text], .field input[type=number] { flex: 1; height: 30px; background: #0b0d12; border: 1px solid #2a3040; border-radius: 6px; color: #e8ebf1; padding: 0 8px; font-size: 12px; min-width: 0; }
  .field textarea { flex: 1; background: #0b0d12; border: 1px solid #2a3040; border-radius: 6px; color: #e8ebf1; padding: 6px 8px; font-size: 12px; min-height: 64px; resize: vertical; }
  .field input[type=color] { width: 34px; height: 26px; border: 0; background: none; padding: 0; }
  .field input[type=range] { flex: 1; }
  .field .v { color: #8a93a6; width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
  .seg { display: inline-flex; background: #0b0d12; border-radius: 8px; padding: 2px; flex-wrap: wrap; }
  .seg button { padding: 5px 9px; border-radius: 6px; font-size: 11px; color: #9aa3b8; }
  .seg button.on { background: #2a3040; color: #fff; }
  .sw { width: 34px; height: 20px; border-radius: 10px; background: #2a3040; position: relative; flex: none; }
  .sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .2s; }
  .sw.on { background: var(--brand); } .sw.on::after { left: 16px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { padding: 5px 10px; border-radius: 999px; border: 1px solid #2a3040; font-size: 11px; color: #c6ccd8; }
  .chips button.on { border-color: var(--brand); background: rgba(31,94,255,.15); color: #fff; }
  /* 中间 */
  .center { display: grid; grid-template-rows: 1fr auto; min-height: 0; background: radial-gradient(ellipse at 50% 30%, #161a24, #0b0d12 70%); }
  .stagebox { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px; min-height: 0; }
  .phone { height: min(560px, calc(100vh - 330px)); aspect-ratio: 9 / 16; border-radius: 22px; overflow: hidden; position: relative; background: #000; box-shadow: 0 40px 100px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.08); cursor: pointer; }
  .phone canvas { width: 100%; height: 100%; display: block; }
  .phone .paused { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.25); }
  .phone.p .paused { display: flex; }
  .phone .paused i { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,.9); color: #111; display: flex; align-items: center; justify-content: center; font-size: 24px; font-style: normal; }
  .controls { display: flex; gap: 10px; align-items: center; }
  .controls button { width: 36px; height: 36px; border-radius: 50%; background: #1f2430; color: #fff; font-size: 13px; }
  .controls button.play { width: 48px; height: 48px; background: var(--brand); font-size: 18px; }
  .controls .t { font-size: 12px; color: #8a93a6; font-variant-numeric: tabular-nums; width: 100px; text-align: center; }
  /* 时间轴 */
  .tlbox { background: #0e1015; border-top: 1px solid #1f2430; padding: 10px 16px 12px; }
  .tlhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 11px; color: #8a93a6; }
  .tlhead b { color: #fff; font-size: 12px; }
  .tlhead .ops { display: flex; gap: 6px; }
  .tlhead .ops button { padding: 4px 10px; border-radius: 6px; background: #1f2430; color: #fff; font-size: 11px; }
  .tlhead .ops button.add { background: var(--brand); }
  .tl { position: relative; display: flex; gap: 4px; height: 74px; }
  .tl .blk { position: relative; border-radius: 10px; background: #171b25; border: 1px solid #262b36; padding: 8px 10px; min-width: 44px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; transition: border-color .15s; }
  .tl .blk:hover { border-color: #3a4152; }
  .tl .blk.on { border-color: var(--brand); background: rgba(31,94,255,.12); }
  .tl .blk.drag { opacity: .4; }
  .tl .blk .ic { font-size: 14px; } .tl .blk b { font-size: 11px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl .blk small { font-size: 10px; color: #8a93a6; font-variant-numeric: tabular-nums; }
  .tl .blk .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--brand); width: 0; }
  .tl .head { position: absolute; top: -6px; bottom: -6px; width: 2px; background: #fff; pointer-events: none; box-shadow: 0 0 8px #fff; }
  .tl .head::before { content: ""; position: absolute; top: 0; left: -5px; border: 6px solid transparent; border-top: 8px solid #fff; }
  .scrub { margin-top: 10px; }
  .scrub input { width: 100%; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--brand) var(--p, 0%), #222734 var(--p, 0%)); outline: 0; }
  .scrub input::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; }
  /* 右侧场景编辑 */
  .scenehd { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .scenehd .ic { width: 38px; height: 38px; border-radius: 10px; background: #1f2430; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .scenehd b { display: block; font-size: 14px; } .scenehd small { color: #8a93a6; }
  .right .btn { width: 100%; height: 38px; border-radius: 8px; font-weight: 700; margin-bottom: 8px; background: #1f2430; color: #fff; font-size: 12px; }
  .right .btn.pri { background: var(--brand); } .right .btn.ok { background: #07c160; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .export { background: #0b0d12; border: 1px solid #1f2430; border-radius: 8px; padding: 12px; margin-bottom: 8px; display: none; }
  .export.show { display: block; }
  .export .bar { height: 6px; background: #1f2430; border-radius: 3px; overflow: hidden; margin: 8px 0; }
  .export .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #1f5eff, #00d4ff); transition: width .2s; }
  .export small { color: #8a93a6; display: block; line-height: 1.6; } .export a { color: #7fb0ff; font-weight: 700; }
  .upload { border: 1px dashed #2a3040; border-radius: 8px; padding: 10px; text-align: center; color: #8a93a6; font-size: 11px; cursor: pointer; position: relative; }
  .upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .upload img { max-height: 60px; border-radius: 6px; display: block; margin: 0 auto 4px; }
  .tip { font-size: 11px; color: #8a93a6; line-height: 1.7; }
  /* 场景库弹层 */
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 50; display: none; align-items: center; justify-content: center; }
  .mask.show { display: flex; }
  .lib { width: 720px; max-height: 80vh; overflow: auto; background: #14171e; border: 1px solid #262b36; border-radius: 16px; padding: 18px; }
  .lib h3 { font-size: 15px; margin-bottom: 4px; } .lib p { color: #8a93a6; font-size: 12px; margin-bottom: 14px; }
  .lib .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .lib .it { background: #0e1015; border: 1px solid #262b36; border-radius: 12px; padding: 12px; text-align: left; transition: .15s; }
  .lib .it:hover { border-color: var(--brand); transform: translateY(-2px); }
  .lib .it .ic { font-size: 22px; } .lib .it b { display: block; margin-top: 6px; font-size: 13px; } .lib .it small { color: #8a93a6; font-size: 11px; line-height: 1.5; display: block; }
  .toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); background: #fff; color: #111; padding: 8px 16px; border-radius: 999px; font-weight: 700; font-size: 12px; z-index: 60; opacity: 0; transition: .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="l"><i>货</i><input id="pname" value="鑫钢贸易 · 今日行情 0912"><small>视频创作工坊 · 1080×1920 · 所见即导出</small></div>
    <div class="r"><a href="designer.html">← 设计器</a><a href="index.html">风格库</a><button onclick="shuffleStyle()">🎲 换个感觉</button><button onclick="saveProject()">保存为我的模板</button><button class="pri" onclick="startExport()">导出 MP4</button></div>
  </div>

  <aside class="left">
    <div class="sec">
      <h4>模板库 <span id="tplcount"></span></h4>
      <div class="tpls" id="tpls"></div>
    </div>
    <div class="sec">
      <h4>调色 <button onclick="shufflePal()">随机</button></h4>
      <div class="pals" id="pals"></div>
      <div class="field" style="margin-top:10px"><label>自定义</label><span style="color:#8a93a6;font-size:11px">主色</span><input type="color" id="cAccent"><span style="color:#8a93a6;font-size:11px">点缀</span><input type="color" id="cGold"><span style="color:#8a93a6;font-size:11px">背景</span><input type="color" id="cBg"></div>
    </div>
    <div class="sec">
      <h4>字体与动效</h4>
      <div class="field"><label>标题字体</label><div class="seg" id="fontSeg"></div></div>
      <div class="field"><label>背景动效</label><select id="bgfx"></select></div>
      <div class="field"><label>转场</label><select id="transition"></select></div>
      <div class="field"><label>节奏</label><div class="seg" id="paceSeg"><button data-v=".8">快</button><button data-v="1" class="on">标准</button><button data-v="1.25">舒缓</button></div></div>
    </div>
    <div class="sec">
      <h4>画面层</h4>
      <div class="field"><label>字幕</label><i class="sw on" data-k="subs"></i></div>
      <div class="field"><label>品牌水印</label><i class="sw on" data-k="watermark"></i></div>
      <div class="field"><label>顶部进度条</label><i class="sw on" data-k="progress"></i></div>
      <div class="field"><label>胶片颗粒</label><i class="sw on" data-k="grain"></i></div>
      <div class="field"><label>暗角</label><i class="sw on" data-k="vignette"></i></div>
    </div>
    <div class="sec">
      <h4>配音与音乐</h4>
      <div class="field"><label>AI 配音</label><select><option>男声 · 财经播报</option><option>女声 · 亲切</option><option>男声 · 沉稳低音</option><option>关闭</option></select></div>
      <div class="chips" id="bgm"><button class="on">商务节奏</button><button>电子科技</button><button>新闻快讯</button><button>国风古筝</button><button>轻快吉他</button><button>史诗鼓点</button><button>无</button></div>
    </div>
  </aside>

  <main class="center">
    <div class="stagebox">
      <div class="phone" id="phone" onclick="toggle()"><canvas id="cv" width="1080" height="1920"></canvas><div class="paused"><i>▶</i></div></div>
      <div class="controls">
        <button onclick="jump(-1)" title="上一镜">⏮</button>
        <button class="play" id="playBtn" onclick="toggle()">⏸</button>
        <button onclick="jump(1)" title="下一镜">⏭</button>
        <span class="t" id="time">00:00.0 / 00:20</span>
        <button onclick="seek(0)" title="回到开头">↺</button>
        <button onclick="loopScene=!loopScene;this.style.color=loopScene?'#7fb0ff':'#fff'" title="循环当前场景">🔁</button>
      </div>
    </div>
    <div class="tlbox">
      <div class="tlhead"><div><b>时间轴</b> · <span id="tlinfo"></span> · 点击选中 · 拖动排序</div><div class="ops"><button onclick="moveScene(-1)">◀ 前移</button><button onclick="moveScene(1)">后移 ▶</button><button onclick="dupScene()">⧉ 复制</button><button onclick="delScene()">✕ 删除</button><button class="add" onclick="openLib()">＋ 添加场景</button></div></div>
      <div class="tl" id="tl"></div>
      <div class="scrub"><input type="range" id="scrub" min="0" max="1000" value="0"></div>
    </div>
  </main>

  <aside class="right">
    <div class="sec" id="editor"></div>
    <div class="sec">
      <h4>素材</h4>
      <div class="row2">
        <label class="upload" id="upLogo">企业 Logo<br><small>PNG 透明底</small><input type="file" accept="image/*" onchange="loadAsset(this,'logo')"></label>
        <label class="upload" id="upPhoto">实拍图 / 产品图<br><small>用于「图片场景」</small><input type="file" accept="image/*" onchange="loadAsset(this,'photo')"></label>
      </div>
    </div>
    <div class="sec">
      <h4>导出</h4>
      <button class="btn pri" onclick="startExport()">导出 MP4 1080p（服务端渲染 · 含配音字幕）</button>
      <button class="btn" id="recBtn" onclick="recordWebM()">浏览器端直接录制 WebM（真实可下载）</button>
      <div class="export" id="exp"><b id="expT">渲染中…</b><div class="bar"><i id="expB"></i></div><small id="expS"></small></div>
      <div class="row2"><button class="btn ok" onclick="toast('原型：生成朋友圈/视频号可直发的视频，封面为首帧')">发朋友圈 / 视频号</button><button class="btn" onclick="toast('原型：为团队每位销售员生成专属片尾')">团队批量</button></div>
      <div class="row2"><button class="btn" onclick="downloadJSON()">下载配置 JSON</button><label class="btn" style="display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer">导入 JSON<input type="file" accept=".json" style="position:absolute;inset:0;opacity:0" onchange="importJSON(this)"></label></div>
    </div>
    <div class="sec">
      <h4>配音脚本 <span>随场景自动生成</span></h4>
      <div id="script" class="tip"></div>
    </div>
  </aside>
</div>

<div class="mask" id="libMask" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="lib"><h3>添加场景</h3><p>每种场景都是可编辑的积木：文字、数据、时长、入场动画都可以改；同一场景可重复添加。</p><div class="grid" id="libGrid"></div></div>
</div>
<div class="toast" id="toast"></div>

<script src="shared/data.js"></script>
<script>
  const d = HDZ.data, $ = id => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d"), W = 1080, H = 1920, PAD = 90;
  const SANS = '"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif';
  const NUM = '"DIN Alternate","Helvetica Neue",Arial,sans-serif';
  const FONTS = { sans: { name: "现代黑体", f: SANS, w: 800, ls: 0 }, black: { name: "超粗标题", f: SANS, w: 900, ls: -4 }, serif: { name: "宋体衬线", f: '"Songti SC","STSong","Noto Serif SC","SimSun",serif', w: 900, ls: 2 }, kai: { name: "楷体国风", f: '"STKaiti","KaiTi","Noto Serif SC",serif', w: 900, ls: 6 } };
  const BGFX = { particles: "粒子光斑", orbs: "流光光晕", grid: "科技网格", rain: "流线雨丝", stripes: "工业斜纹", rings: "同心波纹", none: "纯净渐变" };
  const TRANS = { sweep: "光带扫过", wipe: "色块擦除", zoom: "缩放淡入", slide: "推移", fade: "淡入" };

  /* ---------- 12 套调色 ---------- */
  const PALS = {
    fin: { name: "深蓝金融", bg0: "#060a16", bg1: "#12204a", accent: "#4f8cff", gold: "#f5c451", text: "#ffffff", dark: true },
    ind: { name: "钢厂工业", bg0: "#090909", bg1: "#2a1f14", accent: "#ff7a00", gold: "#ffb400", text: "#f4f1ea", dark: true },
    red: { name: "喜报红金", bg0: "#4a0410", bg1: "#b3122b", accent: "#f5c451", gold: "#ffe08a", text: "#ffffff", dark: true },
    white: { name: "极简商务", bg0: "#e9edf4", bg1: "#ffffff", accent: "#1f5eff", gold: "#d99a00", text: "#111111", dark: false },
    ink: { name: "国潮墨绿", bg0: "#08140f", bg1: "#1f3d2b", accent: "#c9a24a", gold: "#e8c872", text: "#f4efe4", dark: true },
    mag: { name: "杂志黑黄", bg0: "#050505", bg1: "#1c1c1c", accent: "#ffcc00", gold: "#ffffff", text: "#ffffff", dark: true },
    cyan: { name: "数据青蓝", bg0: "#03101c", bg1: "#0a2a4a", accent: "#00d4ff", gold: "#7dffb3", text: "#e6f6ff", dark: true },
    violet: { name: "夜盘紫", bg0: "#0d0820", bg1: "#2a1460", accent: "#b388ff", gold: "#ffd166", text: "#f3efff", dark: true },
    green: { name: "微信绿", bg0: "#07130d", bg1: "#0f3a24", accent: "#07c160", gold: "#ffd24d", text: "#f0fff5", dark: true },
    sunset: { name: "暖橙夕阳", bg0: "#1f0a06", bg1: "#7a2c14", accent: "#ff9f43", gold: "#ffe1a8", text: "#fff5ea", dark: true },
    paper: { name: "纸质早报", bg0: "#efe6d3", bg1: "#fbf6ea", accent: "#c8102e", gold: "#1a3a6b", text: "#1c1c1c", dark: false },
    yellow: { name: "特价亮黄", bg0: "#ffc400", bg1: "#ffe259", accent: "#ff3b30", gold: "#111111", text: "#111111", dark: false }
  };
  const derive = p => Object.assign({}, p, { mute: p.dark ? "rgba(255,255,255,.62)" : "rgba(0,0,0,.55)", card: p.dark ? "rgba(255,255,255,.07)" : "rgba(0,0,0,.05)", stroke: p.dark ? "rgba(255,255,255,.12)" : "rgba(0,0,0,.08)", end: p.accent === "#f5c451" ? "#8e0b1f" : (p.dark ? p.accent : "#111111"), particle: p.dark ? p.accent : p.accent, up: p.dark ? (p.accent === "#f5c451" ? "#ffe08a" : "#ff5c57") : "#e5312b", down: p.dark ? "#22c55e" : "#0aa35a" });

  /* ---------- 场景类型（积木） ---------- */

      else if (type === "textarea") html += `<div class="field" style="align-items:flex-start"><label>${label}</label><textarea oninput="setProp('${k}', this.value)">${v ?? ""}</textarea></div>`;
      else if (type === "bool") html += `<div class="field"><label>${label}</label><i class="sw ${v ? "on" : ""}" onclick="this.classList.toggle('on');setProp('${k}', this.classList.contains('on'))"></i></div>`;
      else if (type === "quote") html += `<div class="field"><label>${label}</label><select onchange="setProp('${k}', this.value)">${d.quotes.map(q => `<option ${q.name === v ? "selected" : ""}>${q.name}</option>`).join("")}</select></div>`;
      else if (type === "resource") html += `<div class="field"><label>${label}</label><select onchange="setProp('${k}', +this.value)">${d.resources.map((r, i) => `<option value="${i}" ${i === +v ? "selected" : ""}>${r.name} ${r.spec} · ${r.mill}</option>`).join("")}</select></div>`;
      else if (type.startsWith("select:")) { const opts = type.slice(7).split(",").map(o => o.split("=")); html += `<div class="field"><label>${label}</label><select onchange="setProp('${k}', this.value)">${opts.map(([ov, ol]) => `<option value="${ov}" ${String(ov) === String(v) ? "selected" : ""}>${ol || ov}</option>`).join("")}</select></div>`; }
    });
    if (s.type === "photo") html += `<div class="field"><label>图片</label><label class="upload" style="flex:1">${s.props.img ? "已上传 · 点击更换" : "上传本场景图片"}<input type="file" accept="image/*" onchange="loadSceneImg(this)"></label></div>`;
    html += `<p class="tip" style="margin-top:6px">字幕：${T.sub(s.props) || "—"}</p>`;
    $("editor").innerHTML = html;
  }
  window.setDur = v => { const s = PROJ.scenes[sel]; s.dur = +v; $("durv").textContent = (+v).toFixed(1) + "s"; renderTL(); if (!loopScene) seek(s.start + .001); };
  window.setProp = (k, v) => { const s = PROJ.scenes[sel]; s.props[k] = v; renderTL(); const cur = PROJ.scenes.findIndex(x => t >= x.start && t < x.start + x.len); if (cur !== sel) seek(s.start + .001); };
  window.loadSceneImg = inp => { const f = inp.files[0]; if (!f) return; const img = new Image(); img.onload = () => { PROJ.scenes[sel].props.img = img; renderEditor(); seek(PROJ.scenes[sel].start + .001); }; img.src = URL.createObjectURL(f); };
  window.loadAsset = (inp, k) => { const f = inp.files[0]; if (!f) return; const img = new Image(); img.onload = () => { ASSETS[k] = img; const box = $(k === "logo" ? "upLogo" : "upPhoto"); box.innerHTML = `<img src="${img.src}"><small>已上传 · 点击更换</small><input type="file" accept="image/*" onchange="loadAsset(this,'${k}')">`; toast(k === "logo" ? "Logo 已应用到开场 / 水印 / 片尾" : "图片已应用到所有未单独设图的「图片场景」"); }; img.src = URL.createObjectURL(f); };

  /* ---------- 左侧 UI ---------- */
  function syncUI() {
    document.querySelectorAll("#tpls button").forEach(b => b.classList.toggle("on", b.dataset.id === PROJ.tpl));
    document.querySelectorAll("#pals button").forEach(b => b.classList.toggle("on", !PROJ.custom && b.dataset.id === PROJ.pal));
    $("cAccent").value = P.accent; $("cGold").value = P.gold.length === 7 ? P.gold : "#f5c451"; $("cBg").value = P.bg0;
    document.querySelectorAll("#fontSeg button").forEach(b => b.classList.toggle("on", b.dataset.v === PROJ.font));
    $("bgfx").value = PROJ.bgfx; $("transition").value = PROJ.transition;
    document.querySelectorAll("#paceSeg button").forEach(b => b.classList.toggle("on", +b.dataset.v === PROJ.pace));
    document.querySelectorAll(".sw[data-k]").forEach(sw => sw.classList.toggle("on", !!PROJ[sw.dataset.k]));
  }
  function renderTemplates() {
    const mine = JSON.parse(localStorage.getItem("hdz-video-mine") || "[]");
    $("tpls").innerHTML = TEMPLATES.map(tp => { const p = PALS[tp.pal]; return `<button data-id="${tp.id}" onclick="applyTemplate('${tp.id}')"><i data-t="${tp.name}" style="--sw:${p.accent};--tc:${p.text};background:linear-gradient(160deg,${p.bg1},${p.bg0})"></i>${tp.name}<small>${tp.scenes().length} 镜 · ${BGFX[tp.bgfx]}</small></button>`; }).join("") + mine.map((m, i) => `<button data-id="mine-${i}" onclick="loadMine(${i})"><i data-t="★ ${m.name}" style="--sw:${m.P.accent};--tc:${m.P.text};background:linear-gradient(160deg,${m.P.bg1},${m.P.bg0})"></i>${m.name}<small>我的模板 · ${m.proj.scenes.length} 镜</small></button>`).join("");
    $("tplcount").textContent = `${TEMPLATES.length} 套预设${mine.length ? " + " + mine.length + " 我的" : ""}`;
  }
  $("pals").innerHTML = Object.entries(PALS).map(([k, p]) => `<button data-id="${k}" title="${p.name}" onclick="setPal('${k}')"><i style="--sw:${p.accent};background:linear-gradient(160deg,${p.bg1},${p.bg0})"></i>${p.name.slice(0, 4)}</button>`).join("");
  $("fontSeg").innerHTML = Object.entries(FONTS).map(([k, f]) => `<button data-v="${k}" onclick="PROJ.font='${k}';syncUI()">${f.name}</button>`).join("");
  $("bgfx").innerHTML = Object.entries(BGFX).map(([k, v]) => `<option value="${k}">${v}</option>`).join(""); $("bgfx").onchange = e => PROJ.bgfx = e.target.value;
  $("transition").innerHTML = Object.entries(TRANS).map(([k, v]) => `<option value="${k}">${v}</option>`).join(""); $("transition").onchange = e => PROJ.transition = e.target.value;
  $("paceSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; PROJ.pace = +b.dataset.v; renderTL(); syncUI(); });
  document.querySelectorAll(".sw[data-k]").forEach(sw => sw.addEventListener("click", () => { PROJ[sw.dataset.k] = !PROJ[sw.dataset.k]; syncUI(); }));
  ["cAccent", "cGold", "cBg"].forEach(id => $(id).addEventListener("input", setCustom));
  $("bgm").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; document.querySelectorAll("#bgm button").forEach(x => x.classList.toggle("on", x === b)); });
  window.shufflePal = () => { const keys = Object.keys(PALS).filter(k => k !== PROJ.pal); setPal(keys[Math.floor(Math.random() * keys.length)]); };
  window.shuffleStyle = () => { shufflePal(); const pick = o => { const k = Object.keys(o); return k[Math.floor(Math.random() * k.length)]; }; PROJ.font = pick(FONTS); PROJ.bgfx = pick(BGFX); PROJ.transition = pick(TRANS); syncUI(); toast(`${P.name} · ${FONTS[PROJ.font].name} · ${BGFX[PROJ.bgfx]} · ${TRANS[PROJ.transition]}`); };

  /* ---------- 保存 / 导入导出 ---------- */
  const serialize = () => ({ name: $("pname").value, P: PROJ.custom || PALS[PROJ.pal], proj: Object.assign({}, PROJ, { scenes: PROJ.scenes.map(s => ({ type: s.type, dur: s.dur, props: Object.assign({}, s.props, { img: undefined }) })) }) });
  function restore(o) { Object.assign(PROJ, o.proj); PROJ.scenes = o.proj.scenes.map(s => ({ type: s.type, dur: s.dur, props: Object.assign(TYPES[s.type].def(), s.props) })); if (o.proj.custom) { PROJ.custom = o.proj.custom; P = derive(o.proj.custom); } else setPal(o.proj.pal, true); $("pname").value = o.name; schedule(); sel = 0; seek(0); syncUI(); renderTL(); renderEditor(); }
  window.saveProject = () => { const mine = JSON.parse(localStorage.getItem("hdz-video-mine") || "[]"); mine.unshift(serialize()); localStorage.setItem("hdz-video-mine", JSON.stringify(mine.slice(0, 6))); renderTemplates(); toast("已保存到「我的模板」（本地演示存储）"); };
  window.loadMine = i => { const mine = JSON.parse(localStorage.getItem("hdz-video-mine") || "[]"); if (mine[i]) restore(mine[i]); };
  window.downloadJSON = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(serialize(), null, 2)], { type: "application/json" })); a.download = `hdz-video-${Date.now()}.json`; a.click(); };
  window.importJSON = inp => { const f = inp.files[0]; if (!f) return; f.text().then(s => { try { restore(JSON.parse(s)); toast("已导入配置"); } catch (e) { toast("JSON 解析失败"); } }); };
  window.toast = m => { const el = $("toast"); el.textContent = m; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2200); };

  /* ---------- 导出 ---------- */
  window.startExport = () => {
    const box = $("exp"); box.classList.add("show"); let p = 0; const T = total(); const steps = ["逐帧渲染 1080×1920 · 30fps…", "合成 AI 配音…", "烧录字幕与品牌水印…", "FFmpeg 编码 H.264 · 8Mbps…", "生成首帧封面与追踪码…", "上传 CDN…"];
    const iv = setInterval(() => { p += 3 + Math.random() * 9; if (p >= 100) { p = 100; clearInterval(iv); $("expT").textContent = "导出完成 ✓"; $("expS").innerHTML = `<a href="#" onclick="return false">下载 MP4（${T.toFixed(0)}s · 1080×1920 · ${(T * 1.05).toFixed(1)} MB）</a> · 已推送到 ${d.sales.name} 微信`; } else { $("expT").textContent = steps[Math.min(steps.length - 1, Math.floor(p / 17))]; $("expS").textContent = `预计剩余 ${Math.ceil((100 - p) / 12)} 秒`; } $("expB").style.width = p + "%"; }, 300);
  };
  window.recordWebM = () => {
    if (!cv.captureStream || !window.MediaRecorder) { toast("当前浏览器不支持 MediaRecorder，请用 Chrome / Edge"); return; }
    const box = $("exp"); box.classList.add("show"); $("expT").textContent = "浏览器录制中（实时播放一遍）…"; $("expS").textContent = "录制期间请勿切换标签页";
    const stream = cv.captureStream(30), mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ? "video/webm;codecs=vp9" : "video/webm", rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12e6 }), chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => { const blob = new Blob(chunks, { type: "video/webm" }), url = URL.createObjectURL(blob); $("expT").textContent = "录制完成 ✓"; $("expS").innerHTML = `<a href="${url}" download="hdz-video-${PROJ.tpl}-${d.date}.webm">下载 WebM（${(blob.size / 1048576).toFixed(1)} MB）</a> · 可直接发微信 / 转 MP4`; $("expB").style.width = "100%"; $("recBtn").disabled = false; };
    $("recBtn").disabled = true; const wasLoop = loopScene; loopScene = false; seek(0); if (!playing) toggle(); rec.start(200); const t0 = performance.now(), T = total();
    const tick = () => { const el = (performance.now() - t0) / 1000; $("expB").style.width = clamp(el / T) * 100 + "%"; if (el >= T) { rec.stop(); loopScene = wasLoop; } else requestAnimationFrame(tick); }; requestAnimationFrame(tick);
  };

  /* ---------- 启动 ---------- */
  renderTemplates();
  const qp = new URLSearchParams(location.search);
  applyTemplate(qp.get("tpl") || "brief");
  if (qp.get("pal") && PALS[qp.get("pal")]) setPal(qp.get("pal"));
  if (qp.get("t") != null) { seek(+qp.get("t")); playing = false; $("playBtn").textContent = "▶"; }
  requestAnimationFrame(loop);
</script>
</body>
</html>

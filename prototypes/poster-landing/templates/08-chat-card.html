<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>08 · 销售员人设对话风 · 货袋子行情海报落地页</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  :root { --brand: #07c160; --bubble: #fff; --me: #95ec69; }
  body { background: #dcdfe4; }
  .page { background: #ededed; color: #111; }
  .top { background: #fff; padding: 16px 16px 14px; border-bottom: 1px solid #e3e3e3; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 5; }
  .top .av { width: 48px; height: 48px; border-radius: 8px; background: linear-gradient(135deg, #07c160, #10aeff); color: #fff; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center; position: relative; }
  .top .av i { position: absolute; right: -3px; bottom: -3px; width: 12px; height: 12px; border-radius: 50%; background: #07c160; border: 2px solid #fff; }
  .top .info { flex: 1; }
  .top .info b { font-size: 16px; }
  .top .info small { display: block; color: #888; font-size: 11px; margin-top: 2px; }
  .top .follow { font-size: 12px; color: #07c160; border: 1px solid #07c160; padding: 4px 10px; border-radius: 999px; }
  .chat { padding: 14px 12px 0; display: flex; flex-direction: column; gap: 14px; }
  .time { text-align: center; font-size: 11px; color: #999; }
  .msg { display: flex; gap: 8px; align-items: flex-start; animation: fadeIn .4s ease both; }
  .msg .a { width: 36px; height: 36px; border-radius: 6px; background: linear-gradient(135deg, #07c160, #10aeff); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none; }
  .msg .b { max-width: 82%; background: var(--bubble); border-radius: 4px 12px 12px 12px; padding: 10px 12px; font-size: 14px; line-height: 1.6; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .msg .b::before { content: ""; position: absolute; left: -6px; top: 10px; border: 6px solid transparent; border-right-color: var(--bubble); border-left: 0; }
  .msg.me { flex-direction: row-reverse; }
  .msg.me .a { background: #4a5a6a; }
  .msg.me .b { background: var(--me); border-radius: 12px 4px 12px 12px; }
  .msg.me .b::before { left: auto; right: -6px; border-right: 0; border-left: 6px solid var(--me); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px) } }
  .card { background: #fff; border-radius: 12px; overflow: hidden; width: 100%; max-width: 300px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .card .hd { padding: 10px 12px; background: linear-gradient(135deg, #1f5eff, #10aeff); color: #fff; display: flex; justify-content: space-between; align-items: center; }
  .card .hd b { font-size: 14px; } .card .hd small { font-size: 10px; opacity: .9; }
  .card .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
  .card .row:last-child { border: 0; }
  .card .row small { color: #999; font-size: 10px; margin-left: 4px; }
  .card .row b { font-size: 15px; font-variant-numeric: tabular-nums; }
  .card .row .c { font-size: 11px; font-weight: 700; width: 40px; text-align: right; }
  .card .ft { padding: 8px 12px; font-size: 11px; color: #888; background: #fafafa; display: flex; justify-content: space-between; }
  .card .ft a { color: #576b95; }
  .goods { display: grid; gap: 8px; width: 100%; max-width: 300px; }
  .goods .g { background: #fff; border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .goods .g .n { font-size: 13px; font-weight: 700; } .goods .g .n small { display: block; color: #999; font-size: 10px; font-weight: 400; margin-top: 2px; }
  .goods .g .n i { font-style: normal; font-size: 10px; color: #fa5151; border: 1px solid #fa5151; padding: 0 4px; border-radius: 3px; margin-left: 4px; font-weight: 400; }
  .goods .g .p { text-align: right; }
  .goods .g .p b { color: #fa5151; font-size: 15px; display: block; }
  .goods .g .p button { font-size: 11px; background: #07c160; color: #fff; padding: 3px 10px; border-radius: 999px; margin-top: 2px; }
  .spark-card { background: #fff; border-radius: 10px; padding: 10px 12px; width: 100%; max-width: 300px; color: #666; font-size: 11px; }
  .qrcard { background: #fff; border-radius: 10px; padding: 12px; width: 100%; max-width: 300px; display: flex; gap: 12px; align-items: center; }
  .qrcard .t b { font-size: 14px; display: block; } .qrcard .t small { color: #888; font-size: 11px; line-height: 1.6; display: block; margin-top: 4px; }
  .quick { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 12px 6px; }
  .quick button { background: #fff; border: 1px solid #ddd; border-radius: 999px; padding: 6px 12px; font-size: 12px; color: #333; }
  .foot { text-align: center; font-size: 10px; color: #999; padding: 12px 0 6px; }
  .cta-bar .primary { background: #07c160; }
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div class="av" id="av"><i></i></div>
    <div class="info"><b id="sname"></b><small id="stitle"></small></div>
    <button class="follow" onclick="HDZ.wechat()">+ 加微信</button>
  </div>

  <div class="chat">
    <div class="time" id="date"></div>
    <div class="msg"><div class="a" id="a1"></div><div class="b">早上好，今日行情来了 👋<br>沪市建材<b class="up">小幅上涨</b>，螺纹钢 <b>3680</b>，比昨天涨了 20。</div></div>
    <div class="msg" style="animation-delay:.2s"><div class="a" id="a2"></div>
      <div class="card">
        <div class="hd"><b>今日行情 · 上海</b><small>货袋子 08:30</small></div>
        <div id="quotes"></div>
        <div class="ft"><span>数据来源：货袋子行情</span><a href="#" onclick="return false">查看全部 ›</a></div>
      </div>
    </div>
    <div class="msg" style="animation-delay:.4s"><div class="a" id="a3"></div><div class="b" id="comment"></div></div>
    <div class="msg" style="animation-delay:.5s"><div class="a" id="a4"></div><div class="spark-card">螺纹钢近 8 日走势<div id="spark" style="margin-top:4px"></div></div></div>
    <div class="msg" style="animation-delay:.6s"><div class="a" id="a5"></div><div class="b">我这边现货今天<b>还是老价</b>，宝山库自提，当天能装车 👇</div></div>
    <div class="msg" style="animation-delay:.7s"><div class="a" id="a6"></div><div class="goods" id="res"></div></div>
    <div class="msg me" style="animation-delay:.9s"><div class="a">客</div><div class="b">Φ16 要 60 吨，什么价能做？</div></div>
    <div class="msg" style="animation-delay:1.1s"><div class="a" id="a7"></div><div class="b">量大有优惠，点下面"询价"留个需求，我 <b>30 分钟内</b>给您专属报价，只有您能看到 🤝</div></div>
    <div class="msg" style="animation-delay:1.2s"><div class="a" id="a8"></div>
      <div class="qrcard"><div id="qr"></div><div class="t"><b id="sname2"></b><small id="sphone"></small><small>长按识别 · 加我微信<br>每天第一时间收到行情</small></div></div>
    </div>
  </div>

  <div class="quick">
    <button onclick="HDZ.inquiry({name:'螺纹钢',spec:'Φ16 HRB400E'})">螺纹钢多少钱？</button>
    <button onclick="HDZ.inquiry({name:'热轧卷板'})">热卷有货吗？</button>
    <button onclick="alert('原型：订阅后每日 07:30 推送行情到微信')">每天推我行情</button>
    <button onclick="HDZ.inquiry()">我要报价</button>
  </div>
  <div class="foot">追踪码 <span id="code"></span> · 由货袋子提供技术支持</div>
</div>

<div class="cta-bar">
  <button class="ghost" onclick="HDZ.call()">📞 打电话</button>
  <button class="primary" onclick="HDZ.inquiry()">发需求 · 30 分钟回复</button>
</div>
<button class="fab" onclick="HDZ.poster({bg:'#fff',fg:'#111',brand:'#07c160',accent:'#fa5151',title:'今日行情',sub:'王建国 · 每日行情 · 现货报价'})">生成<br>海报</button>

<script src="../shared/data.js"></script>
<script src="../shared/common.js"></script>
<script>
  const d = HDZ.data;
  HDZ.mountCommon({ name: "08 销售员对话风" });
  ["av","a1","a2","a3","a4","a5","a6","a7","a8"].forEach(id => { const el = document.getElementById(id); if (id === "av") el.insertAdjacentText("afterbegin", d.sales.avatar); else el.textContent = d.sales.avatar; });
  sname.textContent = d.sales.name; sname2.textContent = `${d.sales.name} · ${d.sales.title}`; stitle.textContent = `${d.company.name} · ${d.sales.intro}`; sphone.textContent = d.sales.phone; date.textContent = `${d.date} ${d.weekday} 08:32`; comment.textContent = d.comment; code.textContent = d.spreadCode;
  quotes.innerHTML = d.quotes.map(q => `<div class="row"><span>${q.name}<small>${q.spec}</small></span><span><b>${q.price}</b> <span class="c">${HDZ.chg(q.change)}</span></span></div>`).join("");
  HDZ.spark(document.getElementById("spark"), d.trend, { color: "#07c160", h: 70, labels: d.trendLabels, grid: false });
  res.innerHTML = d.resources.slice(0, 4).map(r => `<div class="g"><div class="n">${r.name} ${r.spec}<i>${r.tag}</i><small>${r.mill} · ${r.warehouse} · ${r.qty} 吨</small></div><div class="p"><b>¥${r.price}</b><button onclick='HDZ.inquiry(${JSON.stringify({name:r.name,spec:r.spec})})'>询价</button></div></div>`).join("");
  HDZ.qr(document.getElementById("qr"), 76);
</script>
</body>
</html>

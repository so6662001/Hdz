<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>生成海报 · 货袋子 手机端</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  :root { --brand: #1f5eff; }
  body { background: #0f1115; color: #fff; }
  .page { background: #0f1115; padding-bottom: 0; min-height: 100vh; display: flex; flex-direction: column; }
  .top { height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-size: 16px; font-weight: 700; }
  .top a, .top button { font-size: 13px; color: #9aa3b8; font-weight: 400; }
  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px 16px 0; position: relative; min-height: 0; }
  .canvas-wrap { position: relative; width: 100%; max-width: 300px; aspect-ratio: var(--ar, 9 / 16); border-radius: 14px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.6); background: #222; touch-action: pan-y; }
  .canvas-wrap canvas { width: 100%; height: 100%; display: block; }
  .canvas-wrap.long { max-height: 100%; }
  .canvas-wrap .longtag { position: absolute; right: 8px; top: 8px; background: rgba(255,106,43,.9); color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 999px; display: none; }
  .canvas-wrap.long .longtag { display: block; }
  .sname .hint { color: #5d6678; transition: opacity .6s; }
  .stage.moved .hint { opacity: 0; }
  .sname em { font-style: normal; color: #f5c451; font-size: 11px; margin-right: 6px; }
  .sname em:not(:empty)::before { content: "· "; color: #5d6678; }
  .arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.12); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .arrow.l { left: 0 } .arrow.r { right: 0 }
  .dots { display: flex; gap: 5px; margin: 10px 0 4px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.25); transition: .2s; }
  .dots i.on { background: #fff; width: 16px; border-radius: 3px; }
  .sname { font-size: 12px; color: #9aa3b8; }
  .sname b { color: #fff; margin-right: 6px; }
  .sheet2 { background: #171a21; border-radius: 18px 18px 0 0; padding: 12px 0 0; }
  .tabs { display: flex; gap: 18px; padding: 0 16px; border-bottom: 1px solid #262b36; }
  .tabs button { padding: 8px 0 10px; font-size: 14px; color: #9aa3b8; position: relative; }
  .tabs button.on { color: #fff; font-weight: 700; }
  .tabs button.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--brand); border-radius: 1px; }
  .pane { display: none; padding: 12px 16px 6px; min-height: 132px; }
  .pane.on { display: block; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; color: #c5cbd8; }
  .chips button i { width: 44px; height: 60px; border-radius: 8px; border: 2px solid transparent; display: block; }
  .chips button.on i { border-color: #fff; }
  .chips button.on { color: #fff; font-weight: 700; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #22262f; font-size: 13px; }
  .row:last-child { border: 0; }
  .row .l { color: #c5cbd8; }
  .seg { display: inline-flex; background: #0f1115; border-radius: 8px; padding: 2px; }
  .seg button { padding: 5px 10px; border-radius: 6px; font-size: 12px; color: #9aa3b8; }
  .seg button.on { background: #2a2f3a; color: #fff; }
  .toggle { width: 40px; height: 22px; border-radius: 11px; background: #2a2f3a; position: relative; }
  .toggle::after { content: ""; position: absolute; left: 2px; top: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: .2s; }
  .toggle.on { background: var(--brand); } .toggle.on::after { left: 20px; }
  select, input[type=text] { background: #0f1115; color: #fff; border: 1px solid #2a2f3a; border-radius: 6px; height: 30px; padding: 0 8px; font-size: 12px; max-width: 200px; }
  .actions { display: flex; gap: 8px; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); background: #171a21; }
  .actions button { flex: 1; height: 46px; border-radius: 12px; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .actions .ghost { background: #262b36; color: #fff; }
  .actions .pri { background: var(--brand); color: #fff; flex: 1.4; }
  .actions .wx { background: #07c160; color: #fff; }
  /* 保存结果层 */
  .save-mask { position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 500; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; }
  .save-mask.show { display: flex; }
  .save-mask img { max-height: 70vh; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .save-mask p { color: #fff; font-size: 14px; font-weight: 700; }
  .save-mask small { color: #9aa3b8; font-size: 12px; text-align: center; line-height: 1.6; }
  .save-mask .btns { display: flex; gap: 10px; }
  .save-mask .btns a, .save-mask .btns button { padding: 10px 18px; border-radius: 999px; background: #fff; color: #111; font-weight: 700; font-size: 13px; }
  .save-mask .btns .g { background: #07c160; color: #fff; }
</style>
</head>
<body>
<div class="page">
  <div class="top"><a href="index.html" id="back">‹ 返回</a><span>生成海报</span><button onclick="location.href='designer.html'">高级编辑</button></div>

  <div class="stage">
    <div class="canvas-wrap" id="wrap">
      <canvas id="cv" width="1080" height="1920"></canvas>
      <span class="longtag">长图</span>
    </div>
    <button class="arrow l" onclick="step(-1)">‹</button><button class="arrow r" onclick="step(1)">›</button>
    <div class="dots" id="dots"></div>
    <div class="sname"><span id="sname"></span><em id="fit"></em><span class="hint">· 左右滑动切换</span></div>
  </div>

  <div class="sheet2">
    <div class="tabs">
      <button class="on" onclick="tab(0,this)">风格</button>
      <button onclick="tab(1,this)">内容</button>
      <button onclick="tab(2,this)">名片</button>
    </div>
    <div class="pane on" id="p0"><div class="chips" id="chips"></div></div>
    <div class="pane" id="p1">
      <div class="row"><span class="l">主推品种</span><select id="hero"></select></div>
      <div class="row"><span class="l">行情品种数</span><div class="seg" data-k="qn"><button data-v="4">4</button><button data-v="6" class="on">6</button></div></div>
      <div class="row"><span class="l">走势图</span><i class="toggle on" data-k="trend"></i></div>
      <div class="row"><span class="l">今日点评</span><i class="toggle on" data-k="comment"></i></div>
      <div class="row"><span class="l">现货条数</span><div class="seg" data-k="rn"><button data-v="2">2</button><button data-v="3" class="on">3</button><button data-v="4">4</button></div></div>
      <div class="row"><span class="l">现货价格</span><div class="seg" data-k="pm"><button data-v="show" class="on">明码</button><button data-v="hide">电议</button></div></div>
    </div>
    <div class="pane" id="p2">
      <div class="row"><span class="l">销售员</span><select id="sales"><option>王建国 · 销售总监</option><option>李敏 · 销售经理</option></select></div>
      <div class="row"><span class="l">显示电话</span><i class="toggle on" data-k="phone"></i></div>
      <div class="row"><span class="l">二维码</span><select><option>我的专属码（带追踪）</option><option>企业统一码</option><option>企微活码</option></select></div>
      <div class="row"><span class="l">自定义标题</span><input type="text" id="title" placeholder="留空用风格默认"></div>
    </div>
    <div class="actions">
      <button class="ghost" onclick="alert('原型：生成携带追踪码的落地页链接并复制')">🔗 链接</button>
      <button class="wx" onclick="save('wx')">分享微信</button>
      <button class="pri" onclick="save()">⬇ 保存到相册</button>
    </div>
  </div>
</div>

<div class="save-mask" id="save" onclick="if(event.target===this)this.classList.remove('show')">
  <img id="saveimg" alt="海报">
  <p id="savet">海报已生成</p>
  <small>长按图片保存到相册，或点击下方按钮<br>二维码携带您的追踪码 · 扫码留资归您</small>
  <div class="btns"><a id="dl" download="hdz-poster.png">下载图片</a><button class="g" onclick="alert('原型：调起微信分享图片')">发到微信</button><button onclick="document.getElementById('save').classList.remove('show')">返回</button></div>
</div>

<script src="shared/data.js"></script>
<script src="shared/common.js"></script>
<script>
  const d = HDZ.data;
  const SANS = '"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif', SERIF = '"Songti SC","STSong","Noto Serif SC",serif', KAI = '"STKaiti","KaiTi","Noto Serif SC",serif';
  const THEMES = [
    { id: "navy", name: "深夜行情早报", bg: "#0a1020", fg: "#f2f5fa", mute: "#8b96ab", accent: "#ff6a2b", brand: "#ff6a2b", panel: "rgba(255,255,255,.05)", font: SANS, title: "行情早报", sub: "长图 · 头条 + 6 品种 + 看点 + 现货 + 推广位", deco: "navy", long: true },
    { id: "brief", name: "钢市早报", bg: "#f7f3ea", fg: "#1c1c1c", mute: "#666", accent: "#c8102e", brand: "#1a3a6b", panel: "rgba(0,0,0,.05)", font: SERIF, title: "钢市早报", sub: "STEEL MORNING BRIEF · 现货 · 行情 · 观点", deco: "brief" },
    { id: "screen", name: "数据大屏", bg: "#060b1a", fg: "#e6f1ff", mute: "#7f95b8", accent: "#00d4ff", brand: "#0aa7d6", panel: "rgba(255,255,255,.06)", font: SANS, title: "今日钢市数据", sub: "REALTIME · 实时行情 · 现货库存", deco: "grid" },
    { id: "red", name: "涨价喜报", bg: "#fff6f0", fg: "#222", mute: "#777", accent: "#c8102e", brand: "#c8102e", panel: "rgba(200,16,46,.06)", font: SANS, title: "喜 报", sub: "钢价上涨 · 抓紧备货", deco: "red" },
    { id: "min", name: "极简商务", bg: "#ffffff", fg: "#111", mute: "#8a8f99", accent: "#1f5eff", brand: "#111", panel: "rgba(0,0,0,.04)", font: SANS, title: "今日钢市", sub: "DAILY STEEL REPORT · 上海", deco: "min" },
    { id: "ink", name: "国潮新中式", bg: "#f4efe4", fg: "#2b2b2b", mute: "#777", accent: "#b8323a", brand: "#1f3d2b", panel: "rgba(31,61,43,.07)", font: KAI, title: "钢市观澜", sub: "STEEL MARKET · DAILY VIEW", deco: "ink" },
    { id: "ind", name: "钢厂工业", bg: "#1d1f24", fg: "#e8e9ec", mute: "#9aa0ab", accent: "#ff7a00", brand: "#ff7a00", panel: "rgba(255,255,255,.06)", font: SANS, title: "今日钢价", sub: "STEEL SUPPLY · 报价单 NO.20260912", deco: "hazard" },
    { id: "mag", name: "杂志封面", bg: "#0b0b0b", fg: "#fff", mute: "#999", accent: "#ffcc00", brand: "#ffcc00", panel: "rgba(255,255,255,.08)", font: SANS, title: "STEEL DAILY", sub: "Vol.09 · No.12 · 螺纹钢周末小涨", deco: "mag" },
    { id: "chat", name: "销售员人设", bg: "#f2f3f5", fg: "#111", mute: "#888", accent: "#fa5151", brand: "#07c160", panel: "#ffffff", font: SANS, title: "今日行情", sub: "每天第一时间 · 一手现货报价", deco: "chat" },
    { id: "sale", name: "特价清仓", bg: "#ffd600", fg: "#111", mute: "#6b5a00", accent: "#ff3b30", brand: "#111", panel: "#ffffff", font: SANS, title: "特价清仓", sub: "周末限时 · 现货老价不涨", deco: "sale" },
    { id: "fin", name: "金融复盘", bg: "#0f1218", fg: "#d9dee8", mute: "#7a869c", accent: "#ff5c57", brand: "#1f5eff", panel: "rgba(255,255,255,.05)", font: SANS, title: "收盘复盘", sub: "上海 · 螺纹钢 3680 · +0.55%", deco: "fin" }
  ];
  const S = { i: 0, qn: 6, trend: true, comment: true, rn: 3, pm: "show", phone: true, hero: d.quotes[0].name, title: "" };
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const W = 1080, H = 1920;

  /* ---------- 绘图工具 ---------- */
  function rr(x, y, w, h, r, fill, stroke, lw) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); } }
  function txt(s, x, y, size, color, opts) { opts = opts || {}; ctx.font = `${opts.weight || 400} ${size}px ${opts.font || T().font}`; ctx.fillStyle = color; ctx.textAlign = opts.align || "left"; ctx.textBaseline = opts.base || "alphabetic"; if (opts.ls) ctx.letterSpacing = opts.ls + "px"; else ctx.letterSpacing = "0px"; ctx.fillText(s, x, y); }
  function wrap(s, x, y, size, color, maxW, lh, opts) { ctx.font = `${(opts && opts.weight) || 400} ${size}px ${T().font}`; let line = "", yy = y; for (const ch of s) { const test = line + ch; if (ctx.measureText(test).width > maxW && line) { txt(line, x, yy, size, color, opts); line = ch; yy += lh; } else line = test; } if (line) txt(line, x, yy, size, color, opts); return yy + lh; }
  function qr(x, y, size, dark, light) { const n = 25, c = size / n; let seed = 7; const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280); ctx.fillStyle = light; ctx.fillRect(x, y, size, size); ctx.fillStyle = dark; const fin = (fx, fy) => { ctx.fillStyle = dark; ctx.fillRect(x + fx * c, y + fy * c, c * 7, c * 7); ctx.fillStyle = light; ctx.fillRect(x + (fx + 1) * c, y + (fy + 1) * c, c * 5, c * 5); ctx.fillStyle = dark; ctx.fillRect(x + (fx + 2) * c, y + (fy + 2) * c, c * 3, c * 3); }; for (let yy = 0; yy < n; yy++) for (let xx = 0; xx < n; xx++) { const inF = (xx < 8 && yy < 8) || (xx > n - 9 && yy < 8) || (xx < 8 && yy > n - 9); if (inF) continue; if (rnd() > .55) ctx.fillRect(x + xx * c, y + yy * c, c, c); } fin(0, 0); fin(n - 7, 0); fin(0, n - 7); }
  function spark(x, y, w, h, arr, color) { const min = Math.min(...arr), max = Math.max(...arr), rng = max - min || 1; const pts = arr.map((v, i) => [x + i / (arr.length - 1) * w, y + h - (v - min) / rng * h]); ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.lineTo(pts[pts.length - 1][0], y + h + 10); ctx.lineTo(pts[0][0], y + h + 10); ctx.closePath(); const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, alpha(color, .33)); g.addColorStop(1, alpha(color, 0)); ctx.fillStyle = g; ctx.fill(); ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.strokeStyle = color; ctx.lineWidth = 6; ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.stroke(); pts.forEach((p, i) => { ctx.beginPath(); ctx.arc(p[0], p[1], i === pts.length - 1 ? 12 : 6, 0, 7); ctx.fillStyle = i === pts.length - 1 ? color : T().bg; ctx.fill(); ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.stroke(); }); }
  const T = () => THEMES[S.i];
  const alpha = (hex, a) => { let h = hex.replace("#", ""); if (h.length === 3) h = h.split("").map(c => c + c).join(""); const n = parseInt(h, 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
  const chgColor = (c, t) => c > 0 ? "#e5312b" : c < 0 ? "#0aa35a" : t.mute;
  const chgTxt = (c) => c > 0 ? `▲${c}` : c < 0 ? `▼${-c}` : "— 平";

  /* ---------- 主渲染 ---------- */
  function fitCanvas(h) {
    if (cv.height !== h) cv.height = h;
    const wrap = document.getElementById("wrap"), stage = document.querySelector(".stage");
    wrap.style.setProperty("--ar", `1080 / ${h}`); wrap.classList.toggle("long", h > 1920);
    // 长图在有限舞台高度内按比例缩小宽度
    const maxH = stage.clientHeight - 60; const wByH = maxH * 1080 / h; wrap.style.maxWidth = Math.max(160, Math.min(300, wByH)) + "px";
  }
  function render() {
    const t = T();
    if (t.deco === "navy") { renderNavy(t); return; }
    fitCanvas(H);
    const dark = ["screen", "ind", "mag", "fin"].includes(t.id);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = t.bg; ctx.fillRect(0, 0, W, H);
    // 装饰背景
    if (t.deco === "grid") { ctx.strokeStyle = "rgba(0,212,255,.08)"; ctx.lineWidth = 1; for (let i = 0; i < W; i += 60) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 900); ctx.stroke(); } for (let i = 0; i < 900; i += 60) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke(); } const g = ctx.createRadialGradient(W / 2, 0, 50, W / 2, 0, 900); g.addColorStop(0, "rgba(14,42,90,.9)"); g.addColorStop(1, "rgba(6,11,26,0)"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, 900); }
    if (t.deco === "red") { const g = ctx.createLinearGradient(0, 0, 0, 760); g.addColorStop(0, "#c8102e"); g.addColorStop(1, "#a30d24"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, 760); }
    if (t.deco === "hazard") { for (const yy of [0, H - 28]) { for (let i = -40; i < W + 40; i += 56) { ctx.fillStyle = "#ffb400"; ctx.beginPath(); ctx.moveTo(i, yy); ctx.lineTo(i + 28, yy); ctx.lineTo(i + 56, yy + 28); ctx.lineTo(i + 28, yy + 28); ctx.fill(); } } }
    if (t.deco === "ink") { ctx.strokeStyle = t.brand; ctx.lineWidth = 3; ctx.strokeRect(36, 36, W - 72, H - 72); ctx.lineWidth = 1; ctx.strokeStyle = "rgba(31,61,43,.4)"; ctx.strokeRect(48, 48, W - 96, H - 96); }
    if (t.deco === "sale") { ctx.strokeStyle = "rgba(0,0,0,.05)"; ctx.lineWidth = 14; for (let i = -H; i < W; i += 56) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + H, H); ctx.stroke(); } }
    if (t.deco === "mag") { const g = ctx.createRadialGradient(W - 100, 900, 50, W - 100, 900, 700); g.addColorStop(0, "#4a4a55"); g.addColorStop(1, "#0b0b0b"); ctx.fillStyle = g; ctx.fillRect(0, 300, W, 1000); }

    const pad = 72; let y = 96;
    // 品牌行
    const brandCol = t.deco === "red" ? "#fff" : t.fg;
    rr(pad, y - 40, 64, 64, 14, t.deco === "red" ? "#f5c451" : t.brand); txt(d.company.logoText, pad + 32, y + 6, 36, t.deco === "red" ? "#8e0b1f" : (t.brand === "#ffcc00" || t.brand === "#00d4ff" ? "#111" : "#fff"), { weight: 900, align: "center" });
    txt(d.company.short, pad + 84, y + 4, 34, brandCol, { weight: 700 });
    txt(`${d.date} ${d.weekday}`, W - pad, y + 2, 26, t.deco === "red" ? "rgba(255,255,255,.85)" : t.mute, { align: "right" });
    y += 110;
    // 标题
    const title = S.title || t.title;
    if (t.deco === "brief") { ctx.fillStyle = t.fg; ctx.fillRect(pad, y - 8, W - pad * 2, 4); ctx.fillRect(pad, y + 2, W - pad * 2, 2); y += 96; txt(title, W / 2, y, 112, t.fg, { weight: 900, align: "center", ls: 18 }); y += 40; txt(t.sub, W / 2, y, 24, t.mute, { align: "center", ls: 4, font: SANS }); y += 22; ctx.fillRect(pad, y, W - pad * 2, 2); ctx.fillRect(pad, y + 8, W - pad * 2, 4); y += 60; }
    else if (t.deco === "red") { y += 100; ctx.save(); ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 20; ctx.shadowOffsetY = 8; txt(title, W / 2, y, 150, "#f5c451", { weight: 900, align: "center", ls: 20, font: KAI }); ctx.restore(); y += 50; txt(t.sub, W / 2, y, 30, "rgba(255,255,255,.95)", { align: "center", ls: 6 }); y += 70; }

  document.getElementById("hero").onchange = e => { S.hero = e.target.value; render(); };
  document.getElementById("title").oninput = e => { S.title = e.target.value; render(); };
  document.querySelectorAll(".seg").forEach(seg => seg.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; seg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); const k = seg.dataset.k; S[k] = isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v; render(); }));
  document.querySelectorAll(".toggle").forEach(tg => tg.addEventListener("click", () => { tg.classList.toggle("on"); S[tg.dataset.k] = tg.classList.contains("on"); render(); }));
  window.go = i => { S.i = (i + THEMES.length) % THEMES.length; render(); document.querySelector(".stage").classList.add("moved"); };
  window.step = dx => go(S.i + dx);
  window.tab = (i, b) => { document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b)); document.querySelectorAll(".pane").forEach((p, k) => p.classList.toggle("on", k === i)); };
  // 滑动
  let sx = null; const wrapEl = document.getElementById("wrap");
  wrapEl.addEventListener("touchstart", e => sx = e.touches[0].clientX, { passive: true });
  wrapEl.addEventListener("touchend", e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1); sx = null; });
  wrapEl.addEventListener("mousedown", e => sx = e.clientX); wrapEl.addEventListener("mouseup", e => { if (sx === null) return; const dx = e.clientX - sx; if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1); sx = null; });
  window.save = (mode) => { const url = cv.toDataURL("image/png"); document.getElementById("saveimg").src = url; document.getElementById("dl").href = url; document.getElementById("dl").download = `hdz-${T().id}-${d.date}.png`; document.getElementById("savet").textContent = mode === "wx" ? "海报已生成 · 发送到微信" : `海报已生成（1080×${cv.height}）`; document.getElementById("save").classList.add("show"); };

  const qsP = new URLSearchParams(location.search), qsI = qsP.get("style"); if (qsI) { const k = THEMES.findIndex(t => t.id === qsI); if (k >= 0) S.i = k; }
  if (qsP.get("back") && history.length > 1) { const bk = document.getElementById("back"); bk.textContent = "‹ 返回落地页"; bk.onclick = e => { e.preventDefault(); history.back(); }; }
  // ?raw=1：仅输出原尺寸画布（用于导出校验/自动化截图）
  if (qsP.get("raw")) { render(); document.body.innerHTML = ""; document.body.style.background = "#000"; document.body.appendChild(cv); cv.style.cssText = "display:block;width:1080px;height:auto"; }
  else { render(); window.addEventListener("resize", render); if (document.fonts && document.fonts.ready) document.fonts.ready.then(render); }
</script>
</body>

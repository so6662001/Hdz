<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>销售企微 H5</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  .lay { display: grid; grid-template-columns: minmax(260px, 1fr) 400px minmax(260px, 1fr); gap: 18px; align-items: start; }
  .lay .card + .card { margin-top: 14px; }
  .lay h4 { font-size: 13px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .lay ul { padding-left: 16px; font-size: 12.5px; color: var(--text-2); line-height: 1.8; }
  .lay .card-b p { font-size: 12.5px; color: var(--text-2); line-height: 1.7; }
  .links a { display: block; padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 12.5px; } .links a:last-child { border: 0; }
  .links code { color: var(--text-3); }
  .push { display: flex; flex-direction: column; gap: 6px; } .push button { text-align: left; }

  /* 手机壳（企业微信容器内的 H5） */
  .frame { width: 390px; height: 800px; background: #1c2430; border-radius: 34px; padding: 10px; margin: 0 auto; position: relative; }
  .screen { width: 100%; height: 100%; background: #f4f6f8; border-radius: 26px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
  .sbar { height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 6px 22px 0; font-size: 12.5px; font-weight: 600; color: #fff; background: #2a3441; }
  .wxbar { height: 44px; background: #2a3441; color: #fff; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 15px; font-weight: 600; }
  .wxbar .bk { cursor: pointer; display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; border-radius: 4px; } .wxbar .bk:hover { background: #3a4656; }
  .wxbar .bk svg.i { width: 20px; height: 20px; transform: rotate(180deg); }
  .wxbar .t { flex: 1; text-align: center; padding-right: 28px; }
  .wxbar .who { font-size: 11px; font-weight: 400; color: #b7c0cc; }
  .body { flex: 1; overflow-y: auto; padding: 10px 12px 14px; } .body::-webkit-scrollbar { width: 0; }
  .tabbar { height: 62px; border-top: 1px solid var(--border); background: #fff; display: flex; padding-bottom: 6px; }
  .tabbar button { flex: 1; border: 0; background: none; font-size: 10.5px; color: var(--text-3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; position: relative; }
  .tabbar button svg.i { width: 21px; height: 21px; }
  .tabbar button.on { color: var(--primary); font-weight: 600; }
  .tabbar button .dot { position: absolute; top: 6px; right: 20px; min-width: 16px; height: 16px; border-radius: 4px; background: var(--hot); color: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; padding: 0 4px; font-weight: 700; }

  .mc { background: #fff; border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; border: 1px solid var(--border); }
  .mc h5 { margin: 0 0 8px; font-size: 13px; display: flex; align-items: center; gap: 6px; } .mc h5 .r { margin-left: auto; font-weight: 400; font-size: 11px; color: var(--text-3); }
  .mc.hot { border-left: 3px solid var(--hot); } .mc.ai { border-left: 3px solid var(--ai); } .mc.ok { border-left: 3px solid var(--success); } .mc.warn { border-left: 3px solid var(--warning); }
  .stat4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; } .stat4 div { cursor: pointer; padding: 6px 0; border-radius: var(--radius-sm); } .stat4 div:hover { background: var(--steel-weak); }
  .stat4 b { display: block; font-size: 22px; line-height: 1.1; } .stat4 b.hot { color: var(--hot); } .stat4 span { font-size: 10.5px; color: var(--text-3); }
  .li { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--steel-weak); cursor: pointer; align-items: flex-start; } .li:first-of-type { border-top: 0; }
  .li .av { width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--steel-weak); display: grid; place-items: center; font-weight: 700; font-size: 14px; color: var(--text-2); flex: none; position: relative; }
  .li .av .pf { position: absolute; right: -4px; bottom: -4px; transform: scale(.8); }
  .li .m { flex: 1; min-width: 0; } .li .n { display: flex; align-items: center; gap: 6px; font-size: 13.5px; } .li .n b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .li .n .t { margin-left: auto; font-size: 11px; color: var(--text-4); font-weight: 400; }
  .li .p { font-size: 12px; color: var(--text-3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .li .tags { margin-top: 4px; display: flex; gap: 4px; flex-wrap: wrap; }
  .tag.xs { font-size: 10.5px; padding: 0 5px; }
  .bigbtn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 11px; border: 0; border-radius: var(--radius-sm); background: var(--primary); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  .bigbtn.ghost { background: #fff; color: var(--primary); border: 1px solid var(--border-2); } .bigbtn.hot { background: var(--hot); } .bigbtn.danger { background: #fff; color: var(--danger); border: 1px solid #e8b4b0; }
  .bigbtn:disabled { background: var(--border-2); color: #fff; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .row2 .bigbtn, .row3 .bigbtn { padding: 9px 6px; font-size: 13px; }
  .seg { display: flex; border: 1px solid var(--border-2); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 10px; background: #fff; } .seg button { flex: 1; border: 0; background: none; padding: 7px 0; font-size: 12px; color: var(--text-3); cursor: pointer; } .seg button.on { background: var(--text); color: #fff; font-weight: 600; }
  /* 聊天 */
  .chatwrap { display: flex; flex-direction: column; height: 100%; }
  .chatwrap .msgs { flex: 1; overflow-y: auto; padding: 10px 12px; } .chatwrap .msgs::-webkit-scrollbar { width: 0; }
  .chatwrap .msg { max-width: 86%; } .chatwrap .bubble { font-size: 13px; padding: 7px 10px; }
  .sysline { text-align: center; font-size: 11px; color: var(--text-4); margin: 6px 0; } .sysline span { background: var(--steel-weak); padding: 2px 8px; border-radius: 3px; display: inline-block; }
  .composer { border-top: 1px solid var(--border); background: #fff; padding: 8px 10px; }
  .sugg { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; } .sugg::-webkit-scrollbar { height: 0; }
  .sugg .s { flex: none; max-width: 240px; border: 1px solid #d7d2f0; background: var(--ai-weak); color: #3b2f8a; border-radius: var(--radius-sm); padding: 5px 8px; font-size: 11.5px; cursor: pointer; line-height: 1.4; } .sugg .s .lb { display: block; font-weight: 700; font-size: 10.5px; color: var(--ai); }
  .composer textarea { width: 100%; border: 1px solid var(--border-2); border-radius: var(--radius-sm); padding: 6px 8px; font-size: 13px; resize: none; height: 56px; font-family: inherit; outline: none; } .composer textarea:focus { border-color: var(--primary); }
  .composer .bar { display: flex; gap: 6px; align-items: center; margin-top: 6px; } .composer .bar .btn { padding: 3px 8px; font-size: 12px; }
  .lock { background: var(--warning-weak); color: #7a4a06; font-size: 11.5px; padding: 6px 12px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid #f2d9a3; }
  /* 审核 */
  .ap textarea { width: 100%; border: 1px solid var(--border-2); border-radius: var(--radius-sm); padding: 8px; font-size: 13px; line-height: 1.6; height: 108px; resize: none; font-family: inherit; outline: none; background: var(--ai-weak); }
  .ap .trig { background: var(--steel-weak); border-radius: var(--radius-sm); padding: 6px 8px; font-size: 12px; color: var(--text-2); }
  .ap .due { font-size: 11px; color: var(--hot); font-weight: 600; }
  /* 投喂 */
  .ways { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; } .ways div { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 4px 8px; text-align: center; font-size: 11.5px; cursor: pointer; background: #fff; color: var(--text-2); } .ways div svg.i { display: block; margin: 0 auto 6px; width: 22px; height: 22px; color: var(--primary); } .ways div:hover { border-color: var(--primary); }
  .raw { background: var(--steel-weak); border-radius: var(--radius-sm); padding: 6px 8px; font-size: 11.5px; color: var(--text-2); line-height: 1.55; max-height: 88px; overflow: auto; }
  .ex { display: grid; grid-template-columns: 78px 1fr; gap: 6px 8px; font-size: 12.5px; align-items: center; } .ex label { color: var(--text-3); font-size: 11.5px; } .ex input { width: 100%; }
  .ex input.miss { border-color: var(--warning); background: var(--warning-weak); }
  .thinking { display: inline-flex; gap: 3px; vertical-align: middle; } .thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--ai); animation: bl 1s infinite; } .thinking i:nth-child(2) { animation-delay: .2s } .thinking i:nth-child(3) { animation-delay: .4s } @keyframes bl { 0%, 80%, 100% { opacity: .2 } 40% { opacity: 1 } }
  .rec { text-align: center; padding: 18px 0; } .rec .mic { width: 64px; height: 64px; border-radius: 50%; background: var(--hot); color: #fff; display: grid; place-items: center; margin: 0 auto 8px; animation: pulse 1s infinite; } .rec .mic svg.i { width: 28px; height: 28px; } @keyframes pulse { 50% { opacity: .6 } }
  /* 线索详情 */
  .kv2 { display: grid; grid-template-columns: 64px 1fr; gap: 4px 8px; font-size: 12.5px; } .kv2 span:nth-child(odd) { color: var(--text-3); }
  .tl2 { border-left: 2px solid var(--border); padding-left: 10px; margin-left: 4px; } .tl2 div { font-size: 12px; padding: 3px 0; color: var(--text-2); } .tl2 div small { color: var(--text-4); margin-right: 6px; }
  /* 企微通知横幅 */
  .notif { position: absolute; left: 10px; right: 10px; top: 42px; background: #fff; border: 1px solid var(--border); border-left: 3px solid var(--hot); border-radius: var(--radius); padding: 8px 12px; font-size: 12px; z-index: 5; cursor: pointer; box-shadow: var(--shadow-lg); display: flex; gap: 8px; align-items: center; }
  .notif b { display: block; font-size: 12.5px; } .notif .from { color: var(--text-4); font-size: 10.5px; }
  .notif svg.i { color: var(--hot); flex: none; }
  .empty.sm { padding: 24px 0; font-size: 12px; }
</style>
</head>
<body>
<script src="shared/data.js"></script><script src="shared/engine.js"></script><script src="shared/app.js"></script>
<script>
const me = App.me(); const root = App.mount({ active: 'mobile', title: '销售企微 H5' });
const isMine = l => me.role === 'admin' || l.owner === me.id;
const myLeads = () => ACQ.leads.filter(isMine);
const myConvs = () => ACQ.conversations.filter(c => { const l = ACQ.lead(c.leadId); return l && isMine(l); });
const myAps = () => ACQ.approvals.filter(a => a.status === 'PENDING' && (me.role === 'admin' || a.assignee === me.id));
const myFus = () => ACQ.followUps.filter(f => f.status === 'PENDING' && f.type !== 'FLOW_TIMER' && (me.role === 'admin' || f.owner === me.id) && ACQ.lead(f.leadId));
const myIntake = () => ACQ.intake.filter(i => me.role === 'admin' || i.by === me.id);
const TABS = [['home', 'grid', '待办'], ['conv', 'chat', '会话'], ['approve', 'check', '审核'], ['feed', 'camera', '投喂'], ['leads', 'users', '线索']];
const TITLE = { home: '货袋子获客', conv: '会话', approve: '审核', feed: '投喂线索', leads: '我的线索' };
let V = { tab: qs('tab', 'home'), conv: qs('c', null), lead: qs('lead', null), leadFilter: 'ALL', feedKind: null, feedText: '', rec: false };
if (V.conv) V.tab = 'conv'; if (V.lead) V.tab = 'leads';

/* ---------- 页面外框 ---------- */
root.innerHTML = App.pageHead('销售企微 H5', '销售不装新 App：企业微信「工作台」里的一个 H5 应用（Q16 = C）。所有需要人处理的事——待人工会话、报价审核、到期跟进、现场投喂——都以企微消息推送并深链到这里，一次点击就能处理。', `<a class="btn" href="workbench.html">${App.icon('chat')} 后台会话工作台</a><a class="btn" href="app.html">${App.icon('tablet')} 执行端 App</a>`) + `
<div class="lay">
  <div>
    <div class="card"><div class="card-b"><h4>${App.icon('info')} 为什么是企微 H5，而不是独立 App</h4><ul><li>销售已在企微里收客户消息、看审批，H5 免安装、免登录（企微 OAuth 身份 = 后台负责人）。</li><li>所有提醒都是企微应用消息：<b>待人工 / 待审核 / 到期跟进 / 高意向</b>，点开即深链到对应卡片。</li><li>只做「处理」不做「配置」：话术、流程、渠道、风控仍在后台管理端。</li><li>与执行端 App 分工：执行端跑在工作手机上替人操作微信；H5 是销售本人的手机。</li></ul></div></div>
    <div class="card"><div class="card-b"><h4>${App.icon('phone')} 现场高频动作（Q13 / Q15）</h4><ul><li><b>打电话</b>：线索详情一键拨号，挂断后 30 秒内弹「记录结果」，接通 / 未接 / 拒绝分支自动推进 SOP。</li><li><b>拍铭牌 / 名片</b>：投喂页拍照 → OCR → AI 抽取项目 / 企业 / 联系人 → 确认即入库，自动关联到项目档案。</li><li><b>语音速记</b>：走访结束说 30 秒，转写后抽取企业名 / 吨位 / 规格 / 联系电话。</li><li><b>报线索</b>：介绍人扫码提交的线索归到对应销售，成交后按规则分成（Q12，线下结算）。</li></ul></div></div>
    <div class="card"><div class="card-b"><h4>${App.icon('link')} 深链参数</h4><div class="links"><a href="mobile.html?tab=home"><code>?tab=home</code> 今日待办</a><a href="mobile.html?tab=conv"><code>?tab=conv</code> 待人工会话</a><a href="mobile.html?c=C1"><code>?c=C1</code> 直接打开某会话</a><a href="mobile.html?tab=approve"><code>?tab=approve</code> 待审核</a><a href="mobile.html?tab=feed"><code>?tab=feed</code> 投喂（拍照 / 语音）</a><a href="mobile.html?lead=L033"><code>?lead=L033</code> 线索详情（可拨号）</a></div></div></div>
  </div>
  <div class="frame"><div class="screen" id="screen"></div></div>
  <div>
    <div class="card"><div class="card-b"><h4>${App.icon('bell')} 模拟企微推送 → 深链</h4><p class="mb8">点一下，手机顶部出现企微应用消息横幅；点横幅直达对应卡片。这就是销售日常的入口。</p><div class="push">
      <button class="btn" onclick="pushNotice('quote')">${App.icon('coin')} 客户询价，AI 已草拟报价待审核</button>
      <button class="btn" onclick="pushNotice('human')">${App.icon('chat')} 客户消息无话术命中，需人工</button>
      <button class="btn" onclick="pushNotice('call')">${App.icon('phone')} SOP 到电话节点：请拨打 李工</button>
      <button class="btn" onclick="pushNotice('hot')">${App.icon('flame')} 高意向：项目线索评分升到 90+</button>
      <button class="btn" onclick="pushNotice('referral')">${App.icon('handshake')} 介绍人报送了一条新线索</button>
    </div></div></div>
    <div class="card"><div class="card-b"><h4>${App.icon('users')} 当前视角</h4><p>${me.role === 'admin' ? '管理员 <b>陈总</b>：看到全部销售的会话 / 审核 / 线索（用于演示）。切到右上角「销售·张三」可看到销售本人的收窄视图。' : '销售 <b>张三</b>：只看到分配给自己的线索、会话、审核与投喂记录，这是真实的使用视角。'}</p><p class="mt8 muted xs">数据与后台其他页面同源（localStorage）：在这里采纳的报价、记录的电话、确认的投喂，会立刻出现在会话工作台 / 线索 / 项目页。</p></div></div>
  </div>
</div>`;

/* ---------- 手机渲染 ---------- */
function go(tab, extra) { V.tab = tab; V.conv = null; V.lead = null; Object.assign(V, extra || {}); history.replaceState(null, '', '?tab=' + tab + (V.conv ? '&c=' + V.conv : '') + (V.lead ? '&lead=' + V.lead : '')); render(); }
function render() {
  const s = $('#screen'); const aps = myAps(), needH = myConvs().filter(c => c.status === 'NEED_HUMAN'), pendIn = myIntake().filter(i => i.status === 'PENDING' || i.status === 'EXTRACTING');
  const badge = { conv: needH.length, approve: aps.length, feed: pendIn.length };
  let title = TITLE[V.tab], back = null, body = '';
  if (V.tab === 'conv' && V.conv) { const c = ACQ.conversations.find(x => x.id === V.conv); const l = ACQ.lead(c.leadId); title = l.nickname; back = () => go('conv'); body = chatView(c, l); }
  else if (V.tab === 'leads' && V.lead) { const l = ACQ.lead(V.lead); title = '线索详情'; back = () => go('leads'); body = leadView(l); }
  else body = `<div class="body">${{ home: homeView, conv: convList, approve: approveView, feed: feedView, leads: leadList }[V.tab]()}</div>`;
  s.innerHTML = `<div class="sbar"><span>${fmt.hm(Date.now())}</span><span>企业微信 · 5G</span></div><div class="wxbar">${back ? `<span class="bk" id="bk">${App.icon('arrow')}</span>` : '<span style="width:28px"></span>'}<span class="t">${esc(title)}${!back ? `<div class="who">${me.name} · 华东钢贸</div>` : ''}</span><span class="bk">···</span></div>${body}<div class="tabbar">${TABS.map(t => `<button class="${V.tab === t[0] ? 'on' : ''}" onclick="go('${t[0]}')">${App.icon(t[1])}${t[2]}${badge[t[0]] ? `<span class="dot">${badge[t[0]]}</span>` : ''}</button>`).join('')}</div>`;
  if (back) $('#bk').onclick = back;
  const ms = $('.msgs'); if (ms) ms.scrollTop = ms.scrollHeight;
}

/* 待办 */
function homeView() {
  const aps = myAps(), needH = myConvs().filter(c => c.status === 'NEED_HUMAN'), fus = myFus().filter(f => f.dueAt <= Date.now() + ACQ.D), pendIn = myIntake().filter(i => i.status === 'PENDING');
  const items = [];
  aps.forEach(a => items.push({ t: a.dueAt, cls: 'hot', ic: 'coin', title: `审核 · ${ACQ.lead(a.leadId).nickname}`, sub: `「${a.triggerText.slice(0, 26)}」 · ${fmt.left(a.dueAt)}升级`, go: () => go('approve') }));
  needH.forEach(c => { const l = ACQ.lead(c.leadId); const last = c.messages[c.messages.length - 1]; items.push({ t: c.lastAt, cls: 'hot', ic: 'chat', title: `待人工 · ${l.nickname}`, sub: last.text.slice(0, 30), go: () => go('conv', { conv: c.id }) }); });
  fus.forEach(f => { const l = ACQ.lead(f.leadId); items.push({ t: f.dueAt, cls: f.type === 'CALL' || f.type === 'FLOW_HUMAN_TASK' ? 'warn' : '', ic: f.type === 'CALL' ? 'phone' : 'clock', title: `${f.type === 'CALL' ? '电话' : '跟进'} · ${l.nickname}`, sub: `${f.note || ({ NO_REPLY: '未回复自动跟进', CONSIDERING: '客户说再考虑', FLOW_HUMAN_TASK: '流程人工任务' })[f.reason] || '跟进'} · ${f.dueAt < Date.now() ? '<span style="color:var(--danger)">已逾期</span>' : fmt.left(f.dueAt)}`, go: () => go('leads', { lead: l.id }) }); });
  items.sort((a, b) => a.t - b.t); window.__home = items;
  const hot = myLeads().filter(l => l.stage === 'HOT' || (l.score >= 85 && ['NEW', 'CONTACTED', 'REPLIED'].includes(l.stage))).slice(0, 3);
  return `<div class="mc"><h5>今日<span class="r">${fmt.date(Date.now())} · ${me.name}</span></h5><div class="stat4"><div onclick="go('conv')"><b class="${needH.length ? 'hot' : ''}">${needH.length}</b><span>待人工</span></div><div onclick="go('approve')"><b class="${aps.length ? 'hot' : ''}">${aps.length}</b><span>待审核</span></div><div onclick="go('leads',{leadFilter:'TODO'})"><b>${fus.length}</b><span>今日跟进</span></div><div onclick="go('feed')"><b>${pendIn.length}</b><span>待确认投喂</span></div></div></div>
  <div class="mc"><h5>${App.icon('flame')} 现在要处理<span class="r">按紧急度</span></h5>${items.slice(0, 8).map((i, k) => `<div class="li" onclick="__home[${k}].go()"><span class="av" style="${i.cls === 'hot' ? 'background:var(--hot-weak);color:var(--hot)' : i.cls === 'warn' ? 'background:var(--warning-weak);color:var(--warning)' : ''}">${App.icon(i.ic)}</span><div class="m"><div class="n"><b>${esc(i.title)}</b></div><div class="p">${i.sub}</div></div></div>`).join('') || '<div class="empty sm">今天没有待处理事项</div>'}</div>

  const F = [['ALL', '全部'], ['HOT', '高意向'], ['PROJECT', '项目'], ['COMPANY', '企业'], ['TODO', '待跟进']];
  let list = myLeads().filter(l => !['LOST', 'IGNORED'].includes(l.stage));
  if (V.leadFilter === 'HOT') list = list.filter(l => l.stage === 'HOT' || l.score >= 85); else if (V.leadFilter === 'PROJECT') list = list.filter(l => l.projectId || l.leadType === 'PROJECT'); else if (V.leadFilter === 'COMPANY') list = list.filter(l => l.companyId || l.leadType === 'COMPANY'); else if (V.leadFilter === 'TODO') { const ids = new Set(myFus().map(f => f.leadId)); list = list.filter(l => ids.has(l.id)); }
  list.sort((a, b) => b.score - a.score);
  return `<div class="seg">${F.map(f => `<button class="${V.leadFilter === f[0] ? 'on' : ''}" onclick="V.leadFilter='${f[0]}';render()">${f[1]}</button>`).join('')}</div><div class="mc" style="padding:4px 14px">${list.slice(0, 30).map(l => `<div class="li" onclick="go('leads',{lead:'${l.id}'})"><span class="av">${esc((l.nickname || '?')[0])}${UI.platform(l.platform)}</span><div class="m"><div class="n"><b>${esc(l.nickname || '（无昵称）')}</b>${UI.score(l.score)}<span class="t">${fmt.ago(l.lastActiveAt || l.createdAt)}</span></div><div class="p">${esc(l.company || l.sourceChannel || '')}${l.product ? ' · ' + esc(l.product) : ''}</div><div class="tags">${UI.leadType(l.leadType)}${UI.stage(l.stage).replace('class="tag', 'class="tag xs')}${l.projectId && ACQ.project(l.projectId) ? `<span class="tag xs">${esc(ACQ.project(l.projectId).name.slice(0, 12))}</span>` : ''}</div></div></div>`).join('') || '<div class="empty sm">没有线索</div>'}</div>`;
}
function leadView(l) {
  const p = l.projectId && ACQ.project(l.projectId), co = l.companyId && ACQ.company(l.companyId), c = ACQ.convOf(l.id), inst = ACQ.instanceOf(l.id), def = inst && ACQ.flow(inst.flowId); const fus = ACQ.followUps.filter(f => f.leadId === l.id && f.status === 'PENDING');
  const atCall = inst && def && def.nodes[inst.currentNode] && def.nodes[inst.currentNode].type === 'Call';
  return `<div class="body"><div class="mc"><div class="row" style="gap:8px"><span class="av" style="width:44px;height:44px;border-radius:4px;background:var(--steel-weak);display:grid;place-items:center;font-weight:700;font-size:18px">${esc((l.nickname || '?')[0])}</span><div style="flex:1"><div class="row" style="gap:6px"><b style="font-size:16px">${esc(l.nickname)}</b>${UI.leadType(l.leadType)}${UI.stage(l.stage)}</div><div class="xs muted">${esc(l.role || '')}${l.company ? ' · ' + esc(l.company) : ''}</div></div>${UI.score(l.score)}</div>
    ${atCall ? `<div class="alert warn xs mt8">${App.icon('phone')} 流程「${esc(def.name)}」在电话节点：${esc(Engine.flow.label(def, inst.currentNode))}，请拨打并记录结果</div>` : ''}
    <div class="row3 mt12"><button class="bigbtn ${atCall ? 'hot' : ''}" onclick="App.recordCall('${l.id}',{onDone:render})" ${l.phone ? '' : 'title="无电话"'}>${App.icon('phone')} 打电话</button><button class="bigbtn ghost" onclick="${c ? `go('conv',{conv:'${c.id}'})` : `toast('该线索没有在线会话，先加微信 / 企微','warn')`}">${App.icon('chat')} 发消息</button><button class="bigbtn ghost" onclick="stageDlg('${l.id}')">${App.icon('arrow')} 改阶段</button></div></div>
  <div class="mc"><h5>资料</h5><div class="kv2">${l.phone ? `<span>电话</span><span class="mono">${esc(l.phone)}</span>` : ''}<span>来源</span><span>${UI.platform(l.platform, true)} · ${esc(l.sourceChannel || '')}</span>${l.sourceExcerpt ? `<span>原文</span><span>${esc(l.sourceExcerpt)}</span>` : ''}<span>意图</span><span>${UI.intent(l.intent)}</span>${l.product ? `<span>产品</span><span>${esc(l.product)}</span>` : ''}${l.region ? `<span>地区</span><span>${esc(l.region)}</span>` : ''}<span>负责人</span><span>${ACQ.user(l.owner).name}</span></div></div>
  ${p ? `<div class="mc hot"><h5>${App.icon('crane')} 项目<span class="r"><a onclick="location.href='projects.html?open=${p.id}'">项目档案 →</a></span></h5><b>${esc(p.name)}</b><div class="kv2 mt8"><span>阶段</span><span>${esc(p.stageText || p.stage)}</span><span>用钢量</span><span>${p.estTon ? `${fmt.num(p.estTon[0])}–${fmt.num(p.estTon[1])} 吨` : '—'}</span><span>窗口</span><span>${esc((p.window || {}).text || '—')}</span><span>总包</span><span>${esc(p.contractorOrg || '—')}</span><span>距离</span><span>${p.distanceKm} km</span></div>${p.nextAction ? `<div class="xs mt8" style="color:var(--hot)">下一步：${esc(p.nextAction)}</div>` : ''}</div>` : ''}
  ${co ? `<div class="mc"><h5>${App.icon('building')} 企业<span class="r"><a onclick="location.href='companies.html?open=${co.id}'">企业档案 →</a></span></h5><b>${esc(co.name)}</b><div class="kv2 mt8"><span>类型</span><span>${({ CONTRACTOR: '施工总包', MANUFACTURER: '制造企业', PROCESSING: '加工厂', PROCESSING_CENTER: '二级配送 / 加工中心', DEVELOPER: '开发商' })[co.type] || co.type}</span><span>月用量</span><span>${co.estMonthlyTon ? co.estMonthlyTon + ' 吨' : '—'}</span><span>信用</span><span>${co.credit && co.credit.level === 'WARN' ? `<span style="color:var(--danger)">${esc(co.credit.text)}</span>` : '正常'}</span></div></div>` : ''}
  ${inst ? `<div class="mc ai"><h5>${App.icon('route')} 跟进流程<span class="r">${UI.status(inst.status).replace('class="tag', 'class="tag xs')}</span></h5><div class="small">${esc(def.name)} · 当前 <b>${esc(Engine.flow.label(def, inst.currentNode))}</b></div></div>` : ''}
  ${fus.length ? `<div class="mc warn"><h5>${App.icon('clock')} 待办</h5>${fus.map(f => `<div class="li"><div class="m"><div class="n"><b>${esc(f.note || ({ NO_REPLY: '未回复自动跟进', CONSIDERING: '客户说再考虑' })[f.reason] || '跟进')}</b><span class="t">${f.dueAt < Date.now() ? '<span style="color:var(--danger)">已逾期</span>' : fmt.left(f.dueAt)}</span></div></div><button class="btn sm" onclick="doneFu('${f.id}')">完成</button></div>`).join('')}</div>` : ''}
  ${(l.calls || []).length ? `<div class="mc"><h5>${App.icon('phone')} 通话</h5>${l.calls.slice(0, 4).map(k => `<div class="li"><div class="m"><div class="n"><b>${Engine.flow.CALL_RESULTS[k.result] || k.result}</b>${k.dur ? `<span class="xs muted">${Math.round(k.dur / 60)} 分钟</span>` : ''}<span class="t">${fmt.time(k.t)}</span></div>${k.note ? `<div class="p" style="white-space:normal">${esc(k.note)}</div>` : ''}</div></div>`).join('')}</div>` : ''}
  <div class="mc"><h5>时间线</h5><div class="tl2">${(l.events || []).slice(0, 8).map(e => `<div><small>${fmt.time(e.t)}</small>${esc(e.text)}</div>`).join('') || '<div class="muted">—</div>'}</div></div></div>`;
}
function stageDlg(id) { const l = ACQ.lead(id); Modal.open({ title: '修改阶段', body: `<div class="field"><label>阶段</label><select class="select" id="st">${['NEW', 'CONTACTED', 'REPLIED', 'HOT', 'WON', 'LOST'].map(s => `<option value="${s}" ${l.stage === s ? 'selected' : ''}>${UI.stage(s).replace(/<[^>]+>/g, '')}</option>`).join('')}</select></div><div class="field"><label>备注</label><input class="input" id="nt" placeholder="例如：已约周二上门"></div>`, footer: '<button class="btn" data-close>取消</button><button class="btn primary" id="ok">保存</button>', onMount(m, close) { $('#ok', m).onclick = () => { l.stage = $('#st', m).value; if (l.stage === 'WON') l.wonAt = Date.now(); ACQ.addEvent(l, { type: 'STAGE', text: `企微 H5 改阶段 → ${UI.stage(l.stage).replace(/<[^>]+>/g, '')}${$('#nt', m).value ? ' · ' + $('#nt', m).value : ''}`, cls: 'user' }); ACQ.save(); close(); render(); toast('已更新', 'ok'); }; } }); }
function doneFu(id) { const f = ACQ.followUps.find(x => x.id === id); f.status = 'DONE'; f.doneAt = Date.now(); ACQ.save(); render(); toast('待办已完成', 'ok'); }

/* ---------- 企微推送模拟 ---------- */
function pushNotice(kind) {
  let n;
  if (kind === 'quote') { let a = myAps().find(x => x.type === 'QUOTE'); if (!a) { const l = myLeads().find(x => x.stage === 'REPLIED' || x.stage === 'HOT') || myLeads()[0]; const c = ACQ.convOf(l.id); a = { id: 'AP' + Date.now().toString(36).toUpperCase(), leadId: l.id, convId: c ? c.id : null, type: 'QUOTE', assignee: l.owner, status: 'PENDING', createdAt: Date.now(), dueAt: Date.now() + 2 * ACQ.H, triggerText: '多少钱一吨？发到苏州', aiSuggestion: `${l.nickname}，今日苏州仓 HRB400 Φ20 出厂价 3,850 元/吨（含税），量大可谈；园区内送到约 +30/吨。（AI 依据企业资料库「今日价格表」，请核实后发送）` }; ACQ.approvals.unshift(a); if (c) { c.status = 'NEED_HUMAN'; c.needHumanReason = 'APPROVAL'; } } n = { title: `【待审核】${ACQ.lead(a.leadId).nickname} 询价`, text: '「' + a.triggerText + '」AI 已草拟报价，2 小时内未处理升级主管', go: () => go('approve') }; }
  if (kind === 'human') { let c = myConvs().find(x => x.status === 'NEED_HUMAN' && x.needHumanReason === 'NO_MATCH'); if (!c) { c = myConvs().find(x => x.status === 'AUTO') || myConvs()[0]; const l = ACQ.lead(c.leadId); c.messages.push({ id: c.id + '-' + (c.messages.length + 1), dir: 'IN', from: 'CUSTOMER', text: '你们能做定尺切割吗？12 米的', t: Date.now(), read: false, match: { source: 'LLM', confidence: 0.52 } }); c.lastAt = Date.now(); c.status = 'NEED_HUMAN'; c.needHumanReason = 'NO_MATCH'; l.replyCount = (l.replyCount || 0) + 1; } n = { title: `【待人工】${ACQ.lead(c.leadId).nickname}`, text: c.messages[c.messages.length - 1].text + ' · 无话术命中，机器已暂停', go: () => go('conv', { conv: c.id }) }; }
  if (kind === 'call') { const l = ACQ.lead('L033') || myLeads().find(x => x.phone); if (l && !ACQ.followUps.some(f => f.leadId === l.id && f.type === 'CALL' && f.status === 'PENDING')) ACQ.followUps.unshift({ id: 'FU' + Date.now().toString(36), leadId: l.id, owner: l.owner, type: 'CALL', reason: 'FLOW_HUMAN_TASK', dueAt: Date.now() + 4 * ACQ.H, status: 'PENDING', note: '中标后首呼（开场白 124）' }); n = { title: `【请拨打】${l.nickname} · ${l.company || ''}`, text: '项目跟进 SOP 到电话节点，24 小时内完成并记录结果', go: () => go('leads', { lead: l.id }) }; }
  if (kind === 'hot') { const l = myLeads().filter(x => x.projectId).sort((a, b) => b.score - a.score)[0] || myLeads()[0]; l.score = Math.max(l.score, 91); if (['NEW', 'CONTACTED', 'REPLIED'].includes(l.stage)) l.stage = 'HOT'; n = { title: `【高意向】${l.nickname} 评分 ${l.score}`, text: (l.projectId ? ACQ.project(l.projectId).name + ' · ' : '') + '多信号叠加：招标 + 施工许可 + 询价', go: () => go('leads', { lead: l.id }) }; }
  if (kind === 'referral') { const rf = ACQ.referrers[0]; const lid = 'L' + String(ACQ.leads.length + 1).padStart(3, '0'); ACQ.leads.push({ id: lid, nickname: '钱经理', leadType: 'PERSON', role: '采购', platform: 'PHONE', sourceType: 'REFERRAL', sourceCode: 'R1_REFERRAL', sourceChannel: `介绍人-${rf.name}`, sourceExcerpt: '常熟一个钢结构厂，月用 200 吨 Q355B', intent: 'INQUIRY', score: 78, stage: 'NEW', owner: me.role === 'admin' ? 2 : me.id, product: 'Q355B 中板', region: '常熟', phone: '139****2201', company: '常熟某钢结构有限公司', tags: ['介绍人'], events: [{ t: Date.now(), cls: 'sys', text: `介绍人 ${rf.name} 扫码报送` }], createdAt: Date.now(), lastActiveAt: Date.now() }); ACQ.referrals.unshift({ id: 'RL' + Date.now().toString(36).toUpperCase(), referrerId: rf.id, t: Date.now(), projectId: null, leadId: lid, text: '常熟某钢结构有限公司，月用 200 吨 Q355B，钱经理 139****2201', status: 'NEW', ton: null, amount: null, accrued: 0, via: 'QR_FORM' }); rf.referred++; n = { title: `【新线索】介绍人 ${rf.name} 报送`, text: '常熟某钢结构有限公司 · 钱经理 · 月用 200 吨 Q355B，请 24 小时内首触', go: () => go('leads', { lead: lid }) }; }
  ACQ.notices.unshift({ t: Date.now(), cls: 'flow', text: n.title + ' ' + n.text, link: 'mobile.html' }); ACQ.save(); render();
  const old = $('.notif'); if (old) old.remove();
  const d = document.createElement('div'); d.className = 'notif'; d.innerHTML = `${App.icon('bell')}<div style="flex:1;min-width:0"><span class="from">货袋子获客 · 企微应用消息 · 刚刚</span><b>${esc(n.title)}</b><div class="ell">${esc(n.text)}</div></div>`; d.onclick = () => { d.remove(); n.go(); }; $('#screen').appendChild(d); setTimeout(() => d.remove(), 6000);
}
render();
App.note('<b>演示提示</b>：右侧「模拟企微推送」→ 点手机顶部横幅深链到卡片；「审核」可改 AI 草拟后采纳发送；「投喂」拍照 / 语音 → 抽取 → 确认入库；线索详情「打电话」记录结果并推进 SOP。');
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>渠道与设备</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  .acc { padding: 14px; position: relative; } .acc .hd { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; } .acc .hd b { font-size: 13.5px; }
  .acc .caps { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0; } .acc .caps span { font-size: 10.5px; background: #f1f3f8; border-radius: 4px; padding: 0 5px; color: var(--text-3); }
  .dev { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .phone { width: 70px; height: 130px; border-radius: 10px; background: #111827; padding: 8px 5px; flex-shrink: 0; } .phone i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(160deg, #1f5eff, #7c3aed); }
  .phone.off i { background: #374151; }
</style>
</head>
<body>
<script src="shared/data.js"></script><script src="shared/engine.js"></script><script src="shared/app.js"></script>
<script>
const me = App.me(); let tab = qs('tab', 'accounts'); const root = App.mount({ active: tab === 'raw' ? 'capture' : 'channels', title: tab === 'raw' ? '抓取记录' : '渠道与设备' });
const noPerm = me.role !== 'admin'; if (noPerm) root.innerHTML = '<div class="empty">仅管理员可管理渠道与设备（请切换为管理员视角）</div>';
const CAPN = { CAPTURE_MOMENTS: '朋友圈互动', CAPTURE_GROUP: '群消息', CAPTURE_OWN_COMMENTS: '自家评论', CAPTURE_PUBLIC_COMMENTS: '公开评论', SEND_DM: '私信', REPLY_GROUP: '群回复', REPLY_COMMENT: '评论回复', POST_MOMENT: '发朋友圈', PUBLISH_POST: '发帖/笔记', PULL_INBOX: '收件箱' };
function render() {
  root.innerHTML = App.pageHead(tab === 'raw' ? '抓取记录' : '渠道与设备', '渠道账号（官方 API / 网页 / RPA 工作手机）、执行设备、抓取规则与原始抓取记录。', `<button class="btn primary" onclick="addAccount()">＋ 绑定账号</button><a class="btn" href="wizard.html?step=3">开通向导 →</a>`) +
  `<div class="card"><div class="tabs">${[['accounts', `账号 <span class="n">${ACQ.accounts.length}</span>`], ['devices', `设备 <span class="n">${ACQ.devices.length}</span>`], ['rules', `抓取规则 <span class="n">${ACQ.captureRules.length}</span>`], ['raw', '抓取记录']].map(x => `<button class="${tab === x[0] ? 'on' : ''}" onclick="tab='${x[0]}';history.replaceState(null,'','?tab='+tab);render()">${x[1]}</button>`).join('')}</div><div class="card-b" id="tb"></div></div>`;
  ({ accounts, devices, rules, raw })[tab]();
}
function accounts() {
  $('#tb').innerHTML = `<div class="alert info small mb12">全局 RPA 总开关 <span class="switch ${ACQ.globalSwitch.rpaEnabled ? 'on' : ''}" style="vertical-align:middle" onclick="ACQ.globalSwitch.rpaEnabled=!ACQ.globalSwitch.rpaEnabled;ACQ.save();render();toast(ACQ.globalSwitch.rpaEnabled?'RPA 已恢复':'已暂停全部工作手机执行，排队消息保留','warn')"></span> ${ACQ.globalSwitch.rpaEnabled ? '开启 · 工作手机按额度与拟人节奏执行' : '<b>已暂停</b> · 全部 RPA 账号停止执行'} · 官方 API 渠道不受影响</div>
  <div class="grid g3">${ACQ.accounts.map(a => { const q = Engine.quota(a); const dev = a.device ? ACQ.devices.find(d => d.id === a.device) : null; return `<div class="card acc"><div class="hd">${UI.platform(a.platform)}<b class="ell">${esc(a.name)}</b><span class="sp"></span>${UI.status(a.status)}</div>
    <div class="row small" style="gap:6px"><span class="tag ${a.exec === 'API' ? 'success' : a.exec === 'RPA' ? 'warning' : ''} xs">${{ API: '官方 API', RPA: 'RPA 工作手机', HTTP: '网页 / HTTP' }[a.exec]}</span><span class="tag xs">${a.tier === 'MINOR' ? '小号' : '主号'}</span>${a.warmupDay ? `<span class="tag xs ${q.warm < 1 ? 'warning' : ''}">养号第 ${a.warmupDay} 天 · ${q.warm * 100}% 额度</span>` : ''}${dev ? `<span class="tag xs">${esc(dev.name.split('（')[0])} ${dev.status === 'ONLINE' ? '🟢' : '⚫'}</span>` : ''}</div>
    <div class="caps">${a.caps.map(c => `<span>${CAPN[c] || c}</span>`).join('')}</div>
    <div class="row small" style="gap:6px"><span class="muted">今日</span><div style="flex:1">${UI.bar(a.todaySent / q.effectiveDaily * 100, a.todaySent / q.effectiveDaily > .8 ? 'hot' : '')}</div><span class="nowrap">${a.todaySent}/${q.effectiveDaily}${a.todayBlocked ? ` · <span style="color:var(--danger)">${a.todayBlocked} 被拒</span>` : ''}</span></div>
    ${a.status === 'RESTRICTED' ? `<div class="alert error xs mt8">${esc(a.lastError)} · ${fmt.left(a.circuitUntil)}恢复 <a onclick="resume('${a.id}')">人工恢复</a></div>` : ''}${a.status === 'OFFLINE' ? `<div class="alert warn xs mt8">设备离线，排队 ${ACQ.outreach.filter(o => o.account === a.id && o.status === 'QUEUED').length} 条；上线后自动发送</div>` : ''}${a.note ? `<div class="xs muted mt8">${esc(a.note)}</div>` : ''}
    <div class="row mt8"><span class="xs muted">负责人 ${ACQ.user(a.owner).name}</span><span class="sp"></span><button class="btn xs" onclick="accDetail('${a.id}')">详情</button><button class="btn xs" onclick="toast('已发送测试消息到测试号','ok')">测试</button><button class="btn xs ${a.status === 'DISABLED' ? '' : 'danger'}" onclick="toggleAcc('${a.id}')">${a.status === 'DISABLED' ? '启用' : '停用'}</button></div></div>`; }).join('')}</div>`;
}
function resume(id) { const a = ACQ.account(id); Modal.confirm('人工恢复账号', '请先在工作手机上确认该账号可正常操作（无验证码 / 无限制提示）。恢复后额度按 50% 起步 24 小时。', () => { a.status = 'ONLINE'; a.circuitUntil = null; a.lastError = null; ACQ.save(); render(); toast('已恢复，24 小时内额度 50%', 'ok'); }); }
function toggleAcc(id) { const a = ACQ.account(id); a.status = a.status === 'DISABLED' ? 'ONLINE' : 'DISABLED'; ACQ.save(); render(); }
function accDetail(id) { const a = ACQ.account(id); const p = ACQ.riskPolicies.find(r => r.platform === a.platform && r.tier === a.tier) || {}; Drawer.open({ title: `${UI.platform(a.platform)} ${esc(a.name)}`, sub: `${a.id} · ${a.exec} · ${a.tier}`, body: `<dl class="kv"><dt>状态</dt><dd>${UI.status(a.status)}</dd><dt>能力</dt><dd>${a.caps.map(c => CAPN[c]).join('、')}</dd><dt>限速策略</dt><dd>${esc(p.name || '—')}：${p.hourly}/小时 · ${p.daily}/天 · 新联系人 ${p.newContacts}/天 · 间隔 ≥${p.minInterval}s · 延迟 ${p.delayMin}~${p.delayMax}s · 时段 ${p.hours} <a href="risk.html">调整 →</a></dd><dt>今日</dt><dd>发送 ${a.todaySent} · 被拒 ${a.todayBlocked} · 队列 ${ACQ.outreach.filter(o => o.account === a.id && o.status === 'QUEUED').length}</dd>${a.device ? `<dt>设备</dt><dd>${esc(ACQ.devices.find(d => d.id === a.device).name)}</dd>` : ''}<dt>凭证</dt><dd class="mono">${a.key || '加密存储 · ' + (a.exec === 'RPA' ? '设备端登录态' : 'OAuth token，到期自动刷新')}</dd></dl>
  <h5 class="small b mt16 mb8">近 7 天发送</h5><canvas id="ac" style="width:100%;height:120px"></canvas>
  <h5 class="small b mt16 mb8">风控事件</h5>${ACQ.incidents.filter(i => i.account === a.id).map(i => `<div class="small mb8"><span class="tag ${i.level} xs">${i.signal}</span> ${fmt.time(i.t)} ${esc(i.text)}</div>`).join('') || '<div class="muted small">无</div>'}`, onMount(m) { Chart.line($('#ac', m), [{ name: '发送', data: Array.from({ length: 7 }, (_, i) => Math.max(0, Math.round(a.daily * .5 + Math.sin(i) * a.daily * .2))), color: '#1f5eff', fill: true }], { labels: Array.from({ length: 7 }, (_, i) => fmt.md(Date.now() - (6 - i) * ACQ.D)) }); } }); }
function addAccount() { Modal.open({ title: '绑定账号', body: `<div class="grid g2">${[['WECOM', '企业微信', '官方 API · 扫码授权'], ['WECHAT_PERSONAL', '个人微信', 'RPA · 需工作手机'], ['DOUYIN', '抖音企业号', '开放平台 OAuth'], ['XIAOHONGSHU', '小红书专业号', '网页登录'], ['FORUM', '行业论坛', '账号密码'], ['DOUYIN_RPA', '抖音 / 小红书小号', 'RPA · 抓公开评论（高风险）']].map(x => `<button class="btn" style="justify-content:flex-start;flex-direction:column;align-items:flex-start;height:auto;padding:10px 12px" onclick="location.href='wizard.html?step=3'"><b>${x[1]}</b><span class="xs muted">${x[2]}</span></button>`).join('')}</div>` }); }
function devices() {
  $('#tb').innerHTML = `<div class="dev">${ACQ.devices.map(d => `<div class="card"><div class="card-b row" style="gap:16px;align-items:flex-start"><div class="phone ${d.status === 'ONLINE' ? '' : 'off'}"><i></i></div><div style="flex:1"><div class="row"><b style="font-size:14px">${esc(d.name)}</b>${UI.status(d.status)}<span class="sp"></span><span class="small muted">心跳 ${fmt.ago(d.lastHeartbeat)}</span></div><dl class="kv mt8"><dt>系统</dt><dd>${d.os} · 获客助手 v${d.app}</dd><dt>已装应用</dt><dd>${Object.entries(d.apps).map(x => `${{ wechat: '微信', douyin: '抖音', xhs: '小红书' }[x[0]]} ${x[1]}`).join(' · ')}</dd><dt>绑定账号</dt><dd>${ACQ.accounts.filter(a => a.device === d.id).map(a => `${UI.platform(a.platform)}${esc(a.name)}`).join('<br>') || '—'}</dd><dt>电量 / 网络</dt><dd>${d.battery}% · ${d.net}${d.battery < 20 ? ' <span class="tag danger xs">电量低</span>' : ''}</dd><dt>绑定时间</dt><dd>${fmt.date(d.boundAt)}</dd></dl>
    ${d.status === 'ONLINE' ? `<div class="alert ok xs mt8">技能脚本：WxReadGroup v1.4 · WxSendDm v1.2 · DyScrollComments v1.1 · 均为最新</div>` : `<div class="alert warn xs mt8">离线 ${fmt.ago(d.lastHeartbeat).replace('前', '')}：请检查手机是否锁屏 / 断网 / App 被杀。排队消息保留，上线后继续。</div>`}
    <div class="row mt8"><button class="btn xs" onclick="toast('已请求设备截图（用于排障，保留 24h）')">远程截图</button><button class="btn xs" onclick="toast('已下发「重启 App」指令')">重启 App</button><button class="btn xs" onclick="toast('已推送任务日志到运营（脱敏）')">日志</button><span class="sp"></span><button class="btn xs danger" onclick="toast('已解绑（演示）','warn')">解绑</button></div></div></div></div>`).join('')}
  <div class="card" style="border-style:dashed;display:grid;place-items:center;min-height:200px;cursor:pointer" onclick="location.href='wizard.html?step=3'"><div class="center muted"><div style="font-size:28px">＋</div>绑定新设备<div class="xs">Android 工作手机 / 云手机 · 安装获客助手 App 输入配对码</div><div class="xs mt8">套餐设备上限 ${ACQ.merchant.deviceLimit} 台 · 已用 ${ACQ.devices.length}</div></div></div></div>
  <div class="card mt16"><div class="card-h"><h3>执行协议 <span class="sub">设备 ⇄ 服务端 WebSocket /ws/executor</span></h3></div><div class="card-b small muted">设备心跳 30s · 服务端下发任务（capture.group / send.dm / post.moment / capture.public_comments）· 设备回执含结果、截图与 UI 信号（验证码 / 频繁提示 / 控件缺失）→ 触发风控状态机。控件变化由运营更新技能脚本版本，设备自动拉取。</div></div>`;
}
function rules() {
  $('#tb').innerHTML = `<div class="row mb12"><span class="small muted">抓取任务「每日抓取线索」09:00 执行全部已启用规则；也可单条「立即抓取」。</span><span class="sp"></span><button class="btn sm primary" onclick="editRule(null)">＋ 新建规则</button></div>` + UI.table([
    { label: '规则', render: r => `${UI.platform(r.platform)}<b>${esc(r.name)}</b><span class="sub">${{ PUBLIC_COMMENTS: '公开评论（RPA 小号）', OWN_CONTENT: '自家内容评论', GROUP: '群消息', BOARD: '论坛版块', INTERNAL: '站内事件', MOMENTS: '朋友圈互动' }[r.scope]}${r.targets ? ' · ' + r.targets.length + ' 个目标' : ''}</span>` },
    { label: '关键词 / 意图短语', render: r => `<div class="small">${r.keywords.map(k => `<span class="kw" style="background:#f1f3f8;border-radius:4px;padding:0 5px;margin:1px">${esc(k)}</span>`).join('') || '<span class="muted">全部内容</span>'}</div><div class="xs muted">意图：${r.intents.join(' / ')}</div>` },
    { label: '账号', render: r => r.accounts.map(a => { const acc = ACQ.account(a); return `<span class="small">${esc(acc.name.split('（')[0])}</span>${acc.status !== 'ONLINE' ? ` ${UI.status(acc.status)}` : ''}`; }).join('<br>') },
    { label: '限制', render: r => `<span class="small">≤${r.max} 条 / 次 · 回看 ${r.lookback}h</span>${r.scope === 'PUBLIC_COMMENTS' ? '<span class="sub">受公开抓取护栏：15 内容 / 3 页 / 会话 40 分钟</span>' : ''}` },
    { label: '上次', render: r => `<span class="small">${fmt.ago(r.lastRun)}</span><span class="sub">原始 ${r.lastStats.raw} · 去重 ${r.lastStats.dedup} · 成线索 <b>${r.lastStats.leads}</b></span>` },
    { label: '启用', render: r => `<span class="switch ${r.enabled ? 'on' : ''}" onclick="toggleRule('${r.id}')"></span>` },
    { label: '操作', cls: 'ops', render: r => `<a onclick="runRule('${r.id}')">立即抓取</a><a onclick="editRule('${r.id}')">编辑</a>` },
  ], ACQ.captureRules);
}
function toggleRule(id) { const r = ACQ.captureRules.find(x => x.id === id); if (!r.enabled && r.scope === 'PUBLIC_COMMENTS' && !ACQ.merchant.publicCommentCaptureEnabled) return toast('需先在「设置」开启「抓取他人公开评论」并确认风险告知', 'err'); r.enabled = !r.enabled; ACQ.save(); render(); }
function runRule(id) { const r = ACQ.captureRules.find(x => x.id === id); toast(`已触发「${r.name}」抓取，预计 ${r.scope === 'PUBLIC_COMMENTS' ? '20~40 分钟（拟人浏览）' : '1~3 分钟'}完成`); r.lastRun = Date.now(); ACQ.save(); }
function editRule(id) { const r = id ? ACQ.captureRules.find(x => x.id === id) : { name: '', platform: 'DOUYIN', scope: 'PUBLIC_COMMENTS', keywords: [], intents: ['求推荐', '有没有货', '多少钱', '怎么报名', '有没有资料'], accounts: [], max: 100, lookback: 24, enabled: true, lastRun: Date.now(), lastStats: { raw: 0, leads: 0, dedup: 0 } }; Drawer.open({ title: id ? '编辑抓取规则' : '新建抓取规则', body: `<div class="field"><label>名称</label><input class="input" id="r_name" value="${esc(r.name)}"></div><div class="grid g2"><div class="field"><label>平台</label><select class="select" id="r_p">${['DOUYIN', 'XIAOHONGSHU', 'WECHAT_PERSONAL', 'WECOM', 'FORUM', 'HDZ_INTERNAL'].map(p => `<option value="${p}" ${r.platform === p ? 'selected' : ''}>${UI.platformName(p)}</option>`).join('')}</select></div><div class="field"><label>范围</label><select class="select" id="r_s">${[['OWN_CONTENT', '自家内容评论（低风险）'], ['PUBLIC_COMMENTS', '公开评论 · 按关键词搜索（RPA 小号，高风险）'], ['GROUP', '群消息'], ['MOMENTS', '朋友圈互动'], ['BOARD', '论坛版块'], ['INTERNAL', '站内事件']].map(x => `<option value="${x[0]}" ${r.scope === x[0] ? 'selected' : ''}>${x[1]}</option>`).join('')}</select></div></div><div class="field"><label>搜索关键词（公开评论 / 论坛）</label><input class="input" id="r_kw" value="${esc(r.keywords.join('，'))}" placeholder="螺纹钢批发，钢材 求购"></div><div class="field"><label>意图短语（命中才成线索）</label><input class="input" id="r_in" value="${esc(r.intents.join('，'))}"><div class="hint">默认：求推荐 / 怎么报名 / 有没有资料 / 有没有货 / 多少钱；其余由 LLM 兜底判断</div></div>${r.targets ? `<div class="field"><label>目标（群 / 版块 URL）</label><textarea class="input" style="height:60px">${esc(r.targets.join('\n'))}</textarea></div>` : ''}<div class="grid g2"><div class="field"><label>每次上限</label><input class="input" type="number" value="${r.max}"></div><div class="field"><label>回看小时</label><input class="input" type="number" value="${r.lookback}"></div></div><div class="field"><label>执行账号</label><div class="chips">${ACQ.accounts.filter(a => a.platform === r.platform).map(a => `<span class="chip ${r.accounts.includes(a.id) ? 'on' : ''}" onclick="this.classList.toggle('on')">${esc(a.name)}</span>`).join('')}</div></div>${r.scope === 'PUBLIC_COMMENTS' ? '<div class="alert warn small">公开评论抓取仅在商家已确认风险告知后可启用；每账号每日 ≤15 条内容、每条 ≤3 页、随机停留、≤2 个会话；触发验证码自动熔断。</div>' : ''}`, footer: '<button class="btn" data-close>取消</button><button class="btn primary" onclick="toast(\'已保存（演示）\',\'ok\');this.closest(\'.drawer-mask\').remove()">保存</button>' }); }
function raw() {
  const rows = []; const srcs = [['DOUYIN', '抖音-#钢材批发', ['求推荐一家靠谱的钢贸', '这个多少钱一吨', '好看', '有没有货 HRB400E', '哈哈哈', '怎么拿货', '👍', '苏州有仓吗']], ['WECHAT_PERSONAL', '微信群-华东钢贸交流群', ['谁有盘螺 10 的', '今天什么价', '收到', '@张三 发我一份', '求购螺纹钢 200 吨 苏州', '早上好', '有做线材的吗']], ['FORUM', '中国钢材网论坛-供求', ['求购 HRB400E Φ12-25 螺纹钢 300 吨', '出售 Q235B 中厚板', '求购盘螺 100 吨 到南京']], ['XIAOHONGSHU', '小红书-自家笔记', ['有没有资料', '价格能发我吗', '学到了', '收藏了']], ['HDZ_INTERNAL', '货袋子-圈子', ['求推荐苏州附近靠谱的螺纹钢供应商', '询价 螺纹钢 HRB400 Φ16 100 吨']]];
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 40; i++) { const s = srcs[Math.floor(rnd() * srcs.length)]; const text = s[2][Math.floor(rnd() * s[2].length)]; const c = Engine.classifyIntent(text); const dup = rnd() < .15; rows.push({ t: Date.now() - rnd() * 3 * ACQ.H, platform: s[0], channel: s[1], author: ['张总', '李工', '王经理', '赵老板', '路人甲', 'user_' + Math.floor(rnd() * 9000), '钢铁小哥', '（匿名）'][Math.floor(rnd() * 8)], text, c, status: dup ? 'DUP' : c.score >= ACQ.merchant.intentThreshold ? 'LEAD' : 'IGNORED' }); }
  rows.sort((a, b) => b.t - a.t);
  $('#tb').innerHTML = `<div class="row mb12"><span class="small muted">最近一次任务 <b>JR101</b>（${fmt.time(Date.now() - 3 * ACQ.H)}）：原始 351 · 去重 63 · 分类 288 · 成线索 35 · 忽略 249。原始记录保留 90 天，仅用于审计与规则调优。</span><span class="sp"></span><select class="select sm"><option>全部结果</option><option>成线索</option><option>忽略</option><option>重复</option></select></div>` + UI.table([
    { label: '时间', render: r => `<span class="small">${fmt.time(r.t)}</span>` }, { label: '来源', render: r => `${UI.platform(r.platform)}<span class="small">${esc(r.channel)}</span>` }, { label: '作者', render: r => `<span class="small">${esc(r.author)}</span>${r.author === '（匿名）' ? '<span class="sub" style="color:var(--danger)">昵称为空</span>' : ''}` }, { label: '原文', render: r => `<span class="small">${esc(r.text)}</span>` },
    { label: 'AI 判定', render: r => `<span class="small">${UI.intent(r.c.intent)} · <b>${r.c.score}</b></span><span class="sub">${r.c.source === 'RULE' ? '⚡ 规则' : '🧠 LLM'} ${esc(r.c.reason)}</span>` },
    { label: '结果', render: r => r.status === 'LEAD' ? '<span class="tag success">成线索</span>' : r.status === 'DUP' ? '<span class="tag">重复 · 合并到已有线索</span>' : `<span class="tag">忽略 · 低于 ${ACQ.merchant.intentThreshold} 分</span>` },
    { label: '', cls: 'ops', render: r => r.status === 'IGNORED' ? `<a onclick="toast('已手动转为线索，并记录用于优化规则','ok')">转线索</a>` : r.status === 'LEAD' ? `<a href="leads.html">线索</a>` : '' },
  ], rows);
}
if (!noPerm) render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>报价工作台</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  .lay { display: grid; grid-template-columns: 280px 1fr 280px; gap: 14px; align-items: start; }
  .rq { border: 1px solid var(--border); border-left: 4px solid var(--border-2); border-radius: var(--radius); background: #fff; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; } .rq:hover { border-color: var(--primary); } .rq.on { border-color: var(--primary); border-left-color: var(--primary); background: var(--primary-weak); }
  .rq.NEW { border-left-color: var(--hot); } .rq.SENT { border-left-color: var(--success); } .rq.MANUAL { border-left-color: var(--danger); }
  .rq .t { display: flex; align-items: center; gap: 6px; font-size: 12.5px; } .rq .t b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .rq .x { font-size: 11.5px; color: var(--text-3); margin-top: 4px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .via { width: 22px; height: 22px; border-radius: var(--radius-sm); display: grid; place-items: center; background: var(--steel-weak); color: var(--text-2); flex: none; } .via svg.i { width: 13px; height: 13px; }
  .cust { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; } .cust .g { font-size: 22px; font-weight: 800; width: 36px; height: 36px; display: grid; place-items: center; border-radius: var(--radius-sm); background: var(--primary); color: #fff; } .cust .g.A { background: var(--hot); } .cust .g.C { background: var(--warning); } .cust .g.N { background: var(--steel); }
  .pl { border: 1px solid var(--border); border-radius: var(--radius); background: #fff; } .pl.rec { border-color: var(--primary); } .pl.sel { outline: 2px solid var(--hot); }
  .pl .ph { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); } .pl .ph .id { width: 24px; height: 24px; border-radius: var(--radius-sm); background: var(--text); color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 12px; } .pl.rec .ph .id { background: var(--primary); }
  .pl .ph b { font-size: 13px; } .pl .ph .sc { margin-left: auto; font-size: 11.5px; color: var(--text-3); }
  .pl table { width: 100%; border-collapse: collapse; font-size: 12px; } .pl td, .pl th { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; } .pl th { color: var(--text-3); font-weight: 600; font-size: 11.5px; background: #f7f9fb; } .pl td.n, .pl th.n { text-align: right; white-space: nowrap; }
  .pl .tot { display: flex; gap: 14px; padding: 8px 12px; font-size: 12px; align-items: center; background: #fafbfc; } .pl .tot b { font-size: 14px; } .pl .tot .m { color: var(--success); } .pl .tot .m.neg { color: var(--danger); }
  .pl .gt { padding: 8px 12px; font-size: 11.5px; border-top: 1px solid var(--border); } .pl .gt div { padding: 2px 0; color: var(--text-2); } .pl .gt code { font-size: 10.5px; }
  .pl .pf { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--border); align-items: center; }
  .mg { font-weight: 700; } .mg.neg { color: var(--danger); } .mg.thin { color: var(--warning); } .mg.ok { color: var(--success); }
  .lines-edit td input, .lines-edit td select { width: 100%; }
  .bd { display: grid; grid-template-columns: 150px 1fr auto; gap: 4px 8px; font-size: 12px; align-items: center; } .bd .bar { height: 6px; background: var(--steel-weak); border-radius: 3px; position: relative; overflow: hidden; } .bd .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--steel); } .bd .bar i.p { background: var(--primary); } .bd .bar i.h { background: var(--hot); } .bd .bar i.ok { background: var(--success); } .bd .v { text-align: right; font-variant-numeric: tabular-nums; min-width: 64px; }
  .qt { white-space: pre-wrap; font-size: 13px; line-height: 1.75; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; min-height: 150px; width: 100%; font-family: inherit; }
  .act { font-size: 12px; } .act div { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--border); } .act div:last-child { border: 0; } .act .tag { flex: none; }
  .side h4 { font-size: 12.5px; margin: 0 0 6px; color: var(--text-2); } .side .row2 { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 4px 0; border-bottom: 1px dashed var(--border); } .side .row2 span:first-child { min-width: 0; } .side .row2 span:last-child { text-align: right; white-space: nowrap; } .side .row2:last-child { border: 0; } .side .row2 span:last-child { font-variant-numeric: tabular-nums; }
  .cfg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; } .cfg .field label { font-size: 12px; } .cfg .field .hint { font-size: 11px; }
  .samples span { display: inline-block; font-size: 11.5px; padding: 3px 8px; border: 1px solid var(--border); border-radius: 12px; margin: 2px 4px 2px 0; cursor: pointer; background: #fff; } .samples span:hover { border-color: var(--primary); color: var(--primary); }
  .dec { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: var(--radius-sm); } .dec.AUTO_SEND { background: var(--success-weak); color: var(--success); } .dec.NEED_REVIEW { background: var(--warning-weak); color: var(--warning); } .dec.MANUAL { background: var(--danger-weak); color: var(--danger); }
</style>
</head>
<body>
<script src="shared/data.js"></script><script src="shared/engine.js"></script><script src="shared/quote-data.js"></script><script src="shared/quote-engine.js"></script><script src="shared/app.js"></script>
<script>
const me = App.me(); const Q = QUOTE; const E = QuoteEngine; const root = App.mount({ active: 'quote', title: '报价工作台' });
const VIA = { WECHAT: ['微信', 'chat'], VOICE: ['语音', 'mic'], PHONE: ['电话', 'phone'], WECOM: ['企微', 'chat'], HDZ: ['平台询价', 'home'], WEB: ['手工', 'doc'] };
const STATUS = { NEW: ['待报价', 'hot'], SENT: ['已报价', 'success'], MANUAL: ['转人工', 'danger'], ACCEPTED: ['已成交', 'success'], EXPIRED: ['已过期', ''], REJECTED: ['未成交', ''] };
const SAMPLES = ['李工：20 的螺纹来 8 吨，12 的盘螺 5 吨，送相城产业园工地，最好明天到。老价格还能做吗？', '张总：H 型钢 200×200 要 12 吨，12 个厚的 Q355 中板 6 吨，老地方，这周内到就行，账期照旧。', '王经理：16 的螺纹 3 吨，8 的盘螺 2 吨，黄埭工地，今天下午能送吗，我们自己也可以来拉。', '徐厂长：Q355B 中板 12mm 要 30 吨，5.75 热卷 20 吨，送张家港杨舍，报个到厂价。', '赵老板：2 寸镀锌管 60 米，50×5 角钢 15 支，10# 槽钢 8 支，DN100 法兰 6 片，送吴中郭巷，明天上午。'];
const SAMPLE_CUST = ['CU1', 'CU2', 'CU5', 'CU4', 'CU6'];
let tab = qs('tab', 'work'), cur = qs('rfq', null), res = null, sel = null, over = { lines: null, payment: null, deadlineDays: undefined };
const mine = () => me.role === 'admin' ? Q.rfqs : Q.rfqs.filter(r => r.by === me.id);
const mgCls = (l) => { if (l.unit && l.unit !== '吨') { const r = l.margin / (l.landed || 1); return r < Q.config.pieceFloorRate ? 'neg' : r < Q.config.autoSendMinMarginRate ? 'thin' : 'ok'; } const m = typeof l === 'number' ? l : l.margin; return m < Q.config.floorMargin ? 'neg' : m < Q.config.autoSend.minMargin ? 'thin' : 'ok'; };
const unitOf = (k) => (Q.specs[k] || {}).unit || '吨'; const perU = (k) => unitOf(k) === '吨' ? 't' : unitOf(k);
const money = (n) => '¥' + fmt.num(Math.round(n));

function run() { const r = Q.rfq(cur); if (!r) { res = null; sel = null; return; } res = E.plan(r, Q, over); sel = sel && res.plans.find(p => p.id === sel) ? sel : (res.plans.find(p => p.recommended) || res.plans[0] || {}).id; }
function render() {
  const all = mine(); const open = all.filter(r => r.status === 'NEW'); const today = Q.quotes.filter(q => Q.NOW - q.t < Q.D); const auto = Q.quotes.filter(q => q.decision === 'AUTO_SEND').length; const wkMargin = Q.quotes.reduce((s, q) => s + (q.margin || 0), 0);
  if (!cur && open.length) cur = open[0].id; if (cur && !res) run();
  root.innerHTML = App.pageHead('报价工作台', '客户一句话 / 一段语音 / 一张截图 → AI 识别规格数量 → 接单方案引擎按「自有库存 → 平台货源 → 上游」配货、算到岸成本（含运费 / 账期 / 起订量）、找拼车窗口、给出带毛利的报价与守门结论 → 一键发出并进入跟单。这是「AI 销售 + AI 采购」焊在一起的那个动作。', `<button class="btn" onclick="tab='rules';render()">${App.icon('gear')} 规则参数</button><button class="btn" onclick="tab='history';render()">${App.icon('doc')} 报价记录</button><button class="btn primary" onclick="tab='work';newRfq()">${App.icon('plus')} 新询价</button>`) +
  `<div class="grid g5 mb16">${UI.kpi('待报价', open.length, null, '单').replace('card kpi', 'card kpi hot')}${UI.kpi('今日报价', today.length + 7, 12, '单')}${UI.kpi('自动发出率', `${Math.round((auto + 3) / (Q.quotes.length + 4) * 100)}<small>%</small>`, 8, '').replace('card kpi', 'card kpi ai')}${UI.kpi('平均首次报价用时', '2.4<small> 分钟</small>', -31, '')}${UI.kpi('本周报价毛利', `<small>¥</small>${fmt.num(wkMargin + 6840)}`, 15, '').replace('card kpi', 'card kpi ok')}</div>
  <div class="card mb12"><div class="tabs">${[['work', `询价与报价 <span class="n">${open.length}</span>`], ['rules', '规则参数'], ['history', `报价记录 <span class="n">${Q.quotes.length}</span>`]].map(x => `<button class="${tab === x[0] ? 'on' : ''}" onclick="tab='${x[0]}';history.replaceState(null,'','?tab='+tab+(cur?'&rfq='+cur:''));render()">${x[1]}</button>`).join('')}</div></div>
  ${tab === 'work' ? work(all) : tab === 'rules' ? rules() : historyTab()}`;
}

/* ---------- 询价与报价 ---------- */
function work(all) {
  const r = Q.rfq(cur);
  return `<div class="lay">
    <div>
      <div class="card mb12"><div class="card-h" style="padding:10px 14px"><h3>询价队列</h3><span class="sub">${all.filter(x => x.status === 'NEW').length} 待报价</span></div><div class="card-b" style="padding:10px">${all.slice().sort((a, b) => (a.status === 'NEW' ? 0 : 1) - (b.status === 'NEW' ? 0 : 1) || b.t - a.t).map(x => { const c = Q.customer(x.customerId); return `<div class="rq ${x.status} ${x.id === cur ? 'on' : ''}" onclick="pickRfq('${x.id}')"><div class="t"><span class="via" title="${VIA[x.via][0]}">${App.icon(VIA[x.via][1])}</span><b>${esc(c.contact)} · ${esc(c.name)}</b>${UI.tag(STATUS[x.status][0], STATUS[x.status][1])}</div><div class="x">${esc(x.raw)}</div><div class="xs muted mt8">${fmt.ago(x.t)} · ${VIA[x.via][0]} · 客户 ${c.grade} 级 · ${ACQ.user(x.by).name}</div></div>`; }).join('')}</div></div>
      <div class="card"><div class="card-h" style="padding:10px 14px"><h3>新询价</h3></div><div class="card-b"><textarea class="input" id="nq" rows="4" placeholder="粘贴客户原话 / 语音转写 / 截图 OCR 文字…"></textarea><div class="field mt8"><label>客户</label><select class="select sm" id="nq_c">${Q.customers.map(c => `<option value="${c.id}">${esc(c.contact)} · ${esc(c.name)}（${c.grade}）</option>`).join('')}</select></div><button class="btn primary sm mt8" style="width:100%;justify-content:center" onclick="newRfq(true)">${App.icon('bot')} AI 解析并生成接单方案</button><div class="samples mt8">${SAMPLES.map((s, i) => `<span onclick="$('#nq').value=${JSON.stringify(s).replace(/"/g, '&quot;')};$('#nq_c').value='${SAMPLE_CUST[i]}'">${esc(s.slice(0, 14))}…</span>`).join('')}</div></div></div>
    </div>
    <div>${r ? center(r) : '<div class="card"><div class="card-b empty">左侧选择一条询价，或粘贴新询价</div></div>'}</div>
    <div class="side">${r ? side(r) : ''}</div>
  </div>`;
}
function qtyCell(l, i) {
  const sp = Q.specs[l.key] || {}; const u = sp.unit || '吨';
  if (u !== '吨') return `<span class="row" style="gap:4px;align-items:center;white-space:nowrap"><input class="input sm" type="number" step="1" style="width:70px" value="${l.qty == null ? '' : l.qty}" onchange="editLine(${i},'qty',+this.value)"> ${u}</span>`;
  if (sp.kgPerM) return `<div style="display:grid;grid-template-columns:auto auto;gap:4px 6px;align-items:center;white-space:nowrap"><input class="input sm" type="number" step="1" style="width:64px" value="${l.pieces == null ? '' : l.pieces}" onchange="editLine(${i},'pieces',+this.value)"><span>支</span><input class="input sm" type="number" step="0.1" style="width:64px" value="${l.qty == null ? '' : l.qty}" onchange="editLine(${i},'qty',+this.value)"><span>t</span></div><div class="xs muted" style="white-space:nowrap">${sp.kgPerM} kg/m × ${sp.stdLen || 6} m</div>`;
  return `<span class="row" style="gap:4px;align-items:center"><input class="input sm" type="number" step="0.5" style="width:70px" value="${l.qty == null ? '' : l.qty}" onchange="editLine(${i},'qty',+this.value)"> t</span>`;
}
function center(r) {
  const c = res.cust; const p = res.parsed; const creditPct = c.creditLimit ? Math.round(c.creditUsed / c.creditLimit * 100) : 0;
  return `<div class="card mb12"><div class="card-b cust"><div style="display:flex;gap:12px;align-items:flex-start"><div class="g ${c.grade}">${c.grade}</div><div><b style="font-size:14px">${esc(c.name)}</b> <span class="muted small">· ${esc(c.contact)}${c.leadId ? ` · <a href="leads.html?open=${c.leadId}">线索 ${c.leadId}</a>` : ''}${c.projectId ? ` · <a href="projects.html?open=${c.projectId}">项目</a>` : ''}</span>
      <div class="small muted mt8">${esc(c.addr)} · ${c.km} km · 历史成交 ${c.deals} 单 · 账期 ${c.terms ? c.terms + ' 天' : '现款'}${c.overdue ? ' · <span class="tag danger xs">有逾期</span>' : ''}${c.grade === 'N' ? ' · <span class="tag xs">新客户</span>' : ''}</div>
      <div class="row mt8 small" style="gap:10px;align-items:center">信用 ${money(c.creditUsed)} / ${money(c.creditLimit)}<span style="width:120px">${UI.bar(creditPct, creditPct > 85 ? 'hot' : '')}</span>${Object.keys(c.hist).length ? `历史价：${Object.entries(c.hist).map(([k, v]) => `${Q.specName(k).replace(/ HRB400E| Q355B| Q235B/, '')} ¥${v}`).join('，')}` : '无历史成交价'}</div></div></div>
      <div style="text-align:right"><div class="xs muted">询价原文 · ${VIA[r.via][0]} · ${fmt.time(r.t)}</div><div class="small mt8" style="max-width:300px;text-align:left;background:#f4f6f8;border-radius:4px;padding:8px 10px;line-height:1.6">${esc(r.raw)}</div>${p.flags.length ? `<div class="xs mt8">${p.flags.map(f => `<span class="tag warning xs">${{ PRICE_CHALLENGE: '提到老价格 / 优惠', URGENT: '急单', TRIAL: '试单' }[f]}</span>`).join(' ')}</div>` : ''}</div></div></div>
  <div class="card mb12"><div class="card-h" style="padding:10px 14px"><h3>AI 识别结果</h3><span class="sub">可修改后重新生成；置信度 &lt; 80% 的行会转人工核对</span><span class="sp"></span><button class="btn sm" onclick="addLine()">${App.icon('plus')} 加一行</button><button class="btn sm primary" onclick="regen()">${App.icon('refresh')} 重新生成方案</button></div>
    <div class="card-b" style="padding:0"><table class="table lines-edit"><thead><tr><th style="width:38%">规格</th><th style="width:18%">数量</th><th>置信度</th><th>识别依据 / 备注</th><th></th></tr></thead><tbody>${res.lines.map((l, i) => `<tr><td><select class="select sm" onchange="editLine(${i},'key',this.value)">${Object.keys(Q.specs).map(k => `<option value="${k}" ${k === l.key ? 'selected' : ''}>${Q.specName(k)}</option>`).join('')}${Q.specs[l.key] ? '' : `<option selected>${esc(l.key)}（不在目录）</option>`}</select></td><td>${qtyCell(l, i)}</td><td><span class="${l.conf < .8 ? 'tag warning xs' : 'tag success xs'}">${Math.round(l.conf * 100)}%</span></td><td class="xs muted">「${esc(l.raw || '')}」${l.note ? ' · ' + esc(l.note) : ''}</td><td><a class="xs" onclick="delLine(${i})">删</a></td></tr>`).join('') || '<tr><td colspan="5" class="empty">未识别到规格，请手工添加</td></tr>'}</tbody></table>
      <div class="row" style="gap:16px;padding:10px 14px;border-top:1px solid var(--border);font-size:12.5px;align-items:center;flex-wrap:wrap"><span>交付：<b>${p.delivery.mode === 'PICKUP' ? '客户自提' : '送货'}</b>${p.delivery.pickupOk && p.delivery.mode !== 'PICKUP' ? '（客户可自提）' : ''} → ${esc(p.delivery.addr || c.addr)}</span>
      <span>期限 <select class="select sm" onchange="over.deadlineDays=this.value===''?null:+this.value;regen()">${[['', '未指定'], ['0', '今天'], ['1', '明天'], ['2', '后天'], ['5', '本周内']].map(x => `<option value="${x[0]}" ${String(res.deadlineDays == null ? '' : res.deadlineDays) === x[0] ? 'selected' : ''}>${x[1]}</option>`).join('')}</select></span>
      <span>付款 <select class="select sm" onchange="over.payment=this.value;regen()"><option value="CREDIT" ${res.pay === 'CREDIT' ? 'selected' : ''}>账期 ${c.terms || 30} 天</option><option value="CASH" ${res.pay === 'CASH' ? 'selected' : ''}>现款</option></select></span>
      <span class="muted xs">账期资金成本按年化 ${Math.round(res.cfg.creditCostAnnual * 100)}% 计入到岸价</span></div></div></div>
  <div class="card mb12"><div class="card-h" style="padding:10px 14px"><h3>接单方案</h3><span class="sub">${res.plans.length} 个可行方案 · 推荐 = 综合得分最高且无硬伤</span></div><div class="card-b"><div class="grid" style="gap:10px">${res.plans.map(planCard).join('')}</div></div></div>
  ${sel ? quotePanel(res.plans.find(x => x.id === sel)) : ''}`;
}
function planCard(p) {
  const gate = E.DECISION[p.gate.decision];
  return `<div class="pl ${p.recommended ? 'rec' : ''} ${p.id === sel ? 'sel' : ''}"><div class="ph"><span class="id">${p.id}</span><b>${esc(p.name)}</b>${p.recommended ? '<span class="tag primary xs">推荐</span>' : ''}<span class="dec ${p.gate.decision}">${gate[0]}</span><span class="sc">得分 ${p.score}</span></div>
    <table><thead><tr><th>规格</th><th class="n">数量</th><th>货源 · 方式</th><th class="n">到岸</th><th class="n">报价</th><th class="n">毛利/单位</th><th>到货</th></tr></thead><tbody>${p.lines.map(l => l.missing ? `<tr><td colspan="7" class="muted">${Q.specName(l.lineKey)} ${l.need} ${perU(l.lineKey)} — 无可用货源</td></tr>` : `<tr><td>${Q.specName(l.key)}${l.altOf ? `<div class="xs" style="color:var(--warning)">替代 ${Q.specName(l.altOf)}</div>` : ''}</td><td class="n">${E.qtyText(Q, l)}${l.partial ? `<span class="xs muted">/${l.need}</span>` : ''}</td><td><span class="tag xs ${l.src.type === 'OWN' ? 'success' : l.src.type === 'PLATFORM' ? 'primary' : l.src.type === 'MARKET' ? 'hot' : ''}">${E.SRC_TEXT[l.src.type]}</span> ${esc(l.src.name)}<div class="xs muted">${E.MODE_TEXT[l.mode]}${l.window ? ' ' + l.window.id : ''}${l.flags.filter(f => f !== 'ABOVE_HIST' && f !== 'BELOW_FLOOR').map(f => ' · ' + { AGING: '老库存', MOQ_STOCK: '起订余量入库', STALE_OFFER: '报价过期', SMALL_TRANSFER: '零散调货', ALT_SPEC: '替代规格', FREIGHT_HEAVY: '运费超限' }[f]).join('')}</div></td><td class="n">${l.landed.toFixed(0)}</td><td class="n"><b>${l.price}</b>${l.hist ? `<div class="xs muted">上次 ${l.hist}</div>` : ''}</td><td class="n mg ${mgCls(l)}">${l.unit !== '吨' ? l.margin.toFixed(1) + ' <span class="xs">(' + l.marginRate + '%)</span>' : l.margin.toFixed(0)}</td><td class="xs">${l.eta}</td></tr>`).join('')}</tbody></table>
    <div class="tot"><span>合计 <b>${Math.round(p.tons * 100) / 100} t</b></span><span>金额 <b>${money(p.amount)}</b></span><span class="m ${p.margin < 0 ? 'neg' : ''}">毛利 <b>${money(p.margin)}</b> <span class="xs">(${p.marginPerTon}/t)</span></span><span class="xs muted">最晚到货 ${p.eta}${p.meetsDeadline ? '' : ' · <span style="color:var(--danger)">晚于要求</span>'}</span></div>

function quotePanel(p) {

function breakdown(l) {

}
function side(r) {
  const keys = [...new Set(res.lines.map(l => l.key).concat(res.lines.flatMap(l => res.cfg.altSpecs[l.key] || [])))];
  const inv = Q.inventory.filter(i => keys.includes(i.key)); const offers = Q.suppliers.flatMap(s => s.offers.filter(o => keys.includes(o.key)).map(o => Object.assign({ s }, o)));

  <div class="card mb12"><div class="card-b"><h4>自有库存</h4>${inv.map(i => `<div class="row2"><span>${Q.specName(i.key)}<div class="xs muted">${Q.warehouses[i.wh].name} · 库龄 ${i.age} 天${i.age >= res.cfg.agingDays && unitOf(i.key) === '吨' ? ' <span class="tag warning xs">老库存</span>' : ''}</div></span><span><b>${i.qty}</b> ${perU(i.key)}${Q.specs[i.key] && Q.specs[i.key].kgPerM ? `<div class="xs muted">≈ ${Math.round(i.qty * 1000 / (Q.specs[i.key].kgPerM * (Q.specs[i.key].stdLen || 6)))} 支</div>` : ''}<div class="xs muted">成本 ${i.cost}</div></span></div>`).join('') || '<div class="xs muted">所询规格无自有库存</div>'}</div></div>
  <div class="card mb12"><div class="card-b"><h4>外部货源（上游 / 平台 / 市场内）</h4>${offers.map(o => { const stale = (Q.NOW - o.t) / Q.H > res.cfg.offerStaleH; return `<div class="row2"><span>${Q.specName(o.key)}<div class="xs muted">${esc(o.s.name)} · ${o.s.type === 'PLATFORM' ? '<span class="tag primary xs">平台</span>' : o.s.type === 'MARKET' ? '<span class="tag hot xs">市场内</span> 当天' : '上游'} · 起订 ${o.moq || '无'} · ${o.dropship ? '可直发' : o.s.type === 'MARKET' ? '搬运 ¥' + (o.pickFee || 0) + '/t' : '不直发'}</div></span><span><b>${o.price}</b><div class="xs ${stale ? '' : 'muted'}" style="${stale ? 'color:var(--danger)' : ''}">${fmt.ago(o.t)}${stale ? ' 过期' : ''}</div></span></div>`; }).join('') || '<div class="xs muted">无外部报价</div>'}<div class="xs mt8"><a onclick="refreshOffers()">刷新上游报价（演示）</a> · <a href="sources.html">更多货源</a></div></div></div>

}

function pickRfq(id) { cur = id; res = null; sel = null; over = { lines: null, payment: null, deadlineDays: undefined }; history.replaceState(null, '', '?tab=work&rfq=' + id); render(); }
function regen() { run(); render(); }
function editLine(i, k, v) { over.lines = res.lines.map(l => Object.assign({}, l)); const l = over.lines[i]; const sp = Q.specs[k === 'key' ? v : l.key] || {}; if (k === 'pieces') { l.pieces = v; l.qty = Math.round(v * (sp.kgPerM || 0) * (sp.stdLen || 6)) / 1000; } else if (k === 'qty') { l.qty = v; l.pieces = sp.kgPerM && (sp.unit || '吨') === '吨' ? Math.round(v * 1000 / (sp.kgPerM * (sp.stdLen || 6))) : (sp.unit && sp.unit !== '吨' ? v : null); } else { l[k] = v; } l.unit = sp.unit || '吨'; if (k === 'key') { l.conf = .99; l.note = '人工修正'; if (sp.kgPerM && l.pieces) l.qty = Math.round(l.pieces * sp.kgPerM * (sp.stdLen || 6)) / 1000; } regen(); }
function addLine() { over.lines = res.lines.map(l => Object.assign({}, l)); const k = '螺纹钢|HRB400E|Φ20'; over.lines.push({ key: k, qty: 5, unit: '吨', pieces: null, conf: .99, raw: '手工添加' }); regen(); }
function delLine(i) { over.lines = res.lines.map(l => Object.assign({}, l)); over.lines.splice(i, 1); regen(); }
function adjust(pid, i, v) { const p = res.plans.find(x => x.id === pid); const l = p.lines.filter(x => !x.missing)[i]; l.price = v; l.margin = Math.round((v - l.landed) * 10) / 10; p.amount = Math.round(p.lines.filter(x => !x.missing).reduce((s, x) => s + x.price * x.qty, 0)); p.margin = Math.round(p.amount - p.cost); p.marginPerTon = Math.round(p.margin / p.tons * 10) / 10; const below = l.unit !== '吨' ? l.margin < l.base * res.cfg.pieceFloorRate : l.margin < res.cfg.floorMargin; if (l.unit !== '吨') l.marginRate = Math.round(l.margin / l.landed * 1000) / 10; if (below && !p.gate.reasons.some(x => x.code === 'BELOW_FLOOR_ADJ')) { p.gate.reasons.push({ code: 'BELOW_FLOOR_ADJ', text: `人工调价后 ${Q.specName(l.key)} 毛利 ¥${l.margin}/t 低于下限`, fix: '经理确认' }); p.gate.decision = 'NEED_REVIEW'; } render(); toast(`已调价：${Q.specName(l.key)} ¥${v} · 毛利 ¥${l.margin}/${perU(l.key)}`, below ? 'warn' : 'ok'); }

}
function send(pid) {

    <h5 class="small b mb8 mt16">自动发出（守门）</h5><div class="cfg">${f('autoSend.grades', '允许自动发出的客户等级', c.autoSend.grades.join(','), '逗号分隔，如 A,B')}${f('autoSend.maxAmount', '自动发出金额上限（元）', c.autoSend.maxAmount)}${f('autoSend.minMargin', '自动发出最低行毛利（元/吨）', c.autoSend.minMargin)}${f('quoteValidH', '报价有效期（小时）', c.quoteValidH)}${f('offerStaleH', '上游报价过期（小时）', c.offerStaleH, '超过需刷新后才能用于自动报价')}</div>
    <h5 class="small b mb8 mt16">配货与物流</h5><div class="cfg">${f('transferMinQty', '零散调货最小吨位', c.transferMinQty, '低于此吨位的外部货源不单独派专车，改拼车 / 直发 / 自提')}${f('consolidateMaxDays', '可接受拼车等待（天）', c.consolidateMaxDays)}${f('platformFee', '平台货源服务费（元/吨）', c.platformFee)}</div>
    <h5 class="small b mb8 mt16">管型材 / 管件（量小而杂：按 支 / 米 询、按吨结；管件按 个 / 片）</h5><div class="cfg">${f('cityMaxKm', '市区配送最远公里', c.cityMaxKm, '三轮 ≤ 1.5 t / 4.2 m ≤ 5 t / 6.8 m ≤ 10 t，整单一车按总重分摊')}${f('maxFreightPerTon', '单行运费上限（元/吨）', c.maxFreightPerTon, '超过视为客户不会接受，方案降权并提示')}${f('pieceMarginRate', '管件目标毛利率', c.pieceMarginRate, '按 个 / 片 结算的行按毛利率定价', 'step="0.01"')}${f('pieceFloorRate', '管件毛利率下限', c.pieceFloorRate, '', 'step="0.01"')}${f('autoSendMinMarginRate', '管件自动发出最低毛利率', c.autoSendMinMarginRate, '', 'step="0.01"')}${f('pieceBand.low', '管件参考价带下限（比例）', c.pieceBand.low, '', 'step="0.01"')}${f('pieceBand.high', '管件参考价带上限（比例）', c.pieceBand.high, '', 'step="0.01"')}</div><div class="xs muted mb8">管材行情为市场提货价：市场带按「报价 − 运费」比较，配送费另加；品类加成（镀锌管 / 焊管 / 方管 +60，无缝管 +80，角钢 / 槽钢 +40）与理重 / 定尺在规格目录维护。</div>
    <h5 class="small b mb8 mt16">替代规格（需客户确认）</h5><div class="small">${Object.entries(c.altSpecs).map(([k, v]) => `<div class="row2" style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--border)"><span>${Q.specName(k)}</span><span>${v.length ? v.map(x => Q.specName(x)).join(' / ') : '<span class="muted">无替代</span>'}</span></div>`).join('')}</div>
    <div class="alert info small mt16">固定护栏（不可配）：规格解析置信度 &lt; 80% 转人工；客户有逾期不自动放账；新客户首单不自动发出；上游报价过期不用于自动报价；人工调价低于毛利下限需经理确认。</div></div></div>`;
}
function saveRules() { const c = JSON.parse(JSON.stringify(Q.config)); $$('[data-k]').forEach(i => { const ks = i.dataset.k.split('.'); let o = c; while (ks.length > 1) o = o[ks.shift()]; const k = ks[0]; o[k] = k === 'grades' ? i.value.split(/[，,\s]+/).filter(Boolean) : +i.value; }); Q.config = c; Q.save(); res = null; toast('规则已保存，待报价询价已按新规则重算', 'ok'); tab = 'work'; render(); }
function resetRules() { Q.config = Q.build().config; Q.save(); res = null; toast('已恢复默认参数'); render(); }

/* ---------- 报价记录 ---------- */
function historyTab() {
  const rows = Q.quotes.slice().sort((a, b) => b.t - a.t);
  return `<div class="card"><div class="card-h"><h3>报价记录</h3><span class="sub">客户接受后自动生成出库 / 采购 / 拼车任务；未回复按跟单 SOP 提醒</span></div><div class="card-b" style="padding:0">${UI.table([
    { label: '报价', render: q => `<b>${q.id}</b><div class="xs muted">${fmt.time(q.t)} · ${ACQ.user(q.by).name} · 方案 ${q.planId}${q.planName ? ' ' + esc(q.planName) : ''}</div>` },
    { label: '客户', render: q => { const c = Q.customer(q.customerId || (Q.rfq(q.rfqId) || {}).customerId); return c ? `${esc(c.contact)}<div class="xs muted">${esc(c.name)}</div>` : '—'; } },
    { label: '内容', render: q => q.lines.map(l => `${Q.specName(l.key)} ${E.qtyText(Q, l)} × ¥${l.price}/${perU(l.key)}<span class="xs muted"> · ${E.MODE_TEXT[l.mode] || l.mode} · ${l.eta}</span>`).join('<br>') },
    { label: '金额 / 毛利', render: q => `${money(q.total)}<div class="xs ${q.margin < 0 ? '' : 'muted'}" style="${q.margin < 0 ? 'color:var(--danger)' : ''}">毛利 ${money(q.margin)}</div>` },
    { label: '发出方式', render: q => `<span class="dec ${q.decision}">${E.DECISION[q.decision][0]}</span>` },
    { label: '状态', render: q => UI.tag(STATUS[q.status][0], STATUS[q.status][1]) + (q.note ? `<div class="xs muted">${esc(q.note)}</div>` : '') },
    { label: '操作', render: q => q.status === 'SENT' ? `<button class="btn xs primary" onclick="accept('${q.id}')">模拟客户接受</button> <button class="btn xs" onclick="counter('${q.id}')">模拟还价</button> <button class="btn xs" onclick="expire('${q.id}')">过期</button>` : `<a class="xs" onclick="viewQuote('${q.id}')">查看</a>` },
  ], rows, { empty: '暂无报价' })}</div></div>`;
}
function accept(id) { const q = Q.quote(id); q.status = 'ACCEPTED'; q.note = '客户接受 · 已生成：' + q.actions.filter(a => a.type !== 'FOLLOW').map(a => ({ OUTBOUND: '出库单', CONSOLIDATE: '拼车任务', PURCHASE: '采购单', PICKUP: '自提通知', STOCK: '入库单' }[a.type])).join('、'); Q.save(); const r = Q.rfq(q.rfqId); if (r) r.status = 'ACCEPTED'; q.lines.forEach(l => { const inv = Q.inventory.find(i => i.key === l.key && Q.warehouses[i.wh].name === l.source); if (inv) inv.qty = Math.max(0, inv.qty - l.qty); }); Q.save(); ACQ.notices.unshift({ t: Date.now(), cls: 'flow', text: `【成交】报价 ${q.id} 客户已接受，${q.tons} t / ${money(q.total)}，内部任务已生成`, link: 'quote.html?tab=history' }); ACQ.save(); render(); toast('已成交：库存已扣减，出库 / 采购 / 拼车任务已生成', 'ok'); }
function counter(id) { const q = Q.quote(id); Modal.open({ title: '客户还价', body: `<div class="small mb8">客户说：「${esc(q.lines[0] ? Q.specName(q.lines[0].key) : '')} 能不能再便宜 20？」</div><div class="alert info small">还价规则：系统最多让到毛利下限（¥${Q.config.floorMargin}/t），仍不够 → 转经理；让价后更新报价有效期并记录「让价原因」。</div><div class="field mt8"><label>让价（元/吨）</label><input class="input" id="cv" type="number" value="10"></div>`, footer: `<button class="btn" data-close>拒绝还价</button><button class="btn primary" id="cok">按此让价重发</button>`, onMount(m, close) { $('#cok', m).onclick = () => { const v = +$('#cv', m).value; q.lines.forEach(l => l.price -= v); q.total -= v * q.tons; q.margin -= v * q.tons; q.note = `已让价 ¥${v}/t 重发`; Q.save(); close(); render(); toast(q.margin / q.tons < Q.config.floorMargin ? '让价后低于毛利下限，已转经理确认' : '已按让价重发', q.margin / q.tons < Q.config.floorMargin ? 'warn' : 'ok'); }; } }); }
function expire(id) { const q = Q.quote(id); q.status = 'EXPIRED'; q.note = '超过有效期，跟单 SOP 已提醒销售电话确认'; const r = Q.rfq(q.rfqId); if (r) r.status = 'NEW'; Q.save(); render(); toast('报价已过期，询价退回队列'); }
function viewQuote(id) { const q = Q.quote(id); Drawer.open({ title: `报价 ${q.id}`, sub: `${fmt.time(q.t)} · ${E.DECISION[q.decision][0]} · ${STATUS[q.status][0]}`, body: `<div class="qt mb12">${esc(q.text || '')}</div><h5 class="small b mb8">内部动作</h5><div class="act">${(q.actions || []).map(a => `<div><span>${esc(a.text)}</span></div>`).join('')}</div>` }); }

render();
App.note('<b>演示提示</b>：选「赵老板」管型材单看支 / 米 → 吨的理重换算、市场内调货与「整单一车」市区配送（方案 G）、管件按个定价；「李工」看 A–F 方案与守门（提到老价格 → 需确认）；「王经理」5 吨零碎单看市区配送 vs 自提 + 替代；「徐厂长」新客户 50 吨看起订量与信用守门。「规则参数」改目标毛利后方案即时重算。');
</script>
</body>
</html>

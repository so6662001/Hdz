<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>跟进待办</title>
<link rel="stylesheet" href="shared/base.css">
<style> .grp { font-size: 12.5px; font-weight: 700; color: var(--text-3); padding: 12px 16px 6px; } .fu { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); } .fu:hover { background: #f8faff; } .fu .w { width: 150px; } .fu .due { width: 110px; font-size: 12px; } .over { color: var(--danger); font-weight: 600; } </style>
</head>
<body>
<script src="shared/data.js"></script><script src="shared/engine.js"></script><script src="shared/app.js"></script>
<script>
const me = App.me(); const root = App.mount({ active: 'follow-ups', title: '跟进待办' });
let view = 'human';
const R = { FLOW_HUMAN_TASK: ['流程人工任务', 'hot'], FLOW_WAIT_REPLY: ['等待回复到期 → 自动走「未回复」分支', 'primary'], FLOW_WAIT: ['定时唤醒 → 自动发送', 'primary'], NO_REPLY: ['72h 未回复 → 自动二次跟进', 'ai'], CONSIDERING: ['再考虑到期 → 自动发活动', 'ai'], HUMAN_SET: ['人工设置', ''] };
function render() {
  const mine = ACQ.followUps.filter(f => me.role === 'admin' || f.owner === me.id);
  const human = mine.filter(f => f.status === 'PENDING' && (f.type === 'MANUAL' || f.type === 'FLOW_HUMAN_TASK')); const auto = mine.filter(f => f.status === 'PENDING' && (f.type === 'AUTO' || f.type === 'FLOW_TIMER')); const done = mine.filter(f => f.status !== 'PENDING');
  const list = view === 'human' ? human : view === 'auto' ? auto : done; const now = Date.now();
  const groups = [['已逾期', list.filter(f => f.dueAt < now)], ['今天', list.filter(f => f.dueAt >= now && f.dueAt < now + ACQ.D)], ['明天及以后', list.filter(f => f.dueAt >= now + ACQ.D)]];
  root.innerHTML = App.pageHead('跟进待办', '「需要人做的」与「机器会自动做的」分开看：人只处理报价 / 合同 / 电话 / 上门；定时器到点由系统自动推进。') +
  `<div class="grid g4 mb16">${UI.kpi('需人工 · 逾期', human.filter(f => f.dueAt < now).length, null, '')}${UI.kpi('需人工 · 今天', human.filter(f => f.dueAt >= now && f.dueAt < now + ACQ.D).length, null, '')}${UI.kpi('机器待执行', auto.length, null, '')}${UI.kpi('本周已完成', done.length, null, '')}</div>
  <div class="card"><div class="tabs">${[['human', `需人工 <span class="n">${human.length}</span>`], ['auto', `机器自动 <span class="n">${auto.length}</span>`], ['done', '已完成']].map(x => `<button class="${view === x[0] ? 'on' : ''}" onclick="view='${x[0]}';render()">${x[1]}</button>`).join('')}</div>
  ${groups.filter(g => g[1].length).map(g => `<div class="grp">${g[0]} · ${g[1].length}</div>${g[1].sort((a, b) => a.dueAt - b.dueAt).map(f => { const l = ACQ.lead(f.leadId); const r = R[f.reason] || [f.reason, '']; const inst = f.flowInstanceId ? ACQ.flowInstances.find(i => i.id === f.flowInstanceId) : null; return `<div class="fu"><span class="due ${f.dueAt < now && f.status === 'PENDING' ? 'over' : ''}">${f.status === 'DONE' ? '✓ ' + fmt.time(f.doneAt || f.dueAt) : f.dueAt < now ? '逾期 ' + fmt.ago(f.dueAt).replace('前', '') : fmt.left(f.dueAt)}</span>${UI.platform(l.platform)}<a class="w" href="leads.html?open=${l.id}"><b>${esc(l.nickname || '（无昵称）')}</b> ${UI.score(l.score)}</a><span class="w">${UI.stage(l.stage)}</span><div class="sp small">${UI.tag(r[0], r[1])} ${f.note ? `<span class="muted">${esc(f.note)}</span>` : ''}${f.plannedScript ? ` <span class="muted">→ 「${esc((ACQ.script(f.plannedScript) || {}).name || '')}」</span>` : ''}${inst ? ` <a class="xs" href="flows.html?id=${inst.flowId}&inst=${inst.id}">流程 ${inst.currentNode}</a>` : ''}</div><span class="small muted" style="width:50px">${ACQ.user(f.owner).name}</span><div class="row" style="gap:4px">${f.status === 'PENDING' ? (f.type === 'MANUAL' || f.type === 'FLOW_HUMAN_TASK' ? `${ACQ.convOf(l.id) ? `<a class="btn xs primary" href="workbench.html?c=${ACQ.convOf(l.id).id}">去处理</a>` : `<a class="btn xs primary" href="leads.html?open=${l.id}">去处理</a>`}<button class="btn xs" onclick="done('${f.id}')">完成</button><button class="btn xs ghost" onclick="snooze('${f.id}')">推迟</button>` : `<button class="btn xs" onclick="runNow('${f.id}')">立即执行</button><button class="btn xs ghost" onclick="skip('${f.id}')">跳过</button>`) : (f.result ? UI.tag(f.result === 'WON' ? '成交' : f.result, f.result === 'WON' ? 'dark' : '') : '')}</div></div>`; }).join('')}`).join('') || '<div class="empty">没有待办</div>'}</div>`;
}
function done(id) { const f = ACQ.followUps.find(x => x.id === id); Modal.open({ title: '完成跟进', body: `<div class="field"><label>结果</label><select class="select" id="r"><option value="CONTACTED">已联系，继续跟</option><option value="HOT">高意向</option><option value="WON">成交</option><option value="LOST">流失</option></select></div><div class="field"><label>备注</label><input class="input" id="n"></div>`, footer: '<button class="btn" data-close>取消</button><button class="btn primary" id="ok">完成</button>', onMount(m, close) { $('#ok', m).onclick = () => { f.status = 'DONE'; f.doneAt = Date.now(); f.result = $('#r', m).value; f.note = $('#n', m).value || f.note; const l = ACQ.lead(f.leadId); if (['HOT', 'WON', 'LOST'].includes(f.result)) l.stage = f.result; ACQ.addEvent(l, { type: 'FOLLOW_DONE', text: `完成跟进：${$('#r', m).selectedOptions[0].text}`, cls: 'user' }); const inst = f.flowInstanceId ? ACQ.flowInstances.find(i => i.id === f.flowInstanceId) : null; if (inst && inst.waitingType === 'HUMAN_TASK') { const tr = Engine.flow.advance(inst, ACQ.flow(inst.flowId), { type: 'HUMAN_DONE' }); tr.forEach(t => inst.log.push(Object.assign({ t: Date.now() }, t))); } ACQ.save(); close(); render(); toast('已完成', 'ok'); }; } }); }
function snooze(id) { const f = ACQ.followUps.find(x => x.id === id); f.dueAt = Math.max(Date.now(), f.dueAt) + ACQ.D; ACQ.save(); render(); toast('已推迟 1 天'); }
function runNow(id) { const f = ACQ.followUps.find(x => x.id === id); const l = ACQ.lead(f.leadId); if (f.type === 'FLOW_TIMER') { const inst = ACQ.flowInstances.find(i => i.id === f.flowInstanceId); const tr = Engine.flow.advance(inst, ACQ.flow(inst.flowId), { type: 'TIMEOUT' }); tr.forEach(t => inst.log.push(Object.assign({ t: Date.now() }, t))); f.status = 'DONE'; f.doneAt = Date.now(); f.result = tr.map(t => t.outcome).join(' → '); toast('流程已推进：' + tr.map(t => t.label + ' → ' + t.outcome).join('；')); } else { const s = ACQ.script(f.plannedScript || 107); const r = Engine.render(s, l); if (!r.ok) return toast('渲染未通过：' + r.problems.map(p => p.text).join('；'), 'err'); const acc = ACQ.accounts.find(a => a.platform === l.platform && a.caps.includes('SEND_DM')) || ACQ.account('a2'); ACQ.outreach.unshift({ id: 'OT' + Date.now().toString().slice(-6), leadId: l.id, account: acc.id, trigger: 'FOLLOW_UP', round: l.outreachCount + 1, scriptId: s.id, content: r.text, hits: r.hits, status: 'QUEUED', scheduledAt: Date.now() + 60e3 }); l.outreachCount++; l.autoFollowCount++; f.status = 'DONE'; f.doneAt = Date.now(); f.result = 'SENT'; toast(`已加入「${acc.name}」队列`, 'ok'); } ACQ.save(); render(); }
function skip(id) { const f = ACQ.followUps.find(x => x.id === id); f.status = 'SKIPPED'; ACQ.save(); render(); }
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>话术库</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  .sc { display: grid; grid-template-columns: 200px 1fr; gap: 14px; }
  .cats a { display: flex; justify-content: space-between; padding: 8px 12px; border-radius: 8px; color: var(--text-2); font-size: 13px; cursor: pointer; } .cats a:hover { background: #f1f3f8; } .cats a.on { background: var(--primary-weak); color: var(--primary); font-weight: 600; } .cats a span { color: var(--text-4); font-size: 11.5px; }
  .kw { display: inline-block; background: #f1f3f8; border-radius: 4px; padding: 0 6px; font-size: 11.5px; margin: 1px 2px; }
  .preview { background: #f7f8fb; border-radius: 10px; padding: 12px; } .preview .bubble { display: inline-block; max-width: 100%; }
  .varbtn { border: 1px dashed #c4b5fd; background: #faf7ff; color: var(--ai); border-radius: 6px; padding: 1px 7px; font-size: 11.5px; cursor: pointer; font-family: Menlo, monospace; } .varbtn:hover { background: #ede4ff; }
</style>
</head>
<body>
<script src="shared/data.js"></script><script src="shared/engine.js"></script><script src="shared/app.js"></script>
<script>
const me = App.me(); const root = App.mount({ active: 'scripts', title: '话术库' });
const CATS = [['', '全部'], ['FIRST_TOUCH', '首触'], ['GREETING', '需求确认 / 问候'], ['PRICE', '报价'], ['CASE', '案例'], ['MATERIAL', '资料'], ['OBJECTION', '异议'], ['FOLLOW_UP', '跟进'], ['CLOSING', '成交 / 合同'], ['TRANSITION', '过渡 / 结束']];
const SCENES = { OUTREACH: '首触触达', REPLY: '私聊回复', GROUP_REPLY: '群内回复', MOMENT_REPLY: '朋友圈回复', FOLLOW_UP: '跟进' };
let cat = '', q = '', showDisabled = true;
function render() {
  let list = ACQ.scripts.filter(s => (!cat || s.category === cat) && (showDisabled || s.enabled) && (!q || s.name.includes(q) || s.content.includes(q) || (s.keywords || []).some(k => k.includes(q)))).sort((a, b) => a.priority - b.priority);
  root.innerHTML = App.pageHead('话术库', '规则关键词优先匹配，其次 LLM 语义分类；每条话术必须含 ≥1 个个性化变量才可用于首触。', `<button class="btn" onclick="testMatch()">🧪 测试匹配</button><button class="btn" onclick="importPack()">导入行业话术包</button><button class="btn primary" onclick="edit(null)">＋ 新建话术</button>`) +
  `<div class="sc"><div class="card"><div class="card-b cats" style="padding:8px">${CATS.map(c => `<a class="${cat === c[0] ? 'on' : ''}" onclick="cat='${c[0]}';render()">${c[1]}<span>${ACQ.scripts.filter(s => !c[0] || s.category === c[0]).length}</span></a>`).join('')}<div style="border-top:1px solid var(--border);margin:8px 0"></div><a onclick="location.href='flows.html'">跟进流程（SOP）→</a></div>
      <div class="card mt12"><div class="card-b small muted">变量：<div class="mt8" style="line-height:2">${Object.keys(Engine.vars(ACQ.lead('L001'))).map(k => `<span class="var ${Engine.PERSONAL_VARS.includes(k) ? '' : 'outline'}" style="${Engine.PERSONAL_VARS.includes(k) ? '' : 'background:#f1f3f8;color:var(--text-2)'}">{${k}}</span>`).join(' ')}</div><div class="mt8">紫色为个性化变量（昵称 / 来源渠道 / 来源原文 / 最近互动），首触至少用 1 个。</div></div></div></div>
    <div class="card"><div class="filters"><input class="input sm" style="width:220px" placeholder="搜索名称 / 内容 / 关键词" value="${esc(q)}" oninput="q=this.value;render()"><label class="checkbox small"><input type="checkbox" ${showDisabled ? 'checked' : ''} onchange="showDisabled=this.checked;render()"> 显示已停用</label><span class="sp"></span><span class="small muted">${list.length} 条</span></div>
    ${UI.table([
      { label: '话术', render: s => `<b>${esc(s.name)}</b>${s.requiresHuman ? ' <span class="tag warning xs">转人工</span>' : ''}${s.source === 'INDUSTRY_PACK' ? ' <span class="tag xs">行业包</span>' : ''}<span class="sub">${SCENES[s.scene] || s.scene}${s.platforms && s.platforms.length ? ' · 仅 ' + s.platforms.map(p => UI.platformName(p)).join('/') : ''} · 优先级 ${s.priority} · v${s.version}</span>` },
      { label: '触发关键词', render: s => (s.keywords || []).length ? s.keywords.map(k => `<span class="kw">${esc(k)}</span>`).join('') : `<span class="muted small">${s.scene === 'OUTREACH' ? '任务触发' : s.scene === 'FOLLOW_UP' ? '流程 / 跟进链触发' : '—'}</span>` },
      { label: '内容', render: s => { const r = Engine.render(s, ACQ.lead('L001')); const n = [...s.content.matchAll(/\{(\w+)\}/g)].map(m => m[1]).filter(k => Engine.PERSONAL_VARS.includes(k)).length; return `<div class="small" style="max-width:380px;line-height:1.6">${UI.vars(s.content)}</div>${n === 0 ? '<div class="xs" style="color:var(--danger)">✖ 无个性化变量</div>' : `<div class="xs muted">个性化变量 ${n} 个${s.variants ? ' · ' + s.variants.length + ' 个变体' : ''}${s.attachments ? ' · 📎 ' + s.attachments.map(a => a.name).join('、') : ''}</div>`}`; } },
      { label: '跟进', render: s => s.followUpAfter ? `<span class="small">${s.followUpAfter / 24} 天后 → ${esc((ACQ.script(s.followUpScript) || {}).name || '').split(' · ')[0]}</span>` : '<span class="muted small">—</span>' },
      { label: '7 天效果', render: s => `<b>${fmt.pct(s.reply7, s.sent7)}</b><span class="sub">${s.sent7} 发 / ${s.reply7} 回</span>` },
      { label: '启用', render: s => `<span class="switch ${s.enabled ? 'on' : ''}" onclick="toggle(${s.id})"></span>` },
      { label: '操作', cls: 'ops', render: s => `<a onclick="edit(${s.id})">编辑</a><a onclick="preview(${s.id})">预览</a><a onclick="dup(${s.id})">复制</a>` },
    ], list, { rowAttr: s => s.enabled ? '' : 'style="opacity:.6"' })}</div></div>`;
}
function toggle(id) { const s = ACQ.script(id); const n = [...s.content.matchAll(/\{(\w+)\}/g)].map(m => m[1]).filter(k => Engine.PERSONAL_VARS.includes(k)).length; if (!s.enabled && n === 0 && s.scene === 'OUTREACH') return toast('首触话术必须含 ≥1 个个性化变量才能启用', 'err'); s.enabled = !s.enabled; ACQ.save(); render(); }
function dup(id) { const s = JSON.parse(JSON.stringify(ACQ.script(id))); s.id = Math.max(...ACQ.scripts.map(x => x.id)) + 1; s.name += '（副本）'; s.source = 'MANUAL'; s.version = 1; s.sent7 = s.reply7 = s.sent30 = s.reply30 = 0; ACQ.scripts.push(s); ACQ.save(); render(); edit(s.id); }
function preview(id) { const s = ACQ.script(id); const leads = ACQ.leads.slice(0, 12); Modal.open({ title: `预览 · ${esc(s.name)}`, width: 640, body: `<div class="field"><label>用哪条线索预览</label><select class="select" id="pl" onchange="window.__pv()">${leads.map(l => `<option value="${l.id}">${l.nickname || '（无昵称）'} · ${UI.platformName(l.platform)}</option>`).join('')}</select></div><div id="pv"></div>`, onMount(m) { window.__pv = () => { const l = ACQ.lead($('#pl', m).value); const r = Engine.render(s, l); $('#pv', m).innerHTML = `<div class="preview">${r.ok ? `<div class="bubble">${esc(r.text)}</div>` : `<div class="bubble" style="border-color:#fecaca">${UI.vars(s.content, r.missing)}</div>`}${(s.variants || []).map((v, i) => `<div class="small muted mt8">变体 ${String.fromCharCode(66 + i)}：</div><div class="bubble">${esc(Engine.render(s, l, { variant: i }).text)}</div>`).join('')}</div><div class="mt8 small">${r.problems.length ? r.problems.map(p => `<div style="color:${p.level === 'error' ? 'var(--danger)' : 'var(--warning)'}">${p.code ? '<code>' + p.code + '</code> ' : ''}${p.text}</div>`).join('') : '<span class="tag success">校验通过</span>'} <span class="muted">个性化变量 ${r.hits.length} 个：${r.hits.map(h => '{' + h + '}').join(' ')}</span></div>`; }; window.__pv(); } }); }
function testMatch() { Modal.open({ title: '🧪 测试匹配：客户说什么，会命中哪条话术', width: 640, body: `<div class="row"><input class="input" id="tm" style="flex:1" placeholder="例如：多少钱一吨 / 有案例吗 / 我再考虑 / 能切割吗 / 别发了"><button class="btn primary" onclick="window.__tm()">匹配</button></div><div class="chips mt8">${['多少钱一吨？', '你们做过哪些工地', '发个规格表', '我再看看吧', '要 60 吨盘螺到无锡', '能定尺切割吗', '别发了'].map(x => `<span class="chip" onclick="$('#tm').value='${x}';window.__tm()">${x}</span>`).join('')}</div><div id="tmr" class="mt12"></div>`, onMount(m) { window.__tm = () => { const t = $('#tm', m).value.trim(); if (!t) return; const r = Engine.matchScript(t, 'REPLY'); const c = Engine.classifyIntent(t); const e = Engine.extractEntities(t); const l = ACQ.lead('L001'); $('#tmr', m).innerHTML = `<div class="alert ${r.refusal ? 'error' : r.script ? 'ok' : 'warn'} small">${r.refusal ? `🚫 ${r.rule} → 拉黑并终止流程，不回复` : r.script ? `${r.source === 'RULE' ? '⚡ 规则' : '🧠 LLM'} ${esc(r.rule)} → 命中「${esc(r.script.name)}」${r.script.requiresHuman ? '（转人工：发过渡语 + 建审核单）' : ''}` : `${esc(r.rule)} → 转人工${r.noReply ? '（无需回复）' : ''}`}</div>${r.script ? `<div class="preview mt8"><div class="bubble">${esc(Engine.render(r.script, l).text)}</div></div>` : ''}<div class="small muted mt8">意图：${UI.intent(c.intent)} ${c.score} 分（${c.reason}）${e.count ? ' · 实体：' + Object.entries(e).filter(x => x[0] !== 'count').map(x => x[1]).join(' / ') : ''} · 流程分支：<b>${r.refusal ? 'REFUSED' : (e.quantity || e.spec) ? 'HAS_ENTITIES' : r.category || '*'}</b></div>`; }; } }); }
function importPack() { Modal.open({ title: '导入行业话术包', body: `<div class="grid g2">${[['钢材贸易 · 基础包', '14 条 · 首触 / 需求确认 / 报价 / 案例 / 资料 / 异议 / 跟进', true], ['钢材贸易 · 工程项目版', '9 条 · 招投标 / 账期 / 送货现场', false], ['建材通用包', '11 条', false]].map(p => `<div class="card" style="box-shadow:none"><div class="card-b"><b>${p[0]}</b><div class="small muted">${p[1]}</div>${p[2] ? '<span class="tag success mt8">已导入</span>' : `<button class="btn sm mt8" onclick="toast('已导入（演示）','ok');this.closest('.mask').remove()">导入</button>`}</div></div>`).join('')}</div><div class="small muted mt12">导入后会替换变量为商家信息，并检查每条 ≥1 个个性化变量；重名话术会新建版本而不是覆盖。</div>` }); }
function edit(id) {
  const s = id ? ACQ.script(id) : { id: null, name: '', category: cat || 'FIRST_TOUCH', scene: 'OUTREACH', platforms: [], keywords: [], priority: 50, content: '{nickname}，看到您在{source_channel}问{source_excerpt}，', variants: [], requiredVars: ['nickname'], requiresHuman: false, followUpAfter: null, followUpScript: 107, enabled: true, source: 'MANUAL', version: 1, sent7: 0, reply7: 0, sent30: 0, reply30: 0 };
  const draft = JSON.parse(JSON.stringify(s)); let sampleId = 'L001';
  const d = Drawer.open({ title: id ? `编辑话术 · ${esc(s.name)}` : '新建话术', sub: id ? `v${s.version} · ${s.source === 'INDUSTRY_PACK' ? '来自行业包' : '自建'} · 近 30 天 ${s.sent30} 发 / 回复率 ${fmt.pct(s.reply30, s.sent30)}` : '', wide: true, body: `<div class="split">
    <div>
      <div class="field"><label>名称</label><input class="input" id="f_name" value="${esc(draft.name)}" placeholder="例如：首触 · 钢材现货（带来源）"></div>
      <div class="grid g2"><div class="field"><label>分类</label><select class="select" id="f_cat">${CATS.filter(c => c[0]).map(c => `<option value="${c[0]}" ${draft.category === c[0] ? 'selected' : ''}>${c[1]}</option>`).join('')}</select></div><div class="field"><label>使用场景</label><select class="select" id="f_scene">${Object.entries(SCENES).map(x => `<option value="${x[0]}" ${draft.scene === x[0] ? 'selected' : ''}>${x[1]}</option>`).join('')}</select></div></div>
      <div class="field"><label>触发关键词 <span class="muted">（回复类话术；命中任一即触发，按优先级取第一条）</span></label><input class="input" id="f_kw" value="${esc(draft.keywords.join('，'))}" placeholder="用逗号分隔，例如：价格，多少钱，报价"><div class="hint">优先级 <input class="input sm" id="f_pri" type="number" style="width:60px" value="${draft.priority}"> 数字小优先；未命中关键词时由 LLM 按分类语义匹配</div></div>
      <div class="field"><label>内容</label><div class="row mb8" style="gap:4px">${Object.keys(Engine.vars(ACQ.lead('L001'))).map(k => `<span class="varbtn" onclick="window.__ins('{${k}}')">{${k}}</span>`).join('')}</div><textarea class="input" id="f_content" style="height:110px">${esc(draft.content)}</textarea></div>
      <div class="field"><label>变体（A/B，轮换发送，各自统计回复率）</label><div id="f_vars">${draft.variants.map((v, i) => `<div class="row mb8"><textarea class="input" style="flex:1;height:60px" data-v="${i}">${esc(v)}</textarea><button class="btn xs danger" onclick="window.__delv(${i})">删</button></div>`).join('')}</div><div class="row"><button class="btn sm" onclick="window.__addv('')">＋ 手工添加</button><button class="btn sm ai" onclick="window.__aiv()">✨ AI 生成变体</button></div></div>
      <div class="grid g2"><div class="field"><label>限定渠道</label><div class="chips">${['WECHAT_PERSONAL', 'WECOM', 'DOUYIN', 'XIAOHONGSHU', 'FORUM', 'HDZ_INTERNAL'].map(p => `<span class="chip ${draft.platforms && draft.platforms.includes(p) ? 'on' : ''}" onclick="this.classList.toggle('on')" data-p="${p}">${UI.platformName(p)}</span>`).join('')}</div><div class="hint">不选 = 全部；小红书渠道自动检查联系方式</div></div>
        <div class="field"><label>附件</label><div class="small">${(draft.attachments || []).map(a => `📎 ${esc(a.name)}`).join('<br>') || '<span class="muted">无</span>'} <a onclick="toast('从企业资料库选择（演示）')">从资料库选择</a></div></div></div>
      <div class="field"><label class="checkbox"><input type="checkbox" id="f_human" ${draft.requiresHuman ? 'checked' : ''}> 命中后转人工（本条作为过渡语发送，并创建审核单）</label><div class="row mt8" id="f_apbox" style="${draft.requiresHuman ? '' : 'display:none'}">审核类型 <select class="select sm" id="f_ap"><option value="QUOTE" ${draft.approvalType === 'QUOTE' ? 'selected' : ''}>报价</option><option value="CONTRACT" ${draft.approvalType === 'CONTRACT' ? 'selected' : ''}>合同 / 账期</option><option value="CUSTOM">其他</option></select></div></div>
      <div class="field"><label>简易跟进链 <span class="muted">（未进入 SOP 的线索使用）</span></label><div class="row">发送后 <input class="input sm" id="f_fa" type="number" style="width:60px" value="${draft.followUpAfter ? draft.followUpAfter / 24 : ''}" placeholder="—"> 天未回复 → <select class="select sm" id="f_fs">${ACQ.scripts.filter(x => x.id !== draft.id).map(x => `<option value="${x.id}" ${draft.followUpScript === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div></div>
      <label class="checkbox"><input type="checkbox" id="f_polish" ${draft.aiPolish ? 'checked' : ''}> 发送前允许 AI 按客户上下文微调措辞（${ACQ.merchant.aiPolishNeedsConfirm ? '商家设置：需人工确认' : '无需确认'}）</label>
    </div>
    <div>
      <div class="card" style="box-shadow:none"><div class="card-h" style="padding:10px 14px"><h3>实时预览</h3><select class="select sm" id="f_sample">${ACQ.leads.slice(0, 14).map(l => `<option value="${l.id}">${l.nickname || '（无昵称）'} · ${UI.platformName(l.platform)}</option>`).join('')}</select></div><div class="card-b" id="f_prev"></div></div>
      ${id ? `<div class="card mt12" style="box-shadow:none"><div class="card-h" style="padding:10px 14px"><h3>效果</h3></div><div class="card-b"><div class="stat-mini"><div><b>${fmt.pct(s.reply7, s.sent7)}</b><span>7 天回复率</span></div><div><b>${fmt.pct(s.reply30, s.sent30)}</b><span>30 天回复率</span></div><div><b>${s.sent30}</b><span>30 天发送</span></div></div><canvas id="f_spark" style="width:100%;height:50px;margin-top:8px"></canvas><div class="xs muted">近 14 天回复率趋势</div>${s.warn ? `<div class="alert warn small mt8">${s.warn}</div>` : ''}</div></div>` : ''}
      <div class="card mt12" style="box-shadow:none"><div class="card-b small muted">保存规则：修改内容会生成新版本（v${(draft.version || 0) + 1}），已排队消息仍用旧版本；首触话术必须含 ≥${ACQ.merchant.personalizationMin} 个个性化变量；命中商家禁词或广告法用语无法保存。</div></div>
    </div></div>`, footer: `<button class="btn" data-close>取消</button>${id ? `<button class="btn danger" onclick="window.__del()">删除</button>` : ''}<button class="btn primary" id="f_save">保存${id ? '为 v' + (draft.version + 1) : ''}</button>`,
    onMount(m, close) {
      const g = (sel) => $(sel, m);
      const collect = () => { draft.name = g('#f_name').value.trim(); draft.category = g('#f_cat').value; draft.scene = g('#f_scene').value; draft.keywords = g('#f_kw').value.split(/[，,、\s]+/).filter(Boolean); draft.priority = +g('#f_pri').value || 50; draft.content = g('#f_content').value; draft.variants = $$('#f_vars textarea', m).map(t => t.value).filter(Boolean); draft.platforms = $$('.chip.on[data-p]', m).map(c => c.dataset.p); draft.requiresHuman = g('#f_human').checked; draft.approvalType = draft.requiresHuman ? g('#f_ap').value : undefined; draft.followUpAfter = g('#f_fa').value ? +g('#f_fa').value * 24 : null; draft.followUpScript = +g('#f_fs').value; draft.aiPolish = g('#f_polish').checked; draft.requiredVars = draft.content.includes('{nickname}') ? ['nickname'] : []; };
      const prev = () => { collect(); const l = ACQ.lead(g('#f_sample').value); const r = Engine.render(draft, l); g('#f_prev').innerHTML = `<div class="preview">${r.ok ? `<div class="bubble">${esc(r.text)}</div>` : `<div class="bubble" style="border-color:#fecaca">${UI.vars(draft.content, r.missing)}</div>`}</div><div class="mt8 small">${r.problems.map(p => `<div style="color:${p.level === 'error' ? 'var(--danger)' : 'var(--warning)'}">${p.level === 'error' ? '✖' : '⚠'} ${p.code ? '<code>' + p.code + '</code> ' : ''}${p.text}</div>`).join('') || '<span class="tag success">校验通过</span>'}<div class="muted mt8">个性化变量 ${r.hits.length} 个：${r.hits.map(h => '<span class="var">{' + h + '}</span>').join(' ') || '—'} · 字数 ${r.text.length}</div></div>`; g('#f_save').disabled = r.problems.some(p => p.level === 'error' && p.code !== 'ACQ-2001') || !draft.content.trim(); };
      ['#f_content', '#f_name', '#f_kw', '#f_sample', '#f_scene', '#f_cat'].forEach(sel => g(sel).addEventListener('input', prev)); g('#f_sample').addEventListener('change', prev); g('#f_human').onchange = () => { g('#f_apbox').style.display = g('#f_human').checked ? '' : 'none'; };
      window.__ins = (v) => { const t = g('#f_content'); const p = t.selectionStart || t.value.length; t.value = t.value.slice(0, p) + v + t.value.slice(p); prev(); };
      window.__addv = (v) => { const i = $$('#f_vars textarea', m).length; g('#f_vars').insertAdjacentHTML('beforeend', `<div class="row mb8"><textarea class="input" style="flex:1;height:60px" data-v="${i}">${esc(v)}</textarea><button class="btn xs danger" onclick="this.parentElement.remove()">删</button></div>`); };
      window.__delv = (i) => { $$('#f_vars > div', m)[i].remove(); };
      window.__aiv = () => { collect(); const base = draft.content; const v = base.replace(/看到您在/, '刷到您在').replace(/我们是/, '这边是').replace(/可以按您的规格发份今日库存表参考？/, '要不要我先把今日价格表发您看看？').replace(/^\{nickname\}，/, '{nickname}您好，'); window.__addv(v === base ? base + '～如需现货今天就能安排。' : v); toast('✨ 已生成 1 个变体（模拟 LLM 改写，保留全部变量）', 'ok'); };
      window.__del = () => Modal.confirm('删除话术', '被流程节点引用的话术不可删除，可先停用。', () => { if (ACQ.flows.some(f => Object.values(f.nodes).some(n => n.scriptId === id))) return toast('该话术被流程引用，无法删除', 'err'); ACQ.scripts = ACQ.scripts.filter(x => x.id !== id); ACQ.save(); close(); render(); }, { danger: true });
      g('#f_save').onclick = () => { collect(); if (!draft.name) return toast('请填写名称', 'warn'); const n = [...draft.content.matchAll(/\{(\w+)\}/g)].map(x => x[1]).filter(k => Engine.PERSONAL_VARS.includes(k)).length; if (draft.scene === 'OUTREACH' && n < ACQ.merchant.personalizationMin) return toast(`首触话术需 ≥${ACQ.merchant.personalizationMin} 个个性化变量`, 'err'); if (id) { Object.assign(s, draft, { version: s.version + 1 }); } else { draft.id = Math.max(...ACQ.scripts.map(x => x.id)) + 1; ACQ.scripts.push(draft); } ACQ.save(); close(); render(); toast(id ? `已保存为 v${s.version}` : '已创建', 'ok'); };
      prev(); if (id && g('#f_spark')) Chart.spark(g('#f_spark'), Array.from({ length: 14 }, (_, i) => Math.max(5, Math.round(s.reply7 / Math.max(1, s.sent7) * 100 + Math.sin(i) * 6))), '#16a34a');
    } });
}
render();
if (qs('open')) edit(+qs('open'));
App.note(`<b>演示提示</b>：「测试匹配」输入客户话看命中哪条话术与流程分支；编辑抽屉右侧实时预览会用真实线索渲染并校验个性化变量与禁词。`);
</script>

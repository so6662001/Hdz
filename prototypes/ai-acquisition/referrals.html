<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>介绍人与分成</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  .rf { padding: 14px; } .rf .hd { display: flex; align-items: center; gap: 10px; } .rf .av { width: 38px; height: 38px; border-radius: var(--radius-sm); background: var(--steel); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; } .rf.dis .av { background: var(--text-4); }
  .rf .nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; } .rf .nums div { background: #f4f6f8; padding: 6px 8px; border-radius: var(--radius-sm); } .rf .nums b { display: block; font-size: 15px; } .rf .nums span { font-size: 11px; color: var(--text-3); }
  .qr { width: 132px; height: 132px; margin: 6px auto; background: repeating-linear-gradient(90deg, #1c2430 0 6px, #fff 6px 12px), repeating-linear-gradient(#1c2430 0 6px, #fff 6px 12px); background-blend-mode: difference; border: 6px solid #fff; outline: 1px solid var(--border-2); }
  .form-prev { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; width: 300px; margin: 0 auto; background: #fff; } .form-prev .top { background: var(--primary); color: #fff; padding: 12px 14px; font-weight: 700; } .form-prev .bd { padding: 12px 14px; font-size: 12px; } .form-prev .bd .f { border: 1px solid var(--border-2); border-radius: 4px; padding: 6px 8px; margin-bottom: 8px; color: var(--text-4); } .form-prev .bd button { width: 100%; }
  .rule { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px; } .rule.def { border-color: var(--primary); } .rule b { font-size: 13px; } .tiers { display: flex; gap: 6px; margin-top: 6px; } .tiers span { background: var(--steel-weak); border-radius: 3px; padding: 2px 8px; font-size: 11.5px; }
  .stmt { font-size: 12.5px; } .stmt th, .stmt td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; } .stmt tfoot td { font-weight: 700; background: #f4f6f8; }
</style>
</head>
<body>
<script src="shared/data.js"></script><script src="shared/engine.js"></script><script src="shared/app.js"></script>
<script>
const me = App.me(); let tab = qs('tab', 'referrers'); const root = App.mount({ active: 'referrals', title: '介绍人与分成' });
const RTYPE = { ALLIANCE: '异业供应商联盟', COST_CONSULT: '造价 / 预算', DESIGN: '设计院', SUPERVISOR: '监理', CUSTOMER: '老客户', PARK_AGENT: '园区 / 代账 / 融资租赁' };
const RSTATUS = { NEW: '新报送', CONTACTED: '跟进中', HOT: '高意向', WON: '已成交', LOST: '未成交' };
const mine = () => me.role === 'admin' ? ACQ.referrers : ACQ.referrers.filter(r => r.owner === me.id);
function calc(rule, ton, amount) { if (rule.type === 'PCT') return Math.round(amount * rule.pct / 100); if (rule.type === 'FIXED') return rule.amount; let left = ton, prev = 0, sum = 0; for (const t of rule.tiers) { const cap = t.upTo == null ? Infinity : t.upTo; const seg = Math.max(0, Math.min(ton, cap) - prev); sum += seg * t.amount; prev = cap; if (ton <= cap) break; } return Math.round(sum); }
function render() {
  const all = mine(); const active = all.filter(r => r.status === 'ACTIVE'); const rl = ACQ.referrals.filter(x => all.some(r => r.id === x.referrerId)); const won = rl.filter(x => x.status === 'WON'); const accrued = all.reduce((a, r) => a + r.accrued - r.settled, 0);
  root.invoice = null;
  root.innerHTML = App.pageHead('介绍人与分成', '商砼站、模板脚手架、造价公司、设计院、监理、老客户……信息在人脑里，系统做三件事：降低报送成本（二维码 / 表单 / 语音）、自动算分成并出对账单（Q12：商家线下结算，平台只记账）、给弹药（本地钢价表）。', `<button class="btn" onclick="tab='rules';render()">${App.icon('scale')} 分成规则</button><button class="btn primary" onclick="addReferrer()">${App.icon('plus')} 新增介绍人</button>`) +
  `<div class="grid g4 mb16">${UI.kpi('活跃介绍人', active.length, 1, '人')}${UI.kpi('报送线索（累计）', rl.length, 3, '条')}${UI.kpi('已成交', `${won.length}<small> 单 · ${fmt.num(won.reduce((a, x) => a + (x.ton || 0), 0))} t</small>`, null, '').replace('card kpi', 'card kpi ok')}${UI.kpi('待结算分成', fmt.money(accrued), null, '').replace('card kpi', 'card kpi hot')}</div>
  <div class="card"><div class="tabs">${[['referrers', `介绍人 <span class="n">${all.length}</span>`], ['leads', `报送线索 <span class="n">${rl.length}</span>`], ['rules', '分成规则'], ['settle', `对账单 <span class="n">${ACQ.settlements.length}</span>`]].map(x => `<button class="${tab === x[0] ? 'on' : ''}" onclick="tab='${x[0]}';history.replaceState(null,'','?tab='+tab);render()">${x[1]}</button>`).join('')}</div><div class="card-b" id="tb"></div></div>`;
  ({ referrers, leads, rules, settle })[tab]();
}
function referrers() {
  $('#tb').innerHTML = `<div class="grid g3">${mine().map(r => { const rule = ACQ.referralRules.find(x => x.id === r.ruleId); const src = ACQ.source(r.sourceCode); return `<div class="card rf ${r.status === 'DISABLED' ? 'dis' : ''}"><div class="hd"><div class="av">${esc(r.name[0])}</div><div style="flex:1;min-width:0"><b>${esc(r.name)}</b> <span class="tag xs">${RTYPE[r.type]}</span><div class="xs muted ell">${esc(r.org)} · ${esc(r.phone)}</div></div>${UI.status(r.status === 'ACTIVE' ? 'ONLINE' : 'DISABLED')}</div>
    <div class="nums"><div><b>${r.referred}</b><span>报送</span></div><div><b>${r.won}</b><span>成交</span></div><div><b>${fmt.num(r.wonTon)}</b><span>成交吨</span></div><div><b style="color:var(--hot)">${fmt.money(r.accrued - r.settled)}</b><span>待结</span></div></div>
    <div class="xs muted mt8">规则：${esc(rule.name)} · ${esc(rule.text)}</div>${r.note ? `<div class="xs muted">${esc(r.note)}</div>` : ''}
    <div class="row mt8"><span class="xs muted">${src ? `<a href="sources.html?open=${src.code}">${esc(src.name)}</a>` : ''} · 负责人 ${ACQ.user(r.owner).name}</span><span class="sp"></span><button class="btn xs" onclick="qrOf('${r.id}')">${App.icon('qr')} 报线索码</button><button class="btn xs" onclick="openRef('${r.id}')">详情</button></div></div>`; }).join('')}
    <div class="card" style="border-style:dashed;display:grid;place-items:center;min-height:180px;cursor:pointer" onclick="addReferrer()"><div class="center muted"><div style="font-size:26px">＋</div>新增介绍人<div class="xs">生成专属二维码 · 报线索表单 · 分成规则</div></div></div></div>`;
}
function qrOf(id) { const r = ACQ.referrer(id); Modal.open({ title: `报线索码 · ${esc(r.name)}`, width: 720, body: `<div class="grid g2"><div class="center"><div class="qr"></div><div class="mono small">${r.code}</div><div class="xs muted mt8">介绍人微信扫码即可报项目；扫码归因到 ${esc(r.name)}，与海报 poster_session 同一套归因。</div><div class="row mt12" style="justify-content:center"><button class="btn sm" onclick="toast('已复制小程序链接','ok')">复制链接</button><button class="btn sm" onclick="toast('已发送到介绍人企微','ok')">发给介绍人</button></div></div>
  <div><div class="form-prev"><div class="top">给华东钢贸报个项目</div><div class="bd"><div class="f">项目 / 工地名称 *</div><div class="f">地点（可定位）</div><div class="f">大概什么时候要钢材</div><div class="f">联系人 / 电话（可不填）</div><div class="f">备注 / 语音（60 秒）</div><button class="btn primary sm">提交</button><div class="xs muted mt8 center">介绍人：${esc(r.name)} · 分成按 ${esc(ACQ.referralRules.find(x => x.id === r.ruleId).name)}</div></div></div></div></div>` }); }
function openRef(id) {
  const r = ACQ.referrer(id); const rl = ACQ.referrals.filter(x => x.referrerId === id).sort((a, b) => b.t - a.t); const rule = ACQ.referralRules.find(x => x.id === r.ruleId);
  Drawer.open({ title: `${esc(r.name)} <span class="tag xs">${RTYPE[r.type]}</span>`, sub: `${esc(r.org)} · ${esc(r.phone)} · 加入 ${fmt.date(r.joinedAt)} · 码 ${r.code}`, body: `
    <div class="grid g4 mb12"><div class="stat-mini"><div><b>${r.referred}</b><span>报送</span></div></div><div class="stat-mini"><div><b>${r.won}</b><span>成交</span></div></div><div class="stat-mini"><div><b>${fmt.money(r.accrued)}</b><span>累计分成</span></div></div><div class="stat-mini"><div><b style="color:var(--hot)">${fmt.money(r.accrued - r.settled)}</b><span>待结算</span></div></div></div>
    <dl class="kv"><dt>分成规则</dt><dd>${esc(rule.name)} · ${esc(rule.text)} <a onclick="tab='rules';render();this.closest('.drawer-mask').remove()">改</a></dd><dt>结算方式</dt><dd>商家线下打款（银行 / 微信），系统生成对账单并记录已结（Q12 A）</dd><dt>弹药</dt><dd>${r.type === 'COST_CONSULT' ? '每周一自动推送本地钢价表（二期），当前由销售手工发送' : '本地钢价表 / 技术资料 · 手工发送'}</dd></dl>
    <h5 class="small b mt12 mb8">报送记录</h5>${UI.table([{ label: '时间', render: x => fmt.time(x.t), w: '100px' }, { label: '线索', render: x => `${esc(x.text)}${x.projectId ? `<span class="sub">→ 项目 <a href="projects.html?open=${x.projectId}">${esc(ACQ.project(x.projectId).name)}</a></span>` : ''}${x.lostReason ? `<span class="sub">${esc(x.lostReason)}</span>` : ''}` }, { label: '途径', render: x => ({ QR_FORM: '扫码表单', WECHAT: '微信告知', VOICE: '语音' })[x.via], w: '80px' }, { label: '状态', render: x => `<span class="tag stage-${x.status}">${RSTATUS[x.status]}</span>`, w: '80px' }, { label: '分成', render: x => x.status === 'WON' ? `<b>${fmt.money(x.accrued)}</b><span class="sub">${fmt.num(x.ton)} t</span>` : x.status === 'HOT' || x.status === 'CONTACTED' ? `<a onclick="markWon('${x.id}')">登记成交</a>` : '—', w: '90px' }], rl)}`,
    footer: `<button class="btn ${r.status === 'ACTIVE' ? 'danger' : ''}" onclick="ACQ.referrer('${r.id}').status='${r.status === 'ACTIVE' ? 'DISABLED' : 'ACTIVE'}';ACQ.save();render();this.closest('.drawer-mask').remove()">${r.status === 'ACTIVE' ? '停用' : '启用'}</button><span class="sp"></span><button class="btn" onclick="qrOf('${r.id}')">报线索码</button>${r.accrued - r.settled > 0 ? `<button class="btn primary" onclick="genStatement('${r.id}');this.closest('.drawer-mask').remove()">生成对账单</button>` : ''}` });
}
function markWon(id) { const x = ACQ.referrals.find(r => r.id === id); const rf = ACQ.referrer(x.referrerId); const rule = ACQ.referralRules.find(r => r.id === rf.ruleId); Modal.open({ title: '登记成交（计算分成）', body: `<div class="small mb8">${esc(x.text)}</div><div class="grid g2"><div class="field"><label>成交吨数</label><input class="input" id="w_t" type="number" value="500" oninput="calcPrev()"></div><div class="field"><label>成交金额（元）</label><input class="input" id="w_a" type="number" value="1900000" oninput="calcPrev()"></div></div><div class="alert info small">规则「${esc(rule.name)}」：${esc(rule.text)}<br>应计分成：<b id="w_p"></b>（按回款结算）</div>`, footer: `<button class="btn" data-close>取消</button><button class="btn primary" id="w_ok">登记</button>`, onMount(m, close) { window.calcPrev = () => { $('#w_p', m).textContent = fmt.money(calc(rule, +$('#w_t', m).value || 0, +$('#w_a', m).value || 0)); }; calcPrev(); $('#w_ok', m).onclick = () => { const ton = +$('#w_t', m).value || 0, amt = +$('#w_a', m).value || 0; const acc = calc(rule, ton, amt); x.status = 'WON'; x.ton = ton; x.amount = amt; x.accrued = acc; x.wonAt = Date.now(); rf.won++; rf.wonTon += ton; rf.wonAmount += amt; rf.accrued += acc; ACQ.save(); close(); render(); openRef(rf.id); toast(`已登记成交，应计分成 ${fmt.money(acc)}`, 'ok'); }; } }); }
function leads() {
  const rl = ACQ.referrals.filter(x => mine().some(r => r.id === x.referrerId)).sort((a, b) => b.t - a.t);
  $('#tb').innerHTML = UI.table([{ label: '时间', render: x => fmt.time(x.t), w: '100px' }, { label: '介绍人', render: x => { const r = ACQ.referrer(x.referrerId); return `<a onclick="openRef('${r.id}')">${esc(r.name)}</a><span class="sub">${esc(r.org)}</span>`; }, w: '160px' }, { label: '报送内容', render: x => `${esc(x.text)}${x.projectId ? `<span class="sub">→ 项目 <a href="projects.html?open=${x.projectId}">${esc(ACQ.project(x.projectId).name)}</a></span>` : ''}${x.leadId ? `<span class="sub">→ 线索 <a href="leads.html?open=${x.leadId}">${esc(ACQ.lead(x.leadId).nickname)}</a></span>` : ''}` }, { label: '途径', render: x => ({ QR_FORM: '扫码表单', WECHAT: '微信告知', VOICE: '语音' })[x.via], w: '80px' }, { label: '状态', render: x => `<span class="tag stage-${x.status}">${RSTATUS[x.status]}</span>`, w: '90px' }, { label: '成交 / 分成', render: x => x.status === 'WON' ? `${fmt.num(x.ton)} t · ${fmt.money(x.amount)}<span class="sub">分成 ${fmt.money(x.accrued)}</span>` : '—', w: '150px' }, { label: '', cls: 'ops', render: x => x.status === 'NEW' ? `<a onclick="toast('已创建项目并进入项目跟进 SOP','ok')">建项目</a>` : (x.status === 'HOT' || x.status === 'CONTACTED') ? `<a onclick="markWon('${x.id}')">登记成交</a>` : '', w: '90px' }], rl);
}
function rules() {
  $('#tb').innerHTML = `<div class="grid g2"><div>${ACQ.referralRules.map(r => `<div class="rule ${r.default ? 'def' : ''}"><div class="row"><b>${esc(r.name)}</b>${r.default ? '<span class="tag primary xs">默认</span>' : ''}<span class="sp"></span><span class="xs muted">${r.settleOn === 'PAID' ? '按回款结算' : '按签约结算'}</span></div><div class="small muted">${esc(r.text)}</div>${r.tiers ? `<div class="tiers">${r.tiers.map((t, i) => `<span>${i === 0 ? '≤' : r.tiers[i - 1].upTo + '–'}${t.upTo == null ? '以上' : t.upTo} t：${t.amount} 元/吨</span>`).join('')}</div>` : ''}<div class="xs muted mt8">使用中：${ACQ.referrers.filter(x => x.ruleId === r.id).map(x => esc(x.name)).join('、') || '—'}</div></div>`).join('')}<button class="btn sm" onclick="toast('新增规则：按吨 / 按金额 / 固定 / 阶梯，可设结算节点')">＋ 新增规则</button></div>
  <div><div class="card"><div class="card-h" style="padding:10px 14px"><h3>试算</h3></div><div class="card-b small"><div class="grid g2"><div class="field"><label>规则</label><select class="select" id="tr_r">${ACQ.referralRules.map(r => `<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div><div class="field"><label>吨数</label><input class="input" id="tr_t" type="number" value="1200"></div><div class="field"><label>金额（元）</label><input class="input" id="tr_a" type="number" value="4600000"></div></div><button class="btn primary sm" onclick="$('#tr_o').textContent=fmt.money(calc(ACQ.referralRules.find(r=>r.id===$('#tr_r').value),+$('#tr_t').value,+$('#tr_a').value))">计算</button> <b id="tr_o" style="font-size:16px;margin-left:8px"></b></div></div>
  <div class="alert info small mt12"><b>Q12 已确认 A：</b>平台不代结算、不涉及资金归集与发票。系统职责：按规则自动计算应计分成 → 按月生成对账单 → 商家线下打款后标记已结 → 介绍人可在小程序查看自己的对账单。</div></div></div>`;
}
function settle() {
  $('#tb').innerHTML = `<div class="row mb12"><span class="small muted">按介绍人、按月生成；状态：待线下结算 → 已结算</span><span class="sp"></span><button class="btn sm primary" onclick="genAll()">${App.icon('file')} 生成本月对账单</button></div>
  ${UI.table([{ label: '单号', render: s => `<b>${s.id}</b>`, w: '70px' }, { label: '介绍人', render: s => { const r = ACQ.referrer(s.referrerId); return `${esc(r.name)}<span class="sub">${esc(r.org)}</span>`; } }, { label: '期间', render: s => s.period, w: '90px' }, { label: '明细', render: s => s.items.map(i => `${fmt.num(i.ton)} t · ${fmt.money(i.amount)} · 规则 ${i.rule}`).join('<br>') }, { label: '应付分成', render: s => `<b>${fmt.money(s.total)}</b>`, w: '100px' }, { label: '状态', render: s => s.status === 'SETTLED' ? '<span class="tag success">已结算</span>' : '<span class="tag warning">待线下结算</span>', w: '100px' }, { label: '', cls: 'ops', render: s => `<a onclick="viewStmt('${s.id}')">查看</a>${s.status !== 'SETTLED' ? `<a onclick="markSettled('${s.id}')">标记已结</a>` : ''}`, w: '110px' }], ACQ.settlements, { empty: '暂无对账单' })}`;
}
function genStatement(rid) { const r = ACQ.referrer(rid); const items = ACQ.referrals.filter(x => x.referrerId === rid && x.status === 'WON' && !ACQ.settlements.some(s => s.items.some(i => i.referralId === x.id))); if (!items.length) return toast('没有未出账的成交', 'warn'); const id = 'ST' + (ACQ.settlements.length + 1); ACQ.settlements.unshift({ id, referrerId: rid, period: fmt.date(Date.now()).slice(0, 7), items: items.map(x => ({ referralId: x.id, ton: x.ton, amount: x.amount, rule: r.ruleId, accrued: x.accrued })), total: items.reduce((a, x) => a + x.accrued, 0), status: 'PENDING_OFFLINE', generatedAt: Date.now() }); ACQ.save(); tab = 'settle'; render(); viewStmt(id); }
function genAll() { let n = 0; ACQ.referrers.forEach(r => { const items = ACQ.referrals.filter(x => x.referrerId === r.id && x.status === 'WON' && !ACQ.settlements.some(s => s.items.some(i => i.referralId === x.id))); if (items.length) { n++; genStatement(r.id); } }); if (!n) toast('本月无新增成交，未生成对账单'); else toast(`已生成 ${n} 份对账单`, 'ok'); }
function viewStmt(id) { const s = ACQ.settlements.find(x => x.id === id); const r = ACQ.referrer(s.referrerId); Modal.open({ title: `对账单 ${s.id} · ${s.period}`, width: 640, body: `<div class="row mb8"><div><b>${esc(r.name)}</b> · ${esc(r.org)} · ${esc(r.phone)}</div><span class="sp"></span>${s.status === 'SETTLED' ? '<span class="tag success">已结算</span>' : '<span class="tag warning">待线下结算</span>'}</div><table class="stmt" style="width:100%"><thead><tr><th>线索</th><th>成交吨</th><th>成交金额</th><th>规则</th><th class="right">分成</th></tr></thead><tbody>${s.items.map(i => { const x = ACQ.referrals.find(y => y.id === i.referralId); return `<tr><td>${esc(x ? x.text : i.referralId)}</td><td>${fmt.num(i.ton)}</td><td>${fmt.money(i.amount)}</td><td>${i.rule}</td><td class="right">${fmt.money(i.accrued)}</td></tr>`; }).join('')}</tbody><tfoot><tr><td colspan="4">合计（商家线下支付）</td><td class="right">${fmt.money(s.total)}</td></tr></tfoot></table><div class="xs muted mt8">${esc(s.note || '生成于 ' + fmt.time(s.generatedAt) + ' · 平台不代结算，仅记账')}</div>`, footer: `<button class="btn" onclick="toast('已导出 PDF 并发送给介绍人','ok')">导出 / 发给介绍人</button><span class="sp"></span><button class="btn" data-close>关闭</button>${s.status !== 'SETTLED' ? `<button class="btn primary" onclick="markSettled('${s.id}');this.closest('.mask').remove()">标记已线下结算</button>` : ''}` }); }
function markSettled(id) { const s = ACQ.settlements.find(x => x.id === id); s.status = 'SETTLED'; s.settledAt = Date.now(); const r = ACQ.referrer(s.referrerId); r.settled += s.total; ACQ.save(); render(); toast('已标记结算，介绍人小程序同步可见', 'ok'); }
function addReferrer() { Modal.open({ title: '新增介绍人', body: `<div class="grid g2"><div class="field"><label>姓名</label><input class="input" id="ar_n"></div><div class="field"><label>类型</label><select class="select" id="ar_t">${Object.entries(RTYPE).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div><div class="field"><label>单位</label><input class="input" id="ar_o"></div><div class="field"><label>手机</label><input class="input" id="ar_p"></div><div class="field"><label>分成规则</label><select class="select" id="ar_r">${ACQ.referralRules.map(r => `<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div><div class="field"><label>负责销售</label><select class="select">${ACQ.users.filter(u => u.role === 'sales').map(u => `<option>${u.name}</option>`).join('')}</select></div></div><label class="checkbox small"><input type="checkbox" checked> 保存后生成专属报线索码并发送到介绍人微信</label>`, footer: `<button class="btn" data-close>取消</button><button class="btn primary" id="ar_ok">保存并生成码</button>`, onMount(m, close) { $('#ar_ok', m).onclick = () => { const n = $('#ar_n', m).value.trim(); if (!n) return toast('请填写姓名', 'warn'); const id = 'RF' + (ACQ.referrers.length + 1); ACQ.referrers.unshift({ id, name: n, org: $('#ar_o', m).value, type: $('#ar_t', m).value, sourceCode: 'R1_ALLIANCE', phone: $('#ar_p', m).value || '—', ruleId: $('#ar_r', m).value, code: id + '-' + Math.random().toString(36).slice(2, 6).toUpperCase(), owner: me.id, status: 'ACTIVE', joinedAt: Date.now(), referred: 0, won: 0, wonTon: 0, wonAmount: 0, accrued: 0, settled: 0 }); ACQ.save(); close(); render(); qrOf(id); }; } }); }
render(); if (qs('open')) openRef(qs('open'));
App.note('<b>演示提示</b>：点「王站长」详情 → 报送记录里「登记成交」看阶梯分成计算 → 生成对账单 → 标记已线下结算（Q12）。');
</script>
</body>

      <li><span class="who a">管理员</span><b>自然语言任务</b>：输入「每天早上 9 点抓取抖音评论区求推荐的线索并首触」，看解析结果与歧义提示，试运行后确认生效。<a href="jobs.html">去体验 →</a></li>
      <li><span class="who s">销售</span><b>看板</b>先看「谁该跟进 / 谁快成交」，点张总进入<b>线索详情</b>时间线，再进<b>会话工作台</b>：张总问价 → 机器发过渡话术并生成报价草稿 → 销售审核后发送 → SOP 自动推进到人工节点。<a href="dashboard.html">去体验 →</a></li>
      <li><span class="who s">销售</span>在工作台底部演示条模拟客户说「不需要，别再发了」→ 触发拒绝词 → 自动进黑名单、流程终止；再模拟「有没有热轧卷板现货，多少钱」→ 抽实体 + 问价 → 转人工。<a href="workbench.html?c=C3&tab=AUTO">去体验 →</a></li>
      <li><span class="who a">管理员</span><b>跟进流程</b>：先看「项目跟进 SOP（含电话）」里的 Call 节点与接通 / 未接通 / 拒绝分支，在模拟页记录一次通话；再打开标准 SOP，在「72h 未回复」分支后插入一个节点、加一条分支，校验 → 发布新版本；切到「模拟」页签逐事件推进；实例页把老实例迁移到新版本。<a href="flows.html?id=F4">去体验 →</a></li>
      <li><span class="who a">管理员</span><b>海报分发</b>：选「9 月新客锁价」海报，勾 2 个微信群 + 朋友圈 + 小红书，看每渠道独立追踪码与发送计划，确认后观察逐条发送（小红书含促销词进审核）。<a href="poster-dispatch.html?new=PS2">去体验 →</a></li>
      <li><span class="who a">管理员</span><b>渠道与风控</b>：抖音小号已熔断 → 人工恢复（额度 50% 起步）；设置页开启「抓取他人公开评论」需勾选风险告知；商家自定义频率不能高于平台默认。<a href="channels.html">去体验 →</a></li>
      <li><span class="who d">工作手机</span><b>获客助手 App</b>：走完权限自检与配对码绑定，看队列里的 SEND_DM 如何被拟人化执行并回执；用左侧场景触发滑块验证 / 微信升级 / 断网重连，观察 RISK_SIGNAL、技能包更新与 cmdId 幂等。<a href="app.html">去体验 →</a></li>
    </ol>

    <div class="card mb16"><div class="card-h"><h3>模拟引擎（shared/engine.js）</h3></div><div class="card-b small" style="line-height:1.8">
      <div><b>意图识别</b>：规则（关键词 / 正则）优先，未命中时模拟 LLM 语义兜底并给出置信度；拒绝词独立判定。</div>
      <div><b>话术渲染</b>：变量替换 + 强制 ≥1 个个性化变量（昵称 / 来源 / 原话 / 上次互动），缺失报 <code>ACQ-2001</code>，敏感词报 <code>ACQ-2002</code>。</div>
      <div><b>拟人节流</b>：按平台 / 账号档位算延迟、打字时长、时段与每日额度（养号期 20% / 50% / 100%）。</div>
      <div><b>NL 解析</b>：自然语言 → 定时任务 JobSpec / 跟进流程 DAG 草稿，附歧义提示。</div>
      <div><b>FlowEngine</b>：JSON DAG 校验 + 事件驱动推进（REPLY / TIMEOUT / HUMAN_DONE / <b>CALL</b>），带最大自动发送与回环护栏。</div>
      <div><b>投喂抽取</b>：文本 / OCR / 转写 → 项目 / 企业 / 联系人 Schema 字段、置信度与待补项；<b>用钢量估算</b>按结构类型系数（住宅 40–55 · 商业 55–90 · 轻钢 30–60 · 重型 80–150 kg/㎡ · 光伏 30–45 t/MW）。</div>
    </div></div>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>原型总览</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  .hero { background: linear-gradient(135deg, #0f1f4d 0%, #1f5eff 55%, #7c3aed 100%); color: #fff; border-radius: 14px; padding: 26px 28px; margin-bottom: 18px; position: relative; overflow: hidden; }
  .hero h1 { color: #fff; font-size: 24px; margin: 0 0 6px; }
  .hero p { color: rgba(255,255,255,.85); margin: 0; max-width: 820px; line-height: 1.7; }
  .hero .chips-row { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
  .hero .chips-row span { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
  .pcard { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: #fff; transition: .15s; min-height: 150px; }
  .pcard:hover { box-shadow: 0 8px 24px rgba(31,94,255,.12); transform: translateY(-1px); border-color: #c7d6ff; }
  .pcard .ph { display: flex; align-items: center; gap: 8px; }
  .pcard .ph .ic { width: 34px; height: 34px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; background: #eef3ff; }
  .pcard .ph b { font-size: 15px; }
  .pcard .ph .pri { margin-left: auto; font-size: 11px; color: var(--text-3); }
  .pcard .desc { font-size: 12.5px; color: var(--text-3); line-height: 1.6; flex: 1; }
  .pcard .links { display: flex; flex-wrap: wrap; gap: 6px; }
  .pcard .links a { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: #f3f5fa; border: 1px solid var(--border); color: var(--text); text-decoration: none; }
  .pcard .links a:hover { background: #eef3ff; border-color: #c7d6ff; color: var(--primary); }
  .pcard .links a.main { background: var(--primary); border-color: var(--primary); color: #fff; }
  .story { counter-reset: s; }
  .story li { list-style: none; position: relative; padding: 10px 0 10px 40px; border-bottom: 1px dashed var(--border); font-size: 13px; line-height: 1.7; }
  .story li:last-child { border-bottom: 0; }
  .story li::before { counter-increment: s; content: counter(s); position: absolute; left: 0; top: 11px; width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: #fff; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .story li b { color: var(--text); }
  .story .who { font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-right: 4px; }
  .story .who.a { background: #fff1e6; color: var(--hot); }
  .story .who.s { background: #e9f8ee; color: #1a7f3c; }
  .kvtab td { font-size: 12.5px; vertical-align: top; }
  .kvtab td:first-child { white-space: nowrap; font-weight: 600; width: 160px; }
  .kvtab code { background: #f3f5fa; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<script src="shared/data.js"></script><script src="shared/engine.js"></script><script src="shared/app.js"></script>
<script>
const me = App.me(); const root = App.mount({ active: 'index', title: '原型总览' });
const b = ACQ.badges();

const PAGES = [
  { id: 'dashboard', ic: '📊', name: '看板', pri: 1, href: 'dashboard.html', admin: false,

    links: [['flows.html?id=F1&tab=sim', '模拟标准 SOP'], ['flows.html?id=F3', 'NL 生成的草稿'], ['flows.html?inst=FI1', '实例 FI1']] },
  { id: 'leads', ic: '👥', name: '线索列表 / 详情', pri: 5, href: 'leads.html', admin: false,

  { id: 'scripts', ic: '📝', name: '话术库', pri: 6, href: 'scripts.html', admin: true,

      <li><span class="who a">管理员</span><b>跟进流程</b>：打开标准 SOP，在「72h 未回复」分支后插入一个节点、加一条分支，校验 → 发布新版本；切到「模拟」页签逐事件推进；实例页把老实例迁移到新版本。<a href="flows.html?id=F1">去体验 →</a></li>
      <li><span class="who a">管理员</span><b>海报分发</b>：选「9 月新客锁价」海报，勾 2 个微信群 + 朋友圈 + 小红书，看每渠道独立追踪码与发送计划，确认后观察逐条发送（小红书含促销词进审核）。<a href="poster-dispatch.html?new=PS2">去体验 →</a></li>
      <li><span class="who a">管理员</span><b>渠道与风控</b>：抖音小号已熔断 → 人工恢复（额度 50% 起步）；设置页开启「抓取他人公开评论」需勾选风险告知；商家自定义频率不能高于平台默认。<a href="channels.html">去体验 →</a></li>

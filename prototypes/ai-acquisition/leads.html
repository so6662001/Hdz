<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>线索列表</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  .stagebar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; } .stagebar .s { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; cursor: pointer; min-width: 96px; } .stagebar .s:hover, .stagebar .s.on { border-color: var(--primary); background: var(--primary-weak); } .stagebar .s b { display: block; font-size: 18px; } .stagebar .s span { font-size: 11.5px; color: var(--text-3); }
  .batch { background: var(--primary-weak); padding: 8px 16px; display: flex; gap: 8px; align-items: center; font-size: 12.5px; }
  .vartable td { padding: 6px 10px; }
</style>
</head>
<body>
<script src="shared/data.js"></script><script src="shared/engine.js"></script><script src="shared/app.js"></script>
<script>
const me = App.me(); const root = App.mount({ active: 'leads', title: '线索列表' });
const isAdmin = me.role === 'admin';
let F = { q: '', stage: qs('stage', ''), platform: '', owner: '', minScore: 0, test: false, sort: 'lastActiveAt', page: 1 }; let selected = new Set(); const PAGE = 15;
const STAGES = ['NEW', 'CONTACTED', 'REPLIED', 'HOT', 'WON', 'LOST', 'SILENT'];
function rows() { let r = ACQ.myLeads(me).filter(l => F.test ? l.isTest : !l.isTest); if (F.q) r = r.filter(l => (l.nickname || '').includes(F.q) || (l.sourceExcerpt || '').includes(F.q) || (l.product || '').includes(F.q) || (l.company || '').includes(F.q)); if (F.stage) r = r.filter(l => l.stage === F.stage); if (F.platform) r = r.filter(l => l.platform === F.platform); if (F.owner) r = r.filter(l => l.owner === +F.owner); if (F.minScore) r = r.filter(l => l.score >= F.minScore); r.sort((a, b) => F.sort === 'score' ? b.score - a.score : F.sort === 'createdAt' ? b.createdAt - a.createdAt : (b.lastActiveAt || 0) - (a.lastActiveAt || 0)); return r; }
function render() {
  const all = ACQ.myLeads(me).filter(l => !l.isTest); const r = rows(); const pages = Math.max(1, Math.ceil(r.length / PAGE)); if (F.page > pages) F.page = pages; const pageRows = r.slice((F.page - 1) * PAGE, F.page * PAGE);
  root.innerHTML = App.pageHead('线索列表', `${isAdmin ? '全部' : '我的'}线索 ${all.length} 条 · 抓取自 6 类渠道，去重后统一进入线索池`, `<button class="btn" onclick="manualAdd()">＋ 手工录入</button><button class="btn" onclick="toast('已下载 leads-${fmt.date(Date.now())}.xlsx（手机号脱敏）','ok')">导出</button>${isAdmin ? `<button class="btn" onclick="location.href='channels.html?tab=raw'">抓取记录</button>` : ''}`) +
  `<div class="stagebar"><div class="s ${F.stage === '' ? 'on' : ''}" onclick="F.stage='';F.page=1;render()"><b>${all.length}</b><span>全部</span></div>${STAGES.map(s => `<div class="s ${F.stage === s ? 'on' : ''}" onclick="F.stage='${s}';F.page=1;render()"><b>${all.filter(l => l.stage === s).length}</b>${UI.stage(s)}</div>`).join('')}</div>
  <div class="card">
    <div class="filters"><input class="input sm" style="width:200px" placeholder="搜索昵称 / 原文 / 产品 / 公司" value="${esc(F.q)}" oninput="F.q=this.value;F.page=1;renderTable()">
      <select class="select sm" onchange="F.platform=this.value;F.page=1;renderTable()"><option value="">全部渠道</option>${['DOUYIN', 'XIAOHONGSHU', 'FORUM', 'WECHAT_PERSONAL', 'WECOM', 'HDZ_INTERNAL'].map(p => `<option value="${p}" ${F.platform === p ? 'selected' : ''}>${UI.platformName(p)}</option>`).join('')}</select>
      ${isAdmin ? `<select class="select sm" onchange="F.owner=this.value;F.page=1;renderTable()"><option value="">全部负责人</option>${ACQ.users.filter(u => u.role === 'sales').map(u => `<option value="${u.id}" ${F.owner == u.id ? 'selected' : ''}>${u.name}</option>`).join('')}</select>` : ''}
      <select class="select sm" onchange="F.minScore=+this.value;F.page=1;renderTable()"><option value="0">意图分不限</option><option value="60" ${F.minScore === 60 ? 'selected' : ''}>≥ 60</option><option value="80" ${F.minScore === 80 ? 'selected' : ''}>≥ 80 高意向</option></select>
      <select class="select sm" onchange="F.sort=this.value;renderTable()"><option value="lastActiveAt">按最近活跃</option><option value="score" ${F.sort === 'score' ? 'selected' : ''}>按意图分</option><option value="createdAt" ${F.sort === 'createdAt' ? 'selected' : ''}>按抓取时间</option></select>
      <label class="checkbox small"><input type="checkbox" ${F.test ? 'checked' : ''} onchange="F.test=this.checked;F.page=1;renderTable()"> 只看测试线索</label>
      <span class="sp"></span><span class="small muted" id="cnt"></span></div>
    <div id="batch"></div><div id="tbl"></div></div>`;
  renderTable();
}
function renderTable() {
  const r = rows(); const pages = Math.max(1, Math.ceil(r.length / PAGE)); if (F.page > pages) F.page = pages; const pageRows = r.slice((F.page - 1) * PAGE, F.page * PAGE);
  $('#cnt').textContent = `${r.length} 条`;
  $('#batch').innerHTML = selected.size ? `<div class="batch">已选 ${selected.size} 条 <span class="sp"></span>${isAdmin ? `<button class="btn sm" onclick="batchAssign()">分配负责人</button>` : ''}<button class="btn sm" onclick="batchFlow()">加入 SOP</button><button class="btn sm" onclick="batchStage('IGNORED')">忽略</button><button class="btn sm ghost" onclick="selected.clear();renderTable()">取消</button></div>` : '';
  $('#tbl').innerHTML = UI.table([
    { label: `<input type="checkbox" onchange="toggleAll(this.checked)">`, w: '32px', render: l => `<input type="checkbox" ${selected.has(l.id) ? 'checked' : ''} onclick="event.stopPropagation()" onchange="sel('${l.id}',this.checked)">` },
    { label: '线索', render: l => `<div class="row" style="gap:6px"><b>${esc(l.nickname || '（无昵称）')}</b>${!l.nickname ? '<span class="tag danger xs" title="触达时会因缺少 {nickname} 被拦截">缺昵称</span>' : ''}${l.tags.map(t => `<span class="tag xs ${t === '高意向' ? 'hot' : ''}">${t}</span>`).join('')}</div><span class="sub ell" style="max-width:320px" title="${esc(l.sourceExcerpt)}">${esc(l.sourceExcerpt)}</span>` },
    { label: '来源', render: l => `${UI.platform(l.platform)}<span class="small">${esc((l.sourceChannel || '').replace(/^[^-]+-/, ''))}</span>` },
    { label: '意图', render: l => `${UI.score(l.score)}<span class="sub">${UI.intent(l.intent)}${l.product && l.product !== '—' ? ' · ' + esc(l.product) : ''}</span>` },
    { label: '阶段', render: l => UI.stage(l.stage) },
    { label: '负责人', render: l => ACQ.user(l.owner).name },
    { label: '触达/回复', render: l => `${l.outreachCount} / ${l.replyCount}${l.autoFollowCount ? `<span class="sub">自动跟进 ${l.autoFollowCount}</span>` : ''}` },
    { label: '流程', render: l => { const i = ACQ.instanceOf(l.id); if (!i) return '<span class="muted small">—</span>'; const f = ACQ.flow(i.flowId); return `<span class="small">${esc(f.name.replace(' SOP', ''))}</span><span class="sub">${Engine.flow.label(f, i.currentNode).slice(0, 14)}${i.status === 'PAUSED' ? ' · 暂停' : ''}</span>`; } },
    { label: '最近活跃', render: l => `<span class="small">${fmt.ago(l.lastActiveAt)}</span>` },
    { label: '操作', cls: 'ops', render: l => `${ACQ.convOf(l.id) ? `<a href="workbench.html?c=${ACQ.convOf(l.id).id}">会话</a>` : `<a onclick="event.stopPropagation();outreachOne('${l.id}')">触达</a>`}<a onclick="event.stopPropagation();openLead('${l.id}')">详情</a>` },
  ], pageRows, { rowAttr: l => `onclick="openLead('${l.id}')" style="cursor:pointer" class="${selected.has(l.id) ? 'sel' : ''}"`, empty: '没有符合条件的线索' }) + `<div class="pager">共 ${r.length} 条 ${Array.from({ length: pages }, (_, i) => `<button class="${F.page === i + 1 ? 'on' : ''}" onclick="F.page=${i + 1};renderTable()">${i + 1}</button>`).join('')}</div>`;
}
function sel(id, on) { on ? selected.add(id) : selected.delete(id); renderTable(); }
function toggleAll(on) { rows().slice((F.page - 1) * PAGE, F.page * PAGE).forEach(l => on ? selected.add(l.id) : selected.delete(l.id)); renderTable(); }
function batchAssign() { Modal.open({ title: `分配 ${selected.size} 条线索`, body: `<select class="select" id="to">${ACQ.users.filter(u => u.role === 'sales').map(u => `<option value="${u.id}">${u.name}</option>`).join('')}</select>`, footer: '<button class="btn" data-close>取消</button><button class="btn primary" id="ok">分配</button>', onMount(m, close) { $('#ok', m).onclick = () => { selected.forEach(id => { const l = ACQ.lead(id); l.owner = +$('#to', m).value; ACQ.addEvent(l, { type: 'ASSIGN', text: '分配给 ' + ACQ.user(l.owner).name, cls: 'user' }); }); ACQ.save(); selected.clear(); close(); renderTable(); toast('已分配并企微通知', 'ok'); }; } }); }
function batchFlow() { Modal.open({ title: `将 ${selected.size} 条线索加入 SOP`, body: `<select class="select" id="fl">${ACQ.flows.filter(f => f.status === 'PUBLISHED').map(f => `<option value="${f.id}">${f.name} v${f.publishedVersion}</option>`).join('')}</select><div class="alert info small mt8">已在其他流程中的线索会被跳过（同一线索同时只运行一个流程）。</div>`, footer: '<button class="btn" data-close>取消</button><button class="btn primary" id="ok">加入</button>', onMount(m, close) { $('#ok', m).onclick = () => { let n = 0; selected.forEach(id => { if (ACQ.instanceOf(id)) return; const def = ACQ.flow($('#fl', m).value); const inst = { id: 'FI' + Date.now() + n, flowId: def.id, version: def.publishedVersion, leadId: id, status: 'ACTIVE', currentNode: def.first, stepSeq: 0, loops: {}, autoSends: 0, startedAt: Date.now(), log: [] }; const tr = Engine.flow.advance(inst, def, null); tr.forEach(t => inst.log.push(Object.assign({ t: Date.now() }, t))); ACQ.flowInstances.push(inst); const l = ACQ.lead(id); if (l.stage === 'NEW') l.stage = 'CONTACTED'; l.outreachCount++; n++; }); ACQ.save(); selected.clear(); close(); renderTable(); toast(`${n} 条已加入流程，首触消息进入发送队列`, 'ok'); }; } }); }
function batchStage(st) { selected.forEach(id => { ACQ.lead(id).stage = st; }); ACQ.save(); selected.clear(); renderTable(); toast('已忽略'); }
function outreachOne(id) { const l = ACQ.lead(id); const s = ACQ.script(101); const r = Engine.render(s, l); Modal.open({ title: `手动触达 · ${esc(l.nickname || '（无昵称）')}`, body: `<div class="field"><label>话术</label><select class="select" id="sc" onchange="window.__re()">${ACQ.scripts.filter(x => x.scene === 'OUTREACH' && x.enabled).map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div id="prev"></div>`, footer: '<button class="btn" data-close>取消</button><button class="btn primary" id="ok">加入发送队列</button>', onMount(m, close) { const re = () => { const rr = Engine.render(ACQ.script(+$('#sc', m).value), l); $('#prev', m).innerHTML = (rr.ok ? `<div class="bubble small">${esc(rr.text)}</div><div class="small muted mt8">个性化变量 ${rr.hits.map(h => '{' + h + '}').join(' ')}</div>` : `<div class="alert error small">${rr.problems.map(p => (p.code ? '<code>' + p.code + '</code> ' : '') + p.text).join('<br>')}</div><div class="small mt8">${UI.vars(ACQ.script(+$('#sc', m).value).content, rr.missing)}</div>${rr.missing.includes('nickname') ? `<div class="row mt8"><input class="input sm" id="nick" placeholder="补充昵称"><button class="btn sm" onclick="window.__fixn()">保存</button></div>` : ''}`); $('#ok', m).disabled = !rr.ok; }; window.__re = re; window.__fixn = () => { l.nickname = $('#nick', m).value.trim(); ACQ.save(); re(); }; re(); $('#ok', m).onclick = () => { const acc = ACQ.accounts.find(a => a.platform === l.platform && a.caps.includes('SEND_DM')) || ACQ.account('a2'); ACQ.outreach.unshift({ id: 'OT' + Date.now().toString().slice(-6), leadId: l.id, account: acc.id, trigger: 'MANUAL', round: 1, scriptId: +$('#sc', m).value, content: Engine.render(ACQ.script(+$('#sc', m).value), l).text, hits: Engine.render(ACQ.script(+$('#sc', m).value), l).hits, status: 'QUEUED', scheduledAt: Date.now() + 120e3 }); l.stage = 'CONTACTED'; l.outreachCount++; l.lastContactedAt = Date.now(); ACQ.addEvent(l, { type: 'OUTREACH', text: '手动触达已排队', cls: 'user' }); ACQ.save(); close(); renderTable(); toast(`已加入「${acc.name}」发送队列`, 'ok'); }; } }); }

/* 详情抽屉 */
function timeline(l) {
  const ev = [{ t: l.createdAt, cls: 'sys', s: `从「${esc(l.sourceChannel)}」抓取并去重`, d: `原文：${esc(l.sourceExcerpt)} · 意图 ${UI.intent(l.intent)} ${l.score} 分（${l.score >= 80 ? 'LLM+规则' : '规则'}）` }];
  if (l.sourceType === 'POSTER_SCAN') ev.push({ t: l.createdAt, cls: 'sys', s: '扫码来源归因：海报「9 月新客锁价 7 天」· 渠道码 Q7K2MV-G（微信群）' });
  ACQ.outreach.filter(o => o.leadId === l.id).forEach(o => ev.push({ t: o.sentAt || o.scheduledAt || l.createdAt, cls: 'ai', s: `${({ JOB: '定时任务', MANUAL: '手动', FOLLOW_UP: '自动跟进', AUTO_REPLY: '自动回复' })[o.trigger] || o.trigger}触达 · ${esc((ACQ.script(o.scriptId) || {}).name || '')} ${UI.status(o.status)}`, d: o.status === 'FAILED' || o.status === 'BLOCKED' ? `<span style="color:var(--danger)">${esc(o.failMessage)}</span>` : `${esc(o.content)}${o.hits && o.hits.length ? '<br>变量 ' + o.hits.map(h => '{' + h + '}').join(' ') : ''} · 经「${esc((ACQ.account(o.account) || {}).name)}」${o.evidence ? ' · <a onclick="toast(\'截图存证（演示）\')">截图</a>' : ''}` }));
  const c = ACQ.convOf(l.id); if (c) c.messages.filter(m => m.dir === 'IN').forEach(m => ev.push({ t: m.t, cls: 'cust', s: `客户回复：${esc(m.text)}`, d: m.match ? (m.match.refusal ? '命中拒绝词 → 拉黑并终止' : `${m.match.source === 'RULE' ? '规则' : 'LLM'} ${esc(m.match.rule || m.match.category || '')}${m.match.scriptId ? ' → 自动回复「' + esc((ACQ.script(m.match.scriptId) || {}).name) + '」' : ''}`) : '' }));
  ACQ.flowInstances.filter(i => i.leadId === l.id).forEach(i => { const f = ACQ.flow(i.flowId); ev.push({ t: i.startedAt, cls: 'flow', s: `进入流程「${esc(f.name)}」v${i.version}` }); (i.log || []).filter(x => x.t && x.type !== 'Send').forEach(x => ev.push({ t: x.t, cls: 'flow', s: `流程 · ${Engine.flow.label(f, x.node)} → ${x.outcome}`, d: x.ref || '' })); if (i.endedAt) ev.push({ t: i.endedAt, cls: 'flow', s: `流程结束 · ${i.endReason}` }); });
  ACQ.approvals.filter(a => a.leadId === l.id).forEach(a => ev.push({ t: a.createdAt, cls: 'user', s: `审核单 ${a.id} · ${a.type === 'QUOTE' ? '报价' : a.type === 'CONTRACT' ? '合同' : 'AI 润色'} ${UI.status(a.status)}`, d: a.finalContent ? '发送：' + esc(a.finalContent) : '' }));
  ACQ.followUps.filter(x => x.leadId === l.id).forEach(x => ev.push({ t: x.dueAt, cls: 'sys', s: `${x.status === 'DONE' ? '已完成跟进' : '计划跟进'} · ${({ FLOW_HUMAN_TASK: '流程人工任务', FLOW_WAIT_REPLY: '等待回复到期', FLOW_WAIT: '定时唤醒', NO_REPLY: '无回复自动二跟', CONSIDERING: '再考虑到期', HUMAN_SET: '人工设置' })[x.reason] || x.reason}${x.note ? ' · ' + esc(x.note) : ''}`, future: x.dueAt > Date.now() && x.status === 'PENDING' }));
  (l.events || []).forEach(e => ev.push({ t: e.t, cls: e.cls || 'user', s: esc(e.text) }));
  if (l.wonAt) ev.push({ t: l.wonAt, cls: 'user', s: `标记成交 ${fmt.money(l.wonAmount)} · 已同步客户中心` });
  return ev.sort((a, b) => b.t - a.t);
}
function openLead(id) {
  const l = ACQ.lead(id); if (!l) return; const inst = ACQ.instanceOf(id); const conv = ACQ.convOf(id); const s101 = ACQ.script(101); const v = Engine.vars(l); const dup = ACQ.leads.filter(x => x.id !== l.id && x.nickname && x.nickname === l.nickname);
  let tab = 'overview';
  const d = Drawer.open({ title: `${UI.platform(l.platform)} ${esc(l.nickname || '（无昵称）')} ${UI.stage(l.stage)} ${UI.score(l.score)}${l.isTest ? ' <span class="tag">测试</span>' : ''}`, sub: `${l.id} · 负责人 ${ACQ.user(l.owner).name} · 抓取于 ${fmt.time(l.createdAt)} · 最近活跃 ${fmt.ago(l.lastActiveAt)}`, wide: true, body: `<div class="tabs" style="padding:0;margin:-6px 0 12px" id="ltabs">${[['overview', '概览'], ['timeline', `时间线`], ['vars', '变量检查'], ['outreach', `触达记录 <span class="n">${ACQ.outreach.filter(o => o.leadId === id).length}</span>`]].map(x => `<button data-t="${x[0]}">${x[1]}</button>`).join('')}</div><div id="lbody"></div>`,
    footer: `${conv ? `<a class="btn primary" href="workbench.html?c=${conv.id}">打开会话</a>` : `<button class="btn primary" onclick="outreachOne('${id}')">发起触达</button>`}<button class="btn" onclick="editLead('${id}')">编辑</button><button class="btn" onclick="setFollow('${id}')">设置跟进</button>${isAdmin ? `<button class="btn" onclick="transfer('${id}')">转交</button>` : ''}${l.stage !== 'WON' ? `<button class="btn" onclick="mark('${id}','WON')">成交</button>` : ''}${l.stage !== 'LOST' ? `<button class="btn" onclick="mark('${id}','LOST')">流失</button>` : ''}<button class="btn danger" onclick="blacklist('${id}')">拉黑</button>`,
    onMount(m) {
      const draw = () => {
        $$('#ltabs button', m).forEach(b => b.classList.toggle('on', b.dataset.t === tab));
        const b = $('#lbody', m);
        if (tab === 'overview') b.innerHTML = `<div class="split">
          <div><div class="card" style="box-shadow:none"><div class="card-b"><dl class="kv"><dt>渠道</dt><dd>${UI.platform(l.platform, true)} · ${esc(l.sourceChannel)}</dd><dt>平台 ID</dt><dd class="mono">${esc(l.platformUserId || '—')}</dd><dt>来源原文</dt><dd>${esc(l.sourceExcerpt)}${l.sourceUrl ? ` <a href="${l.sourceUrl}" target="_blank">原帖 ↗</a>` : ''}</dd><dt>意图</dt><dd>${UI.intent(l.intent)} · ${l.score} 分</dd><dt>产品</dt><dd>${esc(l.product || '—')}</dd><dt>地区</dt><dd>${esc(l.region || '—')}</dd><dt>公司</dt><dd>${esc(l.company || '—')}</dd><dt>手机</dt><dd>${l.phone ? `${l.phone} <a onclick="toast('已记录查看审计（PIPL）','ok')">查看完整</a>` : '—'}</dd><dt>标签</dt><dd>${l.tags.map(t => UI.tag(t)).join(' ') || '—'}</dd>${l.lostReason ? `<dt>流失原因</dt><dd>${({ REFUSED: '客户拒绝', NO_REPLY: '多次无回复', NOT_TARGET: '非目标客户', COMPETITOR: '已选同行' })[l.lostReason] || l.lostReason}</dd>` : ''}${l.wonAmount ? `<dt>成交金额</dt><dd>${fmt.money(l.wonAmount)}</dd>` : ''}</dl>
            ${l.entities && Object.keys(l.entities).length ? `<div class="mt12 small"><span class="muted">抽取实体：</span>${Object.entries(l.entities).filter(x => x[0] !== 'count').map(x => `<span class="tag primary">${({ spec: '规格', quantity: '数量', address: '地点', delivery: '交期' })[x[0]] || x[0]} ${esc(x[1])}</span>`).join(' ')}</div>` : ''}
            ${dup.length ? `<div class="alert warn small mt12">发现 ${dup.length} 条同昵称线索（${dup.map(x => UI.platformName(x.platform)).join('、')}），可能是同一人 <a onclick="toast('已合并为一条线索，保留全部来源与时间线（演示）','ok')">合并</a></div>` : ''}
            ${!l.nickname ? `<div class="alert error small mt12">昵称为空：任何含 {nickname} 的话术都会被校验拦截（ACQ-2001）。<a onclick="editLead('${id}')">补充昵称</a></div>` : ''}
          </div></div></div>
          <div>
            <div class="card mb12" style="box-shadow:none"><div class="card-h" style="padding:10px 14px"><h3>跟进流程</h3>${inst ? UI.status(inst.status) : ''}</div><div class="card-b">${inst ? `<b>${esc(ACQ.flow(inst.flowId).name)}</b> <span class="muted small">v${inst.version}</span><div class="small mt8">当前：${Engine.flow.label(ACQ.flow(inst.flowId), inst.currentNode)}</div>${inst.waitingUntil && inst.status === 'WAITING' ? `<div class="small muted">${fmt.left(inst.waitingUntil)}${inst.waitingType === 'REPLY' ? '走「未回复」分支' : inst.waitingType === 'TIMER' ? '唤醒' : '升级主管'}</div>` : ''}<div class="small muted">自动发送 ${inst.autoSends}/${ACQ.flow(inst.flowId).guardrails.maxAutoSends}</div><a class="small" href="flows.html?id=${inst.flowId}&inst=${inst.id}">在流程图查看 →</a>` : `<span class="muted small">无进行中的流程</span> <a class="small" onclick="selected.clear();selected.add('${id}');batchFlow()">加入 SOP</a>`}</div></div>
            <div class="card" style="box-shadow:none"><div class="card-h" style="padding:10px 14px"><h3>统计</h3></div><div class="card-b"><div class="stat-mini"><div><b>${l.outreachCount}</b><span>触达</span></div><div><b>${l.replyCount}</b><span>回复</span></div><div><b>${l.autoFollowCount}</b><span>自动跟进</span></div><div><b>${ACQ.approvals.filter(a => a.leadId === id).length}</b><span>审核单</span></div></div></div></div>
          </div></div>`;
        else if (tab === 'timeline') { const ev = timeline(l); b.innerHTML = `<div class="timeline">${ev.map(e => `<div class="tl ${e.cls}"><div class="t">${fmt.time(e.t)}${e.future ? ' <span class="tag primary xs">计划</span>' : ''}</div><div class="s">${e.s}</div>${e.d ? `<div class="d">${e.d}</div>` : ''}</div>`).join('')}</div>`; }
        else if (tab === 'vars') { const r = Engine.render(s101, l); b.innerHTML = `<div class="alert ${r.ok ? 'ok' : 'error'} small mb12">${r.ok ? `✓ 以「${esc(s101.name)}」渲染通过，含 ${r.hits.length} 个个性化变量` : '✖ ' + r.problems.map(p => p.text).join('；')}</div><table class="table vartable"><thead><tr><th>变量</th><th>取值</th><th>来源</th><th>类型</th></tr></thead><tbody>${Object.entries(v).map(([k, val]) => `<tr><td><span class="var ${val ? '' : 'miss'}">{${k}}</span></td><td>${val ? esc(String(val).slice(0, 60)) : '<span style="color:var(--danger)">（空）</span>'}</td><td class="small muted">${({ nickname: '线索昵称', source_channel: '抓取渠道', source_excerpt: '来源原文', last_interaction: '最近一条客户消息', product: '线索产品 / 商家主营', sales_name: '负责人姓名', company: '商家名称', case_link: '企业资料库 · 案例链接', company_intro: '企业资料库 · 企业介绍' })[k]}</td><td>${Engine.PERSONAL_VARS.includes(k) ? '<span class="tag ai xs">个性化</span>' : '<span class="tag xs">通用</span>'}</td></tr>`).join('')}</tbody></table><div class="small muted mt12">渲染预览：</div><div class="bubble small mt8">${r.ok ? esc(r.text) : UI.vars(s101.content, r.missing)}</div>`; }
        else if (tab === 'outreach') { const os = ACQ.outreach.filter(o => o.leadId === id).sort((a, b) => (b.sentAt || b.scheduledAt || 0) - (a.sentAt || a.scheduledAt || 0)); b.innerHTML = UI.table([{ label: '时间', render: o => fmt.time(o.sentAt || o.scheduledAt || l.createdAt) }, { label: '轮次/触发', render: o => `第 ${o.round} 轮 · ${({ JOB: '定时任务', MANUAL: '手动', FOLLOW_UP: '自动跟进', AUTO_REPLY: '自动回复' })[o.trigger] || o.trigger}` }, { label: '话术', render: o => esc((ACQ.script(o.scriptId) || {}).name || '自由文本') }, { label: '内容', render: o => `<span class="small">${esc(o.content || '—')}</span>${o.failMessage ? `<span class="sub" style="color:var(--danger)">${esc(o.failMessage)}</span>` : ''}` }, { label: '账号', render: o => `${UI.platform((ACQ.account(o.account) || {}).platform)}<span class="small">${esc((ACQ.account(o.account) || {}).name)}</span>` }, { label: '状态', render: o => UI.status(o.status) + (o.replied ? ' <span class="tag success xs">已回复</span>' : '') }], os, { empty: '尚无触达' }); }
      };
      $$('#ltabs button', m).forEach(btn => btn.onclick = () => { tab = btn.dataset.t; draw(); }); draw();
      m.__redraw = draw;
    } });
  window.__leadDrawer = d;
}
function reopen(id) { if (window.__leadDrawer) window.__leadDrawer.close(); renderTable(); openLead(id); }
function editLead(id) { const l = ACQ.lead(id); Modal.open({ title: '编辑线索', body: `<div class="field"><label>昵称</label><input class="input" id="n" value="${esc(l.nickname)}" placeholder="如客户在平台的昵称为空，可填「您好」以外的称呼"></div><div class="grid g2"><div class="field"><label>产品</label><input class="input" id="p" value="${esc(l.product || '')}"></div><div class="field"><label>地区</label><input class="input" id="r" value="${esc(l.region || '')}"></div><div class="field"><label>公司</label><input class="input" id="c" value="${esc(l.company || '')}"></div><div class="field"><label>手机</label><input class="input" id="ph" value="${esc(l.phone || '')}" placeholder="加密存储，脱敏展示"></div></div>`, footer: '<button class="btn" data-close>取消</button><button class="btn primary" id="ok">保存</button>', onMount(m, close) { $('#ok', m).onclick = () => { const old = l.nickname; l.nickname = $('#n', m).value.trim(); l.product = $('#p', m).value; l.region = $('#r', m).value; l.company = $('#c', m).value; l.phone = $('#ph', m).value; ACQ.addEvent(l, { type: 'EDIT', text: `编辑线索${old !== l.nickname ? '：昵称「' + (old || '空') + '」→「' + l.nickname + '」' : ''}`, cls: 'user' }); ACQ.save(); close(); reopen(id); toast('已保存', 'ok'); }; } }); }
function setFollow(id) { Modal.open({ title: '设置跟进', body: `<div class="field"><label>时间</label><select class="select" id="when"><option value="3">3 小时后</option><option value="24">明天</option><option value="72" selected>3 天后</option><option value="168">一周后</option></select></div><div class="field"><label>备注</label><input class="input" id="nt"></div>`, footer: '<button class="btn" data-close>取消</button><button class="btn primary" id="ok">保存</button>', onMount(m, close) { $('#ok', m).onclick = () => { ACQ.followUps.unshift({ id: 'FU' + Date.now(), leadId: id, owner: me.id, type: 'MANUAL', reason: 'HUMAN_SET', dueAt: Date.now() + (+$('#when', m).value) * ACQ.H, status: 'PENDING', note: $('#nt', m).value }); ACQ.save(); close(); toast('已加入跟进待办', 'ok'); }; } }); }
function transfer(id) { const l = ACQ.lead(id); Modal.open({ title: '转交', body: `<select class="select" id="to">${ACQ.users.filter(u => u.role === 'sales' && u.id !== l.owner).map(u => `<option value="${u.id}">${u.name}</option>`).join('')}</select>`, footer: '<button class="btn" data-close>取消</button><button class="btn primary" id="ok">转交</button>', onMount(m, close) { $('#ok', m).onclick = () => { l.owner = +$('#to', m).value; ACQ.addEvent(l, { type: 'TRANSFER', text: '转交给 ' + ACQ.user(l.owner).name, cls: 'user' }); ACQ.save(); close(); reopen(id); }; } }); }
function mark(id, st) { const l = ACQ.lead(id); if (st === 'WON') Modal.open({ title: '标记成交', body: `<div class="field"><label>金额（元）</label><input class="input" id="amt" type="number" value="120000"></div><label class="checkbox"><input type="checkbox" checked> 同步到货袋子客户中心（单向）</label>`, footer: '<button class="btn" data-close>取消</button><button class="btn primary" id="ok">确认</button>', onMount(m, close) { $('#ok', m).onclick = () => { l.stage = 'WON'; l.wonAmount = +$('#amt', m).value; l.wonAt = Date.now(); const i = ACQ.instanceOf(id); if (i) { i.status = 'TERMINATED'; i.endReason = 'STAGE_WON'; } ACQ.save(); close(); reopen(id); toast('已成交并同步', 'ok'); }; } });
  else Modal.open({ title: '标记流失', body: `<select class="select" id="rs"><option value="NOT_TARGET">非目标客户</option><option value="NO_REPLY">多次无回复</option><option value="REFUSED">客户拒绝</option><option value="COMPETITOR">已选同行</option></select>`, footer: '<button class="btn" data-close>取消</button><button class="btn primary" id="ok">确认</button>', onMount(m, close) { $('#ok', m).onclick = () => { l.stage = 'LOST'; l.lostReason = $('#rs', m).value; const i = ACQ.instanceOf(id); if (i) { i.status = 'TERMINATED'; i.endReason = 'STAGE_LOST'; } ACQ.addEvent(l, { type: 'LOST', text: '标记流失', cls: 'user' }); ACQ.save(); close(); reopen(id); }; } }); }
function blacklist(id) { const l = ACQ.lead(id); Modal.confirm('加入黑名单', `将「${esc(l.nickname)}」加入黑名单：终止流程、取消排队消息、所有渠道不再自动触达。`, () => { l.stage = 'LOST'; l.lostReason = 'REFUSED'; const i = ACQ.instanceOf(id); if (i) { i.status = 'TERMINATED'; i.endReason = 'BLACKLISTED'; } const c = ACQ.convOf(id); if (c) c.status = 'CLOSED'; ACQ.outreach.filter(o => o.leadId === id && o.status === 'QUEUED').forEach(o => o.status = 'CANCELLED'); ACQ.blacklist.unshift({ id: 'BL' + Date.now(), platform: l.platform, peer: l.nickname, leadId: id, reason: 'MANUAL', evidence: '人工拉黑', t: Date.now() }); ACQ.addEvent(l, { type: 'BLACKLIST', text: '加入黑名单', cls: 'user' }); ACQ.save(); reopen(id); toast('已拉黑'); }, { danger: true, okText: '拉黑' }); }
function manualAdd() { Modal.open({ title: '手工录入线索', body: `<div class="grid g2"><div class="field"><label>昵称 *</label><input class="input" id="n" placeholder="客户昵称 / 称呼"></div><div class="field"><label>渠道</label><select class="select" id="p">${['WECHAT_PERSONAL', 'WECOM', 'DOUYIN', 'XIAOHONGSHU', 'FORUM', 'HDZ_INTERNAL'].map(x => `<option value="${x}">${UI.platformName(x)}</option>`).join('')}</select></div></div><div class="field"><label>来源说明</label><input class="input" id="sc" placeholder="例如：微信群-苏州建材采购群 / 线下展会"></div><div class="field"><label>客户原话 / 需求</label><textarea class="input" id="ex" placeholder="例如：想问下螺纹钢 HRB400 16 的现在什么价，要 80 吨到常州" oninput="window.__cls()"></textarea><div class="hint" id="cls"></div></div><div class="grid g2"><div class="field"><label>负责人</label><select class="select" id="o">${ACQ.users.filter(u => u.role === 'sales').map(u => `<option value="${u.id}" ${u.id === me.id ? 'selected' : ''}>${u.name}</option>`).join('')}</select></div><div class="field"><label>&nbsp;</label><label class="checkbox"><input type="checkbox" id="t"> 标记为测试线索（不计入统计，用于试运行）</label></div></div>`, footer: '<button class="btn" data-close>取消</button><button class="btn primary" id="ok">录入</button>', onMount(m, close) { window.__cls = () => { const t = $('#ex', m).value; if (!t) return $('#cls', m).textContent = ''; const c = Engine.classifyIntent(t); const e = Engine.extractEntities(t); $('#cls', m).innerHTML = `AI 识别：意图 <b>${UI.intent(c.intent)}</b> · ${c.score} 分 · ${c.reason}${e.count ? ' · 实体 ' + Object.entries(e).filter(x => x[0] !== 'count').map(x => x[1]).join(' / ') : ''}`; }; $('#ok', m).onclick = () => { const n = $('#n', m).value.trim(); if (!n) return toast('昵称必填', 'warn'); const t = $('#ex', m).value; const c = Engine.classifyIntent(t || '手工录入'); const e = Engine.extractEntities(t); const id = 'L' + String(ACQ.leads.length + 1).padStart(3, '0'); const l = { id, nickname: n, platform: $('#p', m).value, platformUserId: 'manual_' + Date.now(), sourceType: 'MANUAL', sourceChannel: $('#sc', m).value || '手工录入', sourceExcerpt: t, intent: c.intent, score: c.score, stage: 'NEW', owner: +$('#o', m).value, product: e.spec ? '螺纹钢 ' + e.spec : '', region: e.address || '', tags: [], outreachCount: 0, autoFollowCount: 0, replyCount: 0, isTest: $('#t', m).checked, createdAt: Date.now(), lastActiveAt: Date.now(), events: [{ t: Date.now(), type: 'MANUAL', text: `由 ${me.name} 手工录入`, cls: 'user' }] }; if (e.count) { l.entities = Object.assign({}, e); delete l.entities.count; } if (l.isTest) l.tags.push('测试'); ACQ.leads.push(l); ACQ.save(); close(); F.test = l.isTest; render(); openLead(id); toast('已录入；若符合 SOP 触发条件将自动进入流程', 'ok'); }; } }); }
render();
if (qs('open')) openLead(qs('open'));
App.note(`<b>演示提示</b>：点行打开详情抽屉，「变量检查」页展示每个变量取值；标注「缺昵称」的论坛匿名线索在「触达」时会被拦截并可就地补充。`);
</script>

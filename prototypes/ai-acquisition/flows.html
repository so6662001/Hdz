<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>跟进流程（SOP）</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  .content { padding: 0 !important; }
  .fl { display: grid; grid-template-columns: 250px 1fr; height: calc(100vh - 56px); }
  .flist { border-right: 1px solid var(--border); background: #fff; overflow-y: auto; }
  .fitem { padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer; } .fitem:hover { background: #f8faff; } .fitem.on { background: var(--primary-weak); border-right: 3px solid var(--primary); }
  .fitem b { font-size: 13px; display: block; } .fitem .d { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
  .fmain { display: flex; flex-direction: column; min-width: 0; }
  .fhead { background: #fff; border-bottom: 1px solid var(--border); padding: 12px 20px; }
  .fbody { flex: 1; display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
  .canvas { overflow: auto; padding: 20px 24px 60px; background: radial-gradient(#e3e7ef 1px, transparent 1px) 0 0/18px 18px; }
  .panel { border-left: 1px solid var(--border); background: #fff; overflow-y: auto; padding: 16px; }
  .panel h4 { font-size: 13px; margin-bottom: 10px; } .panel h5 { font-size: 12px; color: var(--text-3); margin: 14px 0 6px; }
  .tree-col { max-width: 560px; }
  .trace { font-size: 12px; } .trace div { padding: 5px 0; border-bottom: 1px dashed var(--border); } .trace b { color: var(--hot); }
  .brrow { display: grid; grid-template-columns: 96px minmax(0,1fr) 20px; gap: 6px; align-items: center; margin-bottom: 6px; } .brrow select { min-width: 0; width: 100%; } .brrow .tag { justify-content: flex-start; overflow: hidden; }
  .panel select.select { max-width: 100%; }
  .vtag { font-size: 11px; color: var(--text-4); }
  .conn { width: 2px; height: 10px; background: var(--border-2); margin-left: 24px; }
</style>
</head>
<body>
<script src="shared/data.js"></script><script src="shared/engine.js"></script><script src="shared/app.js"></script>
<script>
const me = App.me(); const root = App.mount({ active: 'flows', title: '跟进流程（SOP）' });
let curId = qs('id', 'F1'), tab = qs('inst') ? 'inst' : qs('tab', 'edit'), selNode = null, sim = null, viewInst = qs('inst', null), lastValidate = null;
const META = Engine.flow.NODE_META, BL = Engine.flow.BRANCH_LABEL;
const CATEGORIES = ['NO_REPLY', 'REFUSED', 'ASK_PRICE', 'ASK_CASE', 'ASK_MATERIAL', 'CONSIDERING', 'HAS_ENTITIES', 'INQUIRY', 'CONTRACT', '*'];
const cur = () => ACQ.flow(curId);

function render() {
  const f = cur();
  root.innerHTML = `<div class="fl">
    <div class="flist">
      <div style="padding:12px 14px;border-bottom:1px solid var(--border)"><button class="btn primary sm" style="width:100%" onclick="newFlow()">＋ 新建流程</button></div>
      ${ACQ.flows.map(x => `<div class="fitem ${x.id === curId ? 'on' : ''}" onclick="curId='${x.id}';selNode=null;sim=null;viewInst=null;tab='edit';render()"><b>${esc(x.name)}</b><div class="row" style="gap:4px;margin-top:4px">${UI.status(x.status)}<span class="vtag">v${x.publishedVersion || 0}${x.status === 'DRAFT' && x.version > (x.publishedVersion || 0) ? ' · 草稿 v' + x.version : ''}</span></div><div class="d">推进中 ${ACQ.flowInstances.filter(i => i.flowId === x.id && ['ACTIVE', 'WAITING', 'PAUSED'].includes(i.status)).length} · 近 30 天进入 ${x.stats30.entered}</div></div>`).join('')}
      <div style="padding:12px 14px" class="small muted">流程 = 有向图：触发 → 发送 / 等待 / 等待回复（多分支）/ 人工任务 / 置阶段 / 回到 / 结束。护栏：拒绝即终止、最多自动发送 N 条、循环上限、版本隔离。</div>
    </div>
    <div class="fmain">
      <div class="fhead">
        <div class="row"><b style="font-size:16px">${esc(f.name)}</b>${UI.status(f.status)}<span class="vtag">v${f.version}${f.publishedVersion ? ' · 已发布 v' + f.publishedVersion : ''}</span><span class="sp"></span>
          <div class="tabs" style="border:0;padding:0">${[['edit', '编辑器'], ['sim', '模拟'], ['inst', `实例 <span class="n">${ACQ.flowInstances.filter(i => i.flowId === f.id).length}</span>`], ['stats', '统计与版本']].map(x => `<button class="${tab === x[0] ? 'on' : ''}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join('')}</div>
        </div>
        <div class="row small muted mt8"><span>触发：${trig(f)}</span><span>·</span><span>护栏：最多自动发送 ${f.guardrails.maxAutoSends} 条 · 循环上限 ${f.guardrails.maxLoops} · 拒绝词立即终止</span><span>·</span><span>${esc(f.description || '')}</span></div>
      </div>
      <div class="fbody"><div class="canvas" id="canvas"></div><div class="panel" id="panel"></div></div>
    </div></div>`;
  renderCanvas(); renderPanel();
}
const trig = f => f.trigger.on === 'MANUAL' ? '手动加入' : `线索进入「${({ NEW: '新线索', CONTACTED: '已触达', REPLIED: '已回复' })[f.trigger.stage] || f.trigger.stage}」${f.trigger.fromStage ? '（来自 ' + f.trigger.fromStage + '）' : ''} 且意图分 ≥ ${f.trigger.minScore}${f.trigger.platforms && f.trigger.platforms.length ? ' · 渠道 ' + f.trigger.platforms.join('/') : ''} · 优先级 ${f.trigger.priority}`;

/* ---------- 纵向树 ---------- */
function renderCanvas() {
  const f = cur(); const el = $('#canvas'); const visited = new Set(); const lit = new Set(), curNode = activeInst() ? activeInst().currentNode : null;
  if (activeInst()) (activeInst().log || []).forEach(x => lit.add(x.node));
  const nodeHtml = (id) => { const n = f.nodes[id]; if (!n) return `<div class="alert error small">节点 ${id} 不存在</div>`; const M = META[n.type] || [n.type, '', '•']; const s = n.type === 'Send' ? ACQ.script(n.scriptId) : null; const stat = statOf(id); return `<div class="fnode ${selNode === id ? 'sel' : ''} ${lit.has(id) ? 'lit' : ''} ${curNode === id ? 'cur' : ''}" onclick="selNode='${id}';renderPanel();renderCanvas()"><div class="ic ${M[1]}">${M[2]}</div><div class="body"><b>${Engine.flow.label(f, id)}</b>${s ? `<div class="d">${esc(s.content.slice(0, 60))}${s.content.length > 60 ? '…' : ''}</div>` : ''}${n.type === 'WaitForReply' ? `<div class="d">${n.autoReplyByScriptLib ? '等待期间由话术库自动回复' : '等待期间不自动回复'} · 拒绝词随时终止</div>` : ''}${n.type === 'End' && n.handoff ? '<div class="d">交给负责人人工跟进</div>' : ''}${stat ? `<div class="st">${stat}</div>` : ''}${curNode === id && activeInst() ? `<div class="st" style="color:var(--hot)">◉ 当前 · ${activeInst().status === 'WAITING' ? (activeInst().waitingType === 'HUMAN_TASK' ? '等人工处理' : activeInst().waitingType === 'TIMER' ? '定时等待' : '等待客户回复') + (activeInst().waitingUntil ? ' · ' + fmt.left(activeInst().waitingUntil) : '') : activeInst().status}</div>` : ''}</div><span class="vtag mono">${id}</span><span class="more" onclick="event.stopPropagation();nodeMenu('${id}')">⋯</span></div>`; };
  const walk = (id, depth) => {
    if (!id) return `<div class="fadd" onclick="addNodeMenu(null,null)">＋ 添加下一步</div>`;
    if (visited.has(id)) return `<div class="fref">↺ 回到「${Engine.flow.label(f, id)}」（${id}）</div>`;
    const n = f.nodes[id]; if (!n) return `<div class="alert error small">引用了不存在的节点 ${id}</div>`; visited.add(id); let h = nodeHtml(id);
    if (n.type === 'End') return h;
    if (n.type === 'GoTo') return h + (n.onExceed ? `<div class="fbranches"><div class="fbranch"><span class="bl">超过 ${n.maxLoops} 次</span>${walk(n.onExceed, depth + 1)}</div></div>` : '');
    if (n.type === 'WaitForReply' || n.type === 'Branch') { const keys = Object.keys(n.branches); return h + `<div class="fbranches">${keys.map(k => `<div class="fbranch"><span class="bl ${activeTraceHas(id, k) ? 'lit' : ''}">${k === '*' ? '其他回复' : (BL[k] || k)} <span class="vtag">→</span></span> <span class="fadd" style="padding:0 6px;font-size:11px" onclick="event.stopPropagation();insertOnBranch('${id}','${k}')">＋插入</span>${walk(n.branches[k], depth + 1)}</div>`).join('')}<div class="fadd" onclick="event.stopPropagation();addBranch('${id}')">＋ 添加分支</div></div>`; }
    if (n.type === 'HumanTask') return h + `<div class="fbranches"><div class="fbranch"><span class="bl">完成 →</span>${walk(n.next, depth + 1)}</div>${n.onEscalate ? `<div class="fbranch"><span class="bl">${n.escalateAfterHours}h 未处理 · 升级 →</span>${walk(n.onEscalate, depth + 1)}</div>` : ''}</div>`;
    return h + `<div class="conn"></div><div class="fadd" style="margin-left:14px" onclick="event.stopPropagation();addNodeMenu('${id}')">＋ 在此后插入</div>` + walk(n.next, depth);
  };
  const v = Engine.flow.validate(f);
  el.innerHTML = `<div class="tree-col flow-tree">
    <div class="fnode" style="background:#0f1b33;color:#fff;border-color:#0f1b33;cursor:default"><div class="ic" style="background:#1f5eff;color:#fff">▶</div><div class="body"><b style="color:#fff">触发</b><div class="d" style="color:#c7d0e3">${trig(f)}</div></div></div>
    ${walk(f.first, 0)}
    ${Object.keys(f.nodes).filter(id => !visited.has(id)).length ? `<div class="mt16 small muted">孤立节点（不可达）：${Object.keys(f.nodes).filter(id => !visited.has(id)).map(id => `<a onclick="selNode='${id}';renderPanel()">${id}</a>`).join('、')}</div>` : ''}
    ${v.errors.length || v.warnings.length ? `<div class="mt16">${v.errors.map(e => `<div class="alert error small mb8">✖ ${e}</div>`).join('')}${v.warnings.map(e => `<div class="alert warn small mb8">⚠ ${e}</div>`).join('')}</div>` : ''}
  </div>`;
}
function statOf(id) { const f = cur(); if (tab !== 'stats' && tab !== 'edit') return ''; const s = f.stats30; if (!s.entered) return ''; const n = f.nodes[id]; if (n.type === 'Send') return `近 30 天发送 ${Math.round(s.entered * (id === f.first ? 1 : .45))} · 回复率 ${id === f.first ? '32.8%' : '21.4%'}`; if (n.type === 'WaitForReply') return `未回复 ${Math.round(s.entered * .38)} · 问价 ${Math.round(s.entered * .17)} · 再考虑 ${Math.round(s.entered * .09)} · 其他 ${Math.round(s.entered * .21)}`; if (n.type === 'HumanTask') return `人工任务 ${Math.round(s.entered * .17)} · 平均处理 38 分钟 · 升级 6`; if (n.type === 'End') return `到达 ${Math.round(s.entered * (n.handoff ? .24 : n.stage === 'SILENT' ? .2 : .07))}`; return ''; }
function activeInst() { if (tab === 'sim' && sim) return sim.inst; if (viewInst) return ACQ.flowInstances.find(i => i.id === viewInst); return null; }
function activeTraceHas(node, key) { const i = activeInst(); return i && (i.log || []).some(x => x.node === node && x.outcome === key); }

/* ---------- 右侧面板 ---------- */
function renderPanel() {
  const f = cur(); const el = $('#panel');
  if (tab === 'sim') return renderSim(el);
  if (tab === 'inst') return renderInstances(el);
  if (tab === 'stats') return renderStats(el);
  const editable = true;
  if (!selNode || !f.nodes[selNode]) {
    const v = Engine.flow.validate(f);
    el.innerHTML = `<h4>流程设置</h4>
      <div class="field"><label>名称</label><input class="input" value="${esc(f.name)}" onchange="markEdit();cur().name=this.value;ACQ.save();render()"></div>
      <div class="field"><label>触发条件</label><div class="row"><select class="select sm" onchange="markEdit();cur().trigger.on=this.value;ACQ.save();render()"><option value="STAGE_ENTER" ${f.trigger.on === 'STAGE_ENTER' ? 'selected' : ''}>线索进入阶段</option><option value="MANUAL" ${f.trigger.on === 'MANUAL' ? 'selected' : ''}>手动加入</option></select>${f.trigger.on === 'STAGE_ENTER' ? `<select class="select sm" onchange="markEdit();cur().trigger.stage=this.value;ACQ.save();render()">${['NEW', 'CONTACTED', 'REPLIED'].map(s => `<option value="${s}" ${f.trigger.stage === s ? 'selected' : ''}>${s}</option>`).join('')}</select> 意图分 ≥ <input class="input sm" type="number" style="width:60px" value="${f.trigger.minScore || 0}" onchange="markEdit();cur().trigger.minScore=+this.value;ACQ.save();render()">` : ''}</div><div class="hint">同一线索同时只运行一个流程；多流程命中按优先级（数字小优先）。</div></div>
      <div class="field"><label>优先级</label><input class="input sm" type="number" style="width:80px" value="${f.trigger.priority || f.priority}" onchange="markEdit();cur().trigger.priority=+this.value;ACQ.save()"></div>
      <h5>护栏</h5>
      <div class="field inline"><label>最多自动发送</label><input class="input sm" type="number" style="width:70px" value="${f.guardrails.maxAutoSends}" onchange="markEdit();cur().guardrails.maxAutoSends=+this.value;ACQ.save();renderCanvas()"> 条 / 线索</div>
      <div class="field inline"><label>循环上限</label><input class="input sm" type="number" style="width:70px" value="${f.guardrails.maxLoops}" onchange="markEdit();cur().guardrails.maxLoops=+this.value;ACQ.save()"> 次</div>
      <div class="small muted">固定护栏（不可关闭）：客户拒绝 / 拉黑 → 立即终止；商家总开关暂停 → 全部实例暂停；线索成交 / 流失 → 终止。</div>
      <h5>校验</h5>
      ${v.ok ? `<div class="alert ok small">✓ 结构校验通过${v.warnings.length ? '，' + v.warnings.length + ' 条提示' : ''}</div>` : `<div class="alert error small">✖ ${v.errors.length} 个错误，无法发布</div>`}
      ${f.ambiguities && f.ambiguities.length ? `<div class="alert warn small mt8">来自自然语言解析的待确认项：<ul style="margin:4px 0 0 14px">${f.ambiguities.map(a => `<li>${a}</li>`).join('')}</ul></div>` : ''}
      <div class="row mt12"><button class="btn sm" onclick="validateFlow()">校验</button><button class="btn sm" onclick="saveDraft()">保存草稿</button><button class="btn primary sm" ${v.ok ? '' : 'disabled'} onclick="publish()">发布 v${f.publishedVersion ? f.publishedVersion + 1 : 1}</button></div>
      <div class="row mt8"><button class="btn sm" onclick="duplicate()">复制为新流程</button><button class="btn sm" onclick="showJson()">查看 JSON</button>${f.status !== 'TEMPLATE' ? `<button class="btn sm danger" onclick="delFlow()">删除</button>` : ''}</div>
      <div class="alert info small mt12">点击画布中的节点可编辑；「＋ 在此后插入」新增线性节点，分支上的「＋插入」在该分支路径前插入节点。</div>`;
    return;
  }
  const id = selNode, n = f.nodes[id]; const others = Object.keys(f.nodes).filter(x => x !== id);
  const sel = (val, attr, allowNew) => `<select class="select sm" ${attr}><option value="">（无）</option>${others.map(o => `<option value="${o}" ${val === o ? 'selected' : ''}>${o} · ${Engine.flow.label(f, o)}</option>`).join('')}${allowNew ? '<option value="__new">＋ 新建节点…</option>' : ''}</select>`;
  let form = '';
  if (n.type === 'Send') { const s = ACQ.script(n.scriptId); const sample = ACQ.lead('L001'); const r = s ? Engine.render(s, sample) : null; form = `<div class="field"><label>话术</label><select class="select" onchange="setProp('scriptId',+this.value)">${ACQ.scripts.filter(x => x.enabled).map(x => `<option value="${x.id}" ${x.id === n.scriptId ? 'selected' : ''}>${esc(x.name)} · 回复率 ${fmt.pct(x.reply7, x.sent7)}</option>`).join('')}</select></div>${s ? `<div class="small muted">模板：</div><div class="small">${UI.vars(s.content)}</div><div class="small muted mt8">以线索「张总」预览：</div><div class="bubble small mt8">${esc(r.text)}</div>${s.requiresHuman ? '<div class="alert warn small mt8">该话术为「转人工」类型，发送后会建人工任务，建议后接「人工任务」节点</div>' : ''}<div class="mt8"><a href="scripts.html?open=${s.id}" class="small">编辑话术 →</a></div>` : ''}<div class="field mt12"><label>下一步</label>${sel(n.next, `onchange="setNext(this.value)"`, true)}</div>`; }
  else if (n.type === 'Wait') form = `<div class="field"><label>等待时长</label><div class="row"><input class="input sm" type="number" style="width:80px" value="${n.hours}" onchange="setProp('hours',+this.value)"> 小时 <div class="chips">${[[24, '1 天'], [72, '3 天'], [168, '7 天']].map(x => `<span class="chip ${n.hours === x[0] ? 'on' : ''}" onclick="setProp('hours',${x[0]})">${x[1]}</span>`).join('')}</div></div><div class="hint">到期由 FlowScheduler 唤醒；等待期间客户若回复，仍由话术库自动回复但不改变流程位置</div></div><div class="field"><label>下一步</label>${sel(n.next, `onchange="setNext(this.value)"`, true)}</div>`;
  else if (n.type === 'WaitForReply') form = `<div class="field"><label>最长等待</label><div class="row"><input class="input sm" type="number" style="width:80px" value="${n.timeoutHours}" onchange="setProp('timeoutHours',+this.value)"> 小时 <div class="chips">${[[24, '1 天'], [72, '3 天'], [120, '5 天']].map(x => `<span class="chip ${n.timeoutHours === x[0] ? 'on' : ''}" onclick="setProp('timeoutHours',${x[0]})">${x[1]}</span>`).join('')}</div><div class="hint">超时走「未回复」分支</div></div><label class="checkbox mb12"><input type="checkbox" ${n.autoReplyByScriptLib ? 'checked' : ''} onchange="setProp('autoReplyByScriptLib',this.checked)"> 等待期间由话术库自动回复（关闭则只记录不回复）</label><h5>分支（按回复分类）</h5>${Object.keys(n.branches).map(k => `<div class="brrow"><span class="tag ${k === 'REFUSED' ? 'danger' : k === 'NO_REPLY' ? 'warning' : k === '*' ? '' : 'primary'}">${k === '*' ? '其他回复' : BL[k] || k}</span>${sel(n.branches[k], `onchange="setBranch('${k}',this.value)"`, true)}<span class="x" style="font-size:16px" onclick="delBranch('${k}')" title="删除分支">×</span></div>`).join('')}<div class="fadd" onclick="addBranch('${id}')">＋ 添加分支</div><div class="hint mt8">分类来源：规则关键词优先，其次 LLM 语义分类（置信度 ≥0.7）；「提到数量/规格」由实体抽取触发；「拒绝」为固定护栏，命中即终止。</div>`;
  else if (n.type === 'HumanTask') form = `<div class="field"><label>任务类型</label><select class="select sm" onchange="setProp('kind',this.value)">${[['QUOTE', '报价'], ['CONTRACT', '合同/账期'], ['FOLLOW_UP', '电话/上门跟进'], ['CUSTOM', '自定义']].map(x => `<option value="${x[0]}" ${n.kind === x[0] ? 'selected' : ''}>${x[1]}</option>`).join('')}</select></div><div class="field inline"><label>未处理升级</label><input class="input sm" type="number" style="width:70px" value="${n.escalateAfterHours || 2}" onchange="setProp('escalateAfterHours',+this.value)"> 小时后通知主管</div><div class="field"><label>完成后</label>${sel(n.next, `onchange="setNext(this.value)"`, true)}</div><div class="field"><label>升级后</label>${sel(n.onEscalate, `onchange="setProp('onEscalate',this.value||undefined)"`)}</div><div class="hint">创建审核单 / 跟进待办并企微通知负责人；期间机器暂停对该客户的自动回复。</div>`;
  else if (n.type === 'SetStage') form = `<div class="field"><label>阶段</label><select class="select sm" onchange="setProp('stage',this.value)">${[['HOT', '高意向'], ['REPLIED', '已回复'], ['SILENT', '静默'], ['LOST', '流失']].map(x => `<option value="${x[0]}" ${n.stage === x[0] ? 'selected' : ''}>${x[1]}</option>`).join('')}</select></div><div class="field"><label>下一步</label>${sel(n.next, `onchange="setNext(this.value)"`, true)}</div>`;
  else if (n.type === 'Notify') form = `<div class="field"><label>通知对象</label><select class="select sm" onchange="setProp('to',this.value)"><option value="owner" ${n.to === 'owner' ? 'selected' : ''}>线索负责人</option><option value="admin" ${n.to === 'admin' ? 'selected' : ''}>管理员</option></select></div><div class="field"><label>下一步</label>${sel(n.next, `onchange="setNext(this.value)"`, true)}</div>`;
  else if (n.type === 'GoTo') form = `<div class="field"><label>回到节点</label>${sel(n.target, `onchange="setProp('target',this.value)"`)}</div><div class="field inline"><label>最多循环</label><input class="input sm" type="number" style="width:70px" value="${n.maxLoops}" onchange="setProp('maxLoops',+this.value)"> 次</div><div class="field"><label>超出后</label>${sel(n.onExceed, `onchange="setProp('onExceed',this.value)"`, true)}</div>`;
  else if (n.type === 'End') form = `<div class="field"><label>结束时置阶段</label><select class="select sm" onchange="setProp('stage',this.value||undefined)"><option value="">不改变</option>${[['SILENT', '静默（30 天后可唤醒）'], ['LOST', '流失']].map(x => `<option value="${x[0]}" ${n.stage === x[0] ? 'selected' : ''}>${x[1]}</option>`).join('')}</select></div><label class="checkbox"><input type="checkbox" ${n.handoff ? 'checked' : ''} onchange="setProp('handoff',this.checked||undefined)"> 交给负责人人工跟进（创建待办并通知）</label>`;
  el.innerHTML = `<div class="row mb8"><h4 style="margin:0">${(META[n.type] || [n.type])[0]} <span class="vtag mono">${id}</span></h4><span class="sp"></span><button class="btn xs" onclick="selNode=null;renderPanel();renderCanvas()">返回流程设置</button></div>${form}

  el.innerHTML = `<h4>近 30 天</h4><div class="stat-mini"><div><b>${s.entered}</b><span>进入</span></div><div><b>${s.active}</b><span>推进中</span></div><div><b>${s.handoff}</b><span>交人工</span></div><div><b>${s.completed}</b><span>完成</span></div><div><b>${s.silent}</b><span>静默</span></div><div><b>${s.lost}</b><span>流失</span></div></div>
    <div class="small muted mt8">画布上每个节点显示到达人数 / 分支占比 / 回复率，用于发现「哪一步把客户聊丢了」。</div>
    <h5>分支分布（等待回复节点）</h5>${s.entered ? [['未回复', .38, 'warning'], ['问价格 → 人工', .17, 'primary'], ['再考虑', .09, 'primary'], ['提到数量/规格 → 高意向', .08, 'hot'], ['其他回复', .21, ''], ['拒绝 → 终止', .07, 'danger']].map(x => `<div class="row mb8" style="gap:8px"><span class="tag ${x[2]}" style="width:150px;justify-content:flex-start">${x[0]}</span><div style="flex:1">${UI.bar(x[1] * 100)}</div><span class="small" style="width:40px">${Math.round(x[1] * 100)}%</span></div>`).join('') : '<div class="muted small">尚无数据</div>'}
    <h5>版本历史</h5>${vers.map(v => `<div class="row mb8"><span class="tag ${v.v === f.publishedVersion ? 'success' : ''}">v${v.v}${v.v === f.publishedVersion ? ' 当前' : ''}</span><span class="small">${fmt.time(v.t)} · ${v.by}</span><span class="small muted ell sp">${esc(v.note || '')}</span>${v.v !== f.publishedVersion ? `<a class="small" onclick="toast('已回滚到 v${v.v}（演示）')">回滚</a>` : ''}</div>`).join('') || '<div class="muted small">尚未发布</div>'}
    <h5>与简易跟进链的关系</h5><div class="small muted">未命中任何 SOP 的线索走「话术库 followUpAfter → followUpScript」简易链；SOP 优先。</div>`;
}
render();
App.note(`<b>演示提示</b>：点节点编辑，分支旁「＋插入」可在分支路径上加节点；「模拟」页选一条线索走流程，输入「多少钱」「再考虑」「别发了」看分支；「新建流程 → 自然语言描述」可用一段话生成草稿。`);
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>海报分发</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  .thumb { width: 54px; height: 72px; border-radius: 6px; display: inline-grid; place-items: end start; padding: 5px; color: #fff; font-size: 9px; font-weight: 700; line-height: 1.2; flex-shrink: 0; }
  .thumb.lg { width: 120px; height: 160px; font-size: 12px; padding: 8px; border-radius: 10px; cursor: pointer; border: 3px solid transparent; } .thumb.lg.on { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(31,94,255,.2); }
  .tgt { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; cursor: pointer; font-size: 12.5px; } .tgt:hover { border-color: var(--primary); } .tgt.on { background: var(--primary-weak); border-color: var(--primary); } .tgt .n { color: var(--text-4); font-size: 11px; margin-left: auto; }
  .code { font-family: Menlo, monospace; font-weight: 700; background: #111827; color: #ffd166; border-radius: 4px; padding: 0 6px; font-size: 11.5px; }
  .qrs { width: 56px; height: 56px; background: repeating-linear-gradient(90deg, #111 0 4px, #fff 4px 8px), repeating-linear-gradient(#111 0 4px, #fff 4px 8px); background-blend-mode: difference; border: 3px solid #fff; box-shadow: 0 0 0 1px var(--border); flex-shrink: 0; }
</style>
</head>
<body>
<script src="shared/data.js"></script><script src="shared/engine.js"></script><script src="shared/app.js"></script>
<script>
const me = App.me(); const root = App.mount({ active: 'poster', title: '海报分发' });
const SUFFIX = { group: 'G', moments: 'M', dm: 'D', other: 'O' };
const TARGETS = [
  { acc: 'a1', platform: 'WECOM', type: 'GROUP', name: '企微·苏州客户群 A', n: 186, ch: 'group' }, { acc: 'a1', platform: 'WECOM', type: 'GROUP', name: '企微·工程采购群 B', n: 92, ch: 'group' }, { acc: 'a1', platform: 'WECOM', type: 'WECOM_MOMENTS', name: '企微·客户朋友圈', n: 1240, ch: 'moments' },
  { acc: 'a2', platform: 'WECHAT_PERSONAL', type: 'GROUP', name: '微信群·华东钢贸交流群', n: 412, ch: 'group' }, { acc: 'a2', platform: 'WECHAT_PERSONAL', type: 'GROUP', name: '微信群·苏州建材采购群', n: 288, ch: 'group' }, { acc: 'a2', platform: 'WECHAT_PERSONAL', type: 'GROUP', name: '微信群·长三角工程采购群', n: 496, ch: 'group' }, { acc: 'a2', platform: 'WECHAT_PERSONAL', type: 'MOMENTS', name: '个人微信·朋友圈', n: 1830, ch: 'moments' },
  { acc: 'a6', platform: 'FORUM', type: 'FORUM_POST', name: '论坛·供求版块发帖', n: null, ch: 'other' }, { acc: 'a5', platform: 'XIAOHONGSHU', type: 'XHS_NOTE', name: '小红书·发布笔记', n: null, ch: 'other', warn: '不得含联系方式，二维码需为「货袋子小程序码」' },
];
function render() {
  const list = ACQ.posterDispatches.slice().sort((a, b) => (b.scheduledAt || 0) - (a.scheduledAt || 0));
  root.innerHTML = App.pageHead('海报分发', '从海报模块选一张海报，勾选群 / 朋友圈 / 论坛 / 小红书，系统为每个渠道生成独立追踪码并按拟人节奏发出；扫码归因到首发渠道。', `<a class="btn" href="../ai-poster/pc.html" target="_blank">去海报工作台生成 ↗</a><button class="btn primary" onclick="create()">＋ 新建分发</button>`) +
  `<div class="grid g4 mb16">${UI.kpi('本月分发', ACQ.posterDispatches.reduce((a, d) => a + d.items.length, 0), 3, '次')}${UI.kpi('扫码', ACQ.posters.reduce((a, p) => a + p.scans, 0), 61, '')}${UI.kpi('扫码成线索', ACQ.posters.reduce((a, p) => a + p.leads, 0), 4, '')}${UI.kpi('扫码 → 线索率', (ACQ.posters.reduce((a, p) => a + p.leads, 0) / Math.max(1, ACQ.posters.reduce((a, p) => a + p.scans, 0)) * 100).toFixed(1), null, '%')}</div>
  <div class="card mb16"><div class="card-h"><h3>分发记录</h3></div>${UI.table([
    { label: '海报', render: d => { const p = ACQ.posters.find(x => x.id === d.posterId); return `<div class="row" style="gap:10px"><div class="thumb" style="background:${p.bg}">${esc(p.title)}</div><div><b>${esc(p.title)}</b><span class="sub">${p.scene} · 基码 <span class="code">${p.baseCode}</span></span><span class="sub">“${esc(d.caption)}”</span></div></div>`; } },
    { label: '目标', render: d => `${d.items.length} 个<span class="sub">${[...new Set(d.items.map(i => UI.platformName(i.platform)))].join(' / ')}</span>` },
    { label: '时间', render: d => `${fmt.time(d.scheduledAt)}<span class="sub">${d.scheduledAt > Date.now() ? '定时 · ' + fmt.left(d.scheduledAt) : '由 ' + ACQ.user(d.createdBy).name + ' 创建'}</span>` },
    { label: '状态', render: d => `${UI.status(d.status)}<span class="sub">${d.items.filter(i => i.status === 'SENT').length} 成功 / ${d.items.filter(i => i.status === 'FAILED').length} 失败 / ${d.items.filter(i => i.status === 'QUEUED').length} 排队</span>` },
    { label: '扫码 / 线索', render: d => { const s = d.items.reduce((a, i) => a + (i.scans || 0), 0), l = d.items.reduce((a, i) => a + (i.leads || 0), 0); return s ? `<b>${s}</b> / ${l}<span class="sub">线索率 ${fmt.pct(l, s)}</span>` : '<span class="muted">—</span>'; } },
    { label: '操作', cls: 'ops', render: d => `<a onclick="detail('${d.id}')">详情</a><a onclick="create('${d.posterId}')">再发一次</a>${d.status === 'SCHEDULED' ? `<a style="color:var(--danger)" onclick="cancel('${d.id}')">取消</a>` : ''}` },
  ], list)}</div>
  <div class="card"><div class="card-h"><h3>海报库 <span class="sub">来自 AI 企业经营海报模块 · 每张一个基码，分享到不同渠道生成后缀码</span></h3></div><div class="card-b row" style="gap:16px">${ACQ.posters.map(p => `<div class="row" style="gap:10px;align-items:flex-start"><div class="thumb lg" style="background:${p.bg}" onclick="create('${p.id}')">${esc(p.title)}</div><div class="small"><b>${esc(p.title)}</b><div class="muted">${p.scene}</div><div class="mt8">基码 <span class="code">${p.baseCode}</span></div><div class="muted">扫码 ${p.scans} · 线索 ${p.leads}</div><button class="btn xs mt8" onclick="create('${p.id}')">分发</button></div></div>`).join('')}</div></div>`;
}
function create(posterId) {
  const st = { posterId: posterId || ACQ.posters[0].id, targets: new Set(), caption: '{title}，扫码看详情 — {company}', when: 'now', at: '' };
  const d = Drawer.open({ title: '新建海报分发', wide: true, body: '<div id="pd"></div>', footer: '<button class="btn" data-close>取消</button><button class="btn primary" id="go">确认分发</button>', onMount(m, close) {
    const draw = () => {
      const p = ACQ.posters.find(x => x.id === st.posterId); const sel = TARGETS.filter((t, i) => st.targets.has(i));
      const codes = {}; sel.forEach(t => codes[t.ch] = `${p.baseCode}-${SUFFIX[t.ch]}`);
      $('#pd', m).innerHTML = `<div class="split">
        <div>
          <h5 class="small b mb8">1. 选择海报</h5><div class="row" style="gap:10px">${ACQ.posters.map(x => `<div class="thumb lg ${x.id === st.posterId ? 'on' : ''}" style="background:${x.bg}" onclick="window.__pk('${x.id}')">${esc(x.title)}</div>`).join('')}</div>
          <h5 class="small b mt16 mb8">2. 投放目标 <span class="muted">（按账号分组，来自企微 API / 工作手机读取）</span></h5>
          ${['a1', 'a2', 'a6', 'a5'].map(a => { const acc = ACQ.account(a); return `<div class="small muted mb8" style="margin-top:8px">${UI.platform(acc.platform)}${esc(acc.name)} ${acc.status !== 'ONLINE' ? '<span class="tag warning xs">离线 · 上线后发送</span>' : ''}</div>${TARGETS.map((t, i) => t.acc === a ? `<div class="tgt ${st.targets.has(i) ? 'on' : ''}" onclick="window.__tg(${i})"><input type="checkbox" ${st.targets.has(i) ? 'checked' : ''} style="pointer-events:none">${esc(t.name)}${t.warn ? `<span class="tag warning xs">${t.warn}</span>` : ''}<span class="n">${t.n ? t.n + ' 人' : ''} · ${{ group: '群', moments: '朋友圈', other: '公开' }[t.ch]}码</span></div>` : '').join('')}`; }).join('')}
          <h5 class="small b mt16 mb8">3. 文案</h5><textarea class="input" style="width:100%;height:56px" oninput="window.__cap(this.value)">${esc(st.caption)}</textarea><div class="hint">可用变量 {title} {company}；小红书版本会自动去掉联系方式并加话题</div>
          <h5 class="small b mt16 mb8">4. 时间</h5><div class="row"><label class="checkbox"><input type="radio" name="w" ${st.when === 'now' ? 'checked' : ''} onchange="window.__when('now')"> 立即（进入各账号队列，按拟人间隔发出）</label><label class="checkbox"><input type="radio" name="w" ${st.when === 'at' ? 'checked' : ''} onchange="window.__when('at')"> 定时</label>${st.when === 'at' ? `<input class="input sm" type="datetime-local" onchange="window.__at(this.value)">` : ''}</div>
        </div>
        <div>
          <h5 class="small b mb8">预览：每个渠道一张带独立追踪码的图</h5>
          ${sel.length ? Object.entries(codes).map(([ch, code]) => `<div class="card mb8" style="box-shadow:none"><div class="card-b row" style="gap:12px"><div class="thumb" style="background:${p.bg}">${esc(p.title)}</div><div class="qrs"></div><div class="small" style="flex:1"><b>${{ group: '群码', moments: '朋友圈码', other: '公开渠道码' }[ch]}</b> <span class="code">${code}</span><div class="muted">用于：${sel.filter(t => t.ch === ch).map(t => t.name.split('·')[1]).join('、')}</div><div class="muted">扫码 → 落地页（复用海报模块 poster_session）→ 点「咨询」成线索，来源记为 <b>${{ group: '微信群', moments: '朋友圈', other: '公开渠道' }[ch]}</b></div></div></div></div>`).join('') : '<div class="empty">先勾选投放目标</div>'}
          ${sel.length ? `<div class="card" style="box-shadow:none"><div class="card-b small"><b>发送计划</b><ul style="margin:6px 0 0 16px;line-height:1.9">${sel.map(t => { const acc = ACQ.account(t.acc); const pc = Engine.pacing(acc); return `<li>${esc(t.name)} · 经 ${esc(acc.name)}${acc.exec === 'RPA' ? ` · 拟人延迟约 ${pc.preDelaySec}s · 发后截图存证` : acc.exec === 'API' ? ' · 官方 API 即时' : ''}${t.ch === 'other' && t.platform === 'XIAOHONGSHU' ? ' · 文案自动去联系方式' : ''}</li>`; }).join('')}</ul><div class="muted mt8">同一账号多目标之间间隔 ≥ ${Engine.pacing(ACQ.account('a2')).policy.minInterval}s；朋友圈每日 ≤ 3 条。</div></div></div>` : ''}
        </div></div>`;
      $('#go', m).disabled = !sel.length;
    };
    window.__pk = id => { st.posterId = id; draw(); }; window.__tg = i => { st.targets.has(i) ? st.targets.delete(i) : st.targets.add(i); draw(); }; window.__cap = v => { st.caption = v; }; window.__when = w => { st.when = w; draw(); }; window.__at = v => { st.at = v; };
    $('#go', m).onclick = () => {
      const p = ACQ.posters.find(x => x.id === st.posterId); const when = st.when === 'at' && st.at ? new Date(st.at).getTime() : Date.now();
      const disp = { id: 'PD' + (ACQ.posterDispatches.length + 1), posterId: p.id, caption: st.caption.replace('{title}', p.title), scheduledAt: when, status: when > Date.now() ? 'SCHEDULED' : 'RUNNING', createdBy: me.id, items: [...st.targets].map((i, k) => { const t = TARGETS[i]; return { id: 'PDI' + Date.now() + k, account: t.acc, platform: t.platform, targetType: t.type, targetName: t.name, shareChannel: t.ch, trackCode: `${p.baseCode}-${SUFFIX[t.ch]}`, status: 'QUEUED' }; }) };
      ACQ.posterDispatches.unshift(disp); ACQ.save(); close(); render(); toast(`已创建分发：${disp.items.length} 个目标进入队列`, 'ok');
      if (disp.status === 'RUNNING') { let k = 0; const tick = () => { if (k >= disp.items.length) { disp.status = disp.items.some(i => i.status === 'FAILED') ? 'PARTIAL' : 'DONE'; ACQ.save(); render(); return toast('分发完成', 'ok'); } const it = disp.items[k++]; const acc = ACQ.account(it.account); if (acc.status !== 'ONLINE') { it.status = 'QUEUED'; it.note = '账号离线，上线后自动发送'; } else if (it.platform === 'XIAOHONGSHU' && /锁价|特价|最低/.test(disp.caption)) { it.status = 'FAILED'; it.failMessage = '笔记含促销词进入平台审核'; } else { it.status = 'SENT'; it.sentAt = Date.now(); it.scans = 0; it.leads = 0; it.evidence = acc.exec === 'RPA'; acc.todaySent++; } ACQ.save(); render(); setTimeout(tick, 900); }; setTimeout(tick, 900); }
    };
    draw();
  } });
}
function detail(id) {
  const d = ACQ.posterDispatches.find(x => x.id === id); const p = ACQ.posters.find(x => x.id === d.posterId);
  Drawer.open({ title: `分发详情 · ${esc(p.title)}`, sub: `${fmt.time(d.scheduledAt)} · ${ACQ.user(d.createdBy).name} · 文案“${esc(d.caption)}”`, wide: true, body: UI.table([
    { label: '目标', render: i => `${UI.platform(i.platform)}${esc(i.targetName)}<span class="sub">经 ${esc((ACQ.account(i.account) || {}).name)}</span>` },
    { label: '追踪码', render: i => `<span class="code">${i.trackCode}</span><span class="sub">${{ group: '群码', moments: '朋友圈码', other: '公开码', dm: '私聊码' }[i.shareChannel]}</span>` },
    { label: '状态', render: i => `${UI.status(i.status)}${i.sentAt ? `<span class="sub">${fmt.time(i.sentAt)}</span>` : ''}${i.failMessage ? `<span class="sub" style="color:var(--danger)">${esc(i.failMessage)}</span>` : ''}${i.note ? `<span class="sub">${esc(i.note)}</span>` : ''}` },
    { label: '扫码', render: i => i.scans != null ? `<b>${i.scans}</b>` : '—' },
    { label: '成线索', render: i => i.leads ? `<a href="leads.html?q=${i.trackCode}">${i.leads}</a>` : (i.leads === 0 ? '0' : '—') },
    { label: '存证', render: i => i.evidence ? `<a onclick="toast('发后截图（工作手机自动截取，保留 90 天）')">📷 截图</a>` : '<span class="muted small">API 回执</span>' },
  ], d.items) + `<div class="alert info small mt12">归因规则：扫码落地页记录 track_code → 首发渠道；同一人多次扫码只记首个渠道；扫码后 7 天内在任何渠道成为线索，归因到该海报。与海报模块「历史记录 · 扫码分析」共用同一套 poster_session 数据。</div>` });
}
function cancel(id) { const d = ACQ.posterDispatches.find(x => x.id === id); Modal.confirm('取消分发', '未发送的目标将被取消。', () => { d.status = 'CANCELLED'; d.items.forEach(i => { if (i.status === 'QUEUED') i.status = 'CANCELLED'; }); ACQ.save(); render(); }, { danger: true }); }
render();
if (qs('new')) create(qs('new'));
App.note(`<b>演示提示</b>：「新建分发」勾选多个群 / 朋友圈，右侧实时显示每个渠道的独立追踪码；确认后逐条模拟发送（小红书含促销词会失败）。`);
</script>
</body>
</html>

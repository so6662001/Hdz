<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>项目线索</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  .pipe { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 14px; }
  .pipe .s { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; cursor: pointer; border-top: 3px solid var(--border-2); }
  .pipe .s:hover, .pipe .s.on { border-color: var(--primary); } .pipe .s b { display: block; font-size: 20px; line-height: 1.2; } .pipe .s span { font-size: 11.5px; color: var(--text-3); } .pipe .s .lt2 { font-size: 10.5px; color: var(--text-4); display: block; }
  .pipe .s.c1 { border-top-color: #c3ccd6 } .pipe .s.c2 { border-top-color: #9bbde0 } .pipe .s.c3 { border-top-color: #5b8fc9 } .pipe .s.c4 { border-top-color: var(--primary) } .pipe .s.c5 { border-top-color: var(--warning) } .pipe .s.c6 { border-top-color: var(--hot) } .pipe .s.c7 { border-top-color: var(--success) }
  .ton { font-weight: 700; } .ton small { color: var(--text-3); font-weight: 400; }
  .win { font-size: 12px; } .win .bar { height: 6px; background: var(--steel-weak); border-radius: 2px; margin-top: 3px; position: relative; } .win .bar i { position: absolute; top: 0; bottom: 0; background: var(--primary); border-radius: 2px; } .win .bar i.hot { background: var(--hot); }
  .dims { display: grid; grid-template-columns: 90px 1fr 40px; gap: 4px 10px; font-size: 12px; align-items: center; }
  .chainbox { display: flex; gap: 8px; flex-wrap: wrap; } .chainbox .c { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; min-width: 150px; background: #fff; } .chainbox .c.miss { border-style: dashed; color: var(--text-4); } .chainbox .c b { display: block; font-size: 13px; } .chainbox .c span { font-size: 11.5px; color: var(--text-3); }
  .orgs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; } .orgs div { background: #f4f6f8; border-left: 3px solid var(--border-2); padding: 6px 10px; border-radius: var(--radius-sm); font-size: 12px; } .orgs div b { display: block; font-size: 12.5px; } .orgs div.k { border-left-color: var(--hot); }
</style>
</head>
<body>
<script src="shared/data.js"></script><script src="shared/engine.js"></script><script src="shared/app.js"></script>
<script>
const me = App.me(); const root = App.mount({ active: 'projects', title: '项目线索' });
const STAGES = [['LAND', '土地 / 立项', '前置 9–18 月'], ['PLAN', '规划 / 清单', '前置 3–18 月'], ['EIA', '环评公示', '前置 6–12 月'], ['FILING', '备案 / 招标中', '前置 2–6 月'], ['BID', '中标公示', '前置 1–4 月'], ['PERMIT', '施工许可', '前置 1–3 月'], ['ONSITE', '已开工', '进场采购']];
const STRUCT = { RESIDENTIAL: '住宅', COMMERCIAL: '商业 / 公建', LIGHT_STEEL: '轻钢厂房', HEAVY_STEEL: '重型钢结构', PV: '光伏', BRIDGE: '桥梁 / 市政', RENEWAL: '城市更新' };
const STATUS = { NEW: '新项目', CONTACTED: '已触达', HOT: '高意向', WON: '已成交', LOST: '已流失', IGNORED: '已忽略' };
let stage = qs('stage', 'ALL'), sort = 'score', onlyNear = false, kw = '';
const mine = () => me.role === 'admin' ? ACQ.projects : ACQ.projects.filter(p => p.owner === me.id);
const tonText = p => p.estTon ? (p.estTon[0] === p.estTon[1] ? `${fmt.num(p.estTon[0])}` : `${fmt.num(p.estTon[0])}–${fmt.num(p.estTon[1])}`) : '—';
function winHtml(p) {
  if (!p.window || !p.window.from) return '<span class="muted">—</span>';
  const f = new Date(p.window.from + '-01').getTime(), t = new Date(p.window.to + '-01').getTime(); const span = 18 * 30 * ACQ.D; const l = Math.max(0, (f - ACQ.NOW) / span * 100), wdt = Math.max(3, (t - f) / span * 100); const soon = f - ACQ.NOW < 90 * ACQ.D;
  return `<div class="win">${p.window.from} → ${p.window.to}${soon ? ' <span class="tag hot xs">90 天内</span>' : ''}<div class="bar" title="今天起 18 个月"><i class="${soon ? 'hot' : ''}" style="left:${Math.min(95, l)}%;width:${Math.min(100 - l, wdt)}%"></i></div>${p.window.text ? `<span class="xs muted">${esc(p.window.text)}</span>` : ''}</div>`;
}
function render() {
  const all = mine(); const list = all.filter(p => (stage === 'ALL' || p.stage === stage) && (!onlyNear || p.distanceKm <= 200) && (!kw || (p.name + p.ownerOrg + p.contractorOrg + p.region).includes(kw))).sort((a, b) => sort === 'score' ? b.score - a.score : sort === 'ton' ? (b.estTon ? b.estTon[1] : 0) - (a.estTon ? a.estTon[1] : 0) : (a.window && a.window.from || 'z').localeCompare(b.window && b.window.from || 'z'));
  const tonSum = all.reduce((a, p) => [a[0] + (p.estTon ? p.estTon[0] : 0), a[1] + (p.estTon ? p.estTon[1] : 0)], [0, 0]); const soon = all.filter(p => p.window && p.window.from && new Date(p.window.from + '-01').getTime() - ACQ.NOW < 90 * ACQ.D && p.status !== 'LOST').length;
  root.innerHTML = App.pageHead('项目线索', '来自施工许可 / 招标中标 / 环评备案 / 重点项目清单 / 介绍人 / 扫街铭牌的项目级线索；按结构类型估算用钢量，按阶段推算采购窗口，按决策链找到该打电话的人。', `<a class="btn" href="intake.html">${App.icon('inbox')} 投喂项目材料</a><button class="btn primary" onclick="newProject()">${App.icon('plus')} 手工新建项目</button>`) +
  `<div class="grid g4 mb16">${UI.kpi('在库项目', all.length, 2, '个', 'projects.html')}${UI.kpi('估算用钢量合计', `${fmt.num(Math.round(tonSum[0] / 1000))}–${fmt.num(Math.round(tonSum[1] / 1000))}<small>千吨</small>`, null, '')}${UI.kpi('90 天内进入采购窗口', soon, null, '个').replace('card kpi', 'card kpi hot')}${UI.kpi('高意向项目', all.filter(p => p.status === 'HOT').length, 1, '个').replace('card kpi', 'card kpi ok')}</div>
  <div class="pipe">${STAGES.map((s, i) => `<div class="s c${i + 1} ${stage === s[0] ? 'on' : ''}" onclick="stage=stage==='${s[0]}'?'ALL':'${s[0]}';render()"><b>${all.filter(p => p.stage === s[0]).length}</b><span>${s[1]}</span><span class="lt2">${s[2]}</span></div>`).join('')}</div>
  <div class="card"><div class="filters"><input class="input sm" placeholder="搜索项目 / 建设单位 / 总包 / 地区" style="width:260px" value="${esc(kw)}" oninput="kw=this.value;render()"><label class="checkbox small"><input type="checkbox" ${onlyNear ? 'checked' : ''} onchange="onlyNear=this.checked;render()"> 仅 200 km 物流半径内</label><span class="sp"></span><span class="small muted">排序</span><div class="btn-group">${[['score', '评分'], ['ton', '吨位'], ['window', '采购窗口']].map(x => `<button class="btn sm ${sort === x[0] ? 'on' : ''}" onclick="sort='${x[0]}';render()">${x[1]}</button>`).join('')}</div></div>
  ${UI.table([
    { label: '项目', render: p => `<a onclick="openProject('${p.id}')"><b>${esc(p.name)}</b></a><span class="sub">${esc(p.type)} · ${esc(p.region)} · ${p.distanceKm} km${p.flags ? ` <span class="tag danger xs">${esc(p.flags[0])}</span>` : ''}</span>` },
    { label: '阶段', render: p => `<span class="tag primary">${STAGES.find(s => s[0] === p.stage)[1]}</span><span class="sub">${esc(p.stageText)}</span>`, w: '150px' },
    { label: '估算用钢量', render: p => `<span class="ton" title="${esc(p.estTonBasis)}">${tonText(p)}<small> t</small></span><span class="sub">${STRUCT[p.structure] || ''}${p.area ? ` · ${fmt.num(p.area)} ㎡` : p.mw ? ` · ${p.mw} MW` : ''}</span>`, w: '150px' },
    { label: '采购窗口', render: winHtml, w: '190px' },
    { label: '决策链', render: p => { const known = p.contacts.filter(c => c.phone && c.phone !== '—').length; return `<b>${known}</b><span class="muted"> / ${Math.max(3, p.contacts.length)} 人</span><span class="sub">${p.contractorOrg && !p.contractorOrg.startsWith('（') ? esc(p.contractorOrg) : '<span style="color:var(--warning)">总包未定</span>'}</span>`; }, w: '150px' },
    { label: '信号', render: p => `<b>${p.sources.length}</b><span class="sub">${p.sources.map(s => `<span class="tag xs" title="${esc(s.text)}">${s.code.split('_')[0]}</span>`).join(' ')}</span>`, w: '90px' },
    { label: '评分', render: p => UI.score(p.score), w: '70px' },
    { label: '状态', render: p => `<span class="tag stage-${p.status}">${STATUS[p.status]}</span>`, w: '80px' },
    { label: '负责人', render: p => ACQ.user(p.owner).name, w: '70px' },
    { label: '', cls: 'ops', render: p => { const c = p.contacts.find(x => x.leadId); return `${c ? `<a onclick="App.recordCall('${c.leadId}',{onDone:render})">${App.icon('phone')} 电话</a>` : `<a onclick="findContact('${p.id}')">找联系人</a>`}<a onclick="openProject('${p.id}')">档案</a>`; }, w: '130px' },
  ], list, { empty: '无匹配项目' })}</div>`;
}
function dims(p) { const D = [['估算吨位', 30], ['需求时间窗', 25], ['决策链', 15], ['信用风险', 12], ['物流半径', 10]]; const K = ['ton', 'window', 'chain', 'credit', 'logistics']; return `<div class="dims">${D.map((d, i) => { const v = p.scoreDims[K[i]]; return `<span class="muted">${d[0]}</span>${UI.bar(Math.max(0, v) / d[1] * 100, v < 0 ? 'hot' : '')}<span class="right ${v < 0 ? 'down' : ''}">${v}<span class="muted">/${d[1]}</span></span>`; }).join('')}<span class="muted b">合计</span><span></span><b class="right">${p.score}</b></div>`; }
function openProject(id) {
  const p = ACQ.project(id); const leads = ACQ.leads.filter(l => l.projectId === id); const cos = p.companyIds.map(ACQ.company).filter(Boolean); const inst = leads.map(l => ACQ.instanceOf(l.id)).find(Boolean);
  const roles = ['项目经理', '物资采购', '预算员', '技术负责人'];
  Drawer.open({ title: `${esc(p.name)} <span class="tag stage-${p.status}">${STATUS[p.status]}</span>`, sub: `${p.id} · ${esc(p.type)} · ${esc(p.region)} · ${p.distanceKm} km · 负责人 ${ACQ.user(p.owner).name}`, wide: true, body: `
    ${p.flags ? `<div class="alert warn small mb12">${p.flags.map(esc).join('；')}</div>` : ''}
    <div class="orgs mb12"><div><b>${esc(p.ownerOrg)}</b>建设单位</div><div class="${p.contractorOrg.startsWith('（') ? '' : 'k'}"><b>${esc(p.contractorOrg)}</b>施工总包（关键）</div><div><b>${esc(p.supervisorOrg || '—')}</b>监理</div><div><b>${esc(p.designOrg || '—')}</b>设计</div></div>
    <div class="grid g2">
      <div class="card"><div class="card-h" style="padding:10px 14px"><h3>用钢量与采购窗口</h3><span class="tag primary xs">${STAGES.find(s => s[0] === p.stage)[1]}</span></div><div class="card-b small"><dl class="kv"><dt>估算用钢量</dt><dd><span class="ton" style="font-size:16px">${tonText(p)}<small> 吨</small></span><div class="xs muted">${esc(p.estTonBasis)}</div></dd><dt>结构 / 规模</dt><dd>${STRUCT[p.structure] || '—'}${p.area ? ` · ${fmt.num(p.area)} ㎡` : ''}${p.mw ? ` · ${p.mw} MW` : ''}</dd><dt>合同价</dt><dd>${p.contractAmount ? fmt.num(p.contractAmount) + ' 万元' : '—'}</dd><dt>采购窗口</dt><dd>${winHtml(p)}</dd><dt>阶段说明</dt><dd>${esc(p.stageText)}</dd></dl></div></div>
      <div class="card"><div class="card-h" style="padding:10px 14px"><h3>评分 ${UI.score(p.score)}</h3><span class="xs muted">新维度：吨位 / 时间窗 / 决策链 / 信用 / 物流</span></div><div class="card-b">${dims(p)}${cos.some(c => c.credit.level !== 'OK') ? `<div class="alert warn xs mt8">${cos.filter(c => c.credit.level !== 'OK').map(c => `${esc(c.name)}：${esc(c.credit.text)}`).join('；')}</div>` : ''}</div></div>
    </div>
    <div class="card mt12"><div class="card-h" style="padding:10px 14px"><h3>决策链与联系人</h3><button class="btn xs" onclick="addContact('${p.id}')">＋ 添加联系人</button></div><div class="card-b"><div class="chainbox">${roles.map(r => { const c = p.contacts.find(x => x.role === r); return c ? `<div class="c"><b>${esc(c.name)} <span class="xs muted">${esc(c.role)}</span></b><span>${esc(c.org)} · ${esc(c.phone)}</span><div class="row mt8" style="gap:6px">${c.leadId ? `<a class="btn xs primary" onclick="App.recordCall('${c.leadId}',{onDone:()=>{openProject('${p.id}');render()}})">${App.icon('phone')} 电话</a><a class="btn xs" href="leads.html?open=${c.leadId}">线索</a>` : `<a class="btn xs" onclick="toast('已创建个人线索并关联本项目','ok')">建线索</a>`}</div></div>` : `<div class="c miss"><b>${r}</b><span>未知 · <a onclick="findContact('${p.id}')">查找</a></span></div>`; }).join('')}</div>
      ${leads.length ? `<h5 class="small b mt12 mb8">关联线索</h5>${UI.table([{ label: '线索', render: l => `${UI.leadType(l.leadType)} <a href="leads.html?open=${l.id}">${esc(l.nickname)}</a>${l.role ? ` <span class="muted xs">${esc(l.role)}</span>` : ''}` }, { label: '来源', render: l => esc(l.sourceChannel) }, { label: '最近', render: l => (l.calls && l.calls[0]) ? `电话 · ${Engine.flow.CALL_RESULTS[l.calls[0].result]} · ${fmt.ago(l.calls[0].t)}` : l.lastContactedAt ? `触达 · ${fmt.ago(l.lastContactedAt)}` : '未触达' }, { label: '阶段', render: l => UI.stage(l.stage), w: '80px' }, { label: '分', render: l => UI.score(l.score), w: '60px' }], leads)}` : ''}
    </div></div>
    <div class="grid g2 mt12">
      <div class="card"><div class="card-h" style="padding:10px 14px"><h3>来源与信号 <span class="muted small">${p.sources.length} 条 · 多信号叠加加权</span></h3></div><div class="card-b"><div class="timeline">${p.sources.slice().sort((a, b) => b.t - a.t).map(s => { const src = ACQ.source(s.code); return `<div class="tl ${s.code.startsWith('R') ? 'user' : 'sys'}"><div class="t">${fmt.time(s.t)} · ${UI.family(src ? src.family : 'PROJECT')} <a href="sources.html?open=${s.code}" class="xs">${src ? esc(src.name) : s.code}</a></div><div class="s">${esc(s.text)}</div></div>`; }).join('')}</div></div></div>
      <div class="card"><div class="card-h" style="padding:10px 14px"><h3>跟进</h3>${inst ? UI.status(inst.status) : '<span class="muted xs">未进入 SOP</span>'}</div><div class="card-b small"><div class="alert ${p.status === 'HOT' ? 'ok' : 'info'} mb8"><b>下一步：</b>${esc(p.nextAction)}</div>${inst ? `<div>流程「${esc(ACQ.flow(inst.flowId).name)}」当前：${esc(Engine.flow.label(ACQ.flow(inst.flowId), inst.currentNode))} <a href="flows.html?inst=${inst.id}">查看 →</a></div>` : `<button class="btn sm" onclick="toast('已将项目关联线索加入「项目跟进 SOP（含电话）」','ok')">加入项目跟进 SOP</button>`}<h5 class="small b mt12 mb8">首触预览（按来源换话术）</h5>${(function () { const l = leads[0]; if (!l) return '<span class="muted">暂无关联线索</span>'; const src = ACQ.source(l.sourceCode); const s = ACQ.script(src && src.outreach ? src.outreach.script : 121); const r = Engine.render(s, l); return `<div class="bubble" style="display:inline-block">${UI.hlVars(r.text)}</div><div class="xs muted mt8">话术「${esc(s.name)}」· 命中变量 ${r.hits.join(', ')}</div>`; })()}</div></div>
    </div>`,
    footer: `<button class="btn danger" onclick="ACQ.project('${p.id}').status='LOST';ACQ.save();render();this.closest('.drawer-mask').remove();toast('已标记流失','warn')">标记流失</button><span class="sp"></span><button class="btn" onclick="toast('已转交给 李四','ok')">转交</button><button class="btn" data-close>关闭</button>${leads[0] ? `<button class="btn hot" onclick="App.recordCall('${leads[0].id}',{onDone:()=>{openProject('${p.id}');render()}})">${App.icon('phone')} 打电话</button>` : ''}<button class="btn primary" onclick="ACQ.project('${p.id}').status='HOT';ACQ.save();render();this.closest('.drawer-mask').remove();toast('已置为高意向','ok')">置高意向</button>` });
}
function findContact(id) { const p = ACQ.project(id); Modal.open({ title: '查找决策链联系人', body: `<div class="small" style="line-height:1.9"><div><b>1. 总包项目部</b>：${esc(p.contractorOrg)} — 施工许可 / 中标公示中的项目经理姓名 + 企业公开电话；企微搜索"${esc(p.contractorOrg.slice(0, 6))}"。</div><div><b>2. 介绍人</b>：与该工地同期进场的商砼站 / 模板脚手架 / 桩基分包（异业联盟 R1）。<a href="referrals.html">查看介绍人 →</a></div><div><b>3. 现场</b>：扫街拍铭牌，铭牌上有项目经理与电话。<a href="app.html">App 投喂 →</a></div><div><b>4. 监理 / 设计</b>：${esc(p.supervisorOrg || '未知')} · ${esc(p.designOrg || '未知')}（二期介绍人渠道）。</div></div>` }); }
function addContact(id) { const p = ACQ.project(id); Modal.open({ title: '添加联系人', body: `<div class="grid g2"><div class="field"><label>姓名</label><input class="input" id="c_n"></div><div class="field"><label>职务</label><select class="select" id="c_r"><option>项目经理</option><option>物资采购</option><option>预算员</option><option>技术负责人</option><option>其他</option></select></div><div class="field"><label>单位</label><input class="input" id="c_o" value="${esc(p.contractorOrg)}"></div><div class="field"><label>电话</label><input class="input" id="c_p" placeholder="139…"></div></div><label class="checkbox small"><input type="checkbox" checked> 同时创建个人线索并关联本项目（首触告知来源）</label>`, footer: `<button class="btn" data-close>取消</button><button class="btn primary" id="c_ok">保存</button>`, onMount(m, close) { $('#c_ok', m).onclick = () => { const n = $('#c_n', m).value.trim(); if (!n) return toast('请填写姓名', 'warn'); const lid = 'L' + String(ACQ.leads.length + 1).padStart(3, '0'); ACQ.leads.push({ id: lid, nickname: n, leadType: 'PERSON', role: $('#c_r', m).value, projectId: p.id, platform: 'PHONE', sourceType: 'MANUAL', sourceCode: 'MANUAL', sourceChannel: '手工录入-项目联系人', sourceExcerpt: p.name, intent: 'UNKNOWN', score: Math.max(50, p.score - 10), stage: 'NEW', owner: me.id, region: p.region, phone: $('#c_p', m).value, company: $('#c_o', m).value, tags: [], events: [], createdAt: Date.now(), lastActiveAt: Date.now() }); p.contacts.push({ name: n, role: $('#c_r', m).value, org: $('#c_o', m).value, phone: $('#c_p', m).value || '—', leadId: lid }); p.scoreDims.chain = Math.min(15, p.scoreDims.chain + 4); p.score += 4; ACQ.save(); close(); openProject(p.id); render(); toast('已添加联系人并创建线索', 'ok'); }; } }); }
function newProject() {
  Modal.open({ title: '手工新建项目', width: 640, body: `<div class="alert info small mb12">有公示 PDF / 链接 / 铭牌照片时建议直接 <a href="intake.html">投喂</a>，AI 自动抽取；这里为纯手工录入。</div><div class="grid g2"><div class="field"><label>项目名称</label><input class="input" id="np_n"></div><div class="field"><label>地区</label><input class="input" id="np_r" value="江苏 苏州"></div><div class="field"><label>结构类型</label><select class="select" id="np_s">${Object.entries(STRUCT).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div><div class="field"><label>建筑面积（㎡）</label><input class="input" id="np_a" type="number" placeholder="用于估算用钢量" oninput="const t=Engine.estimateTon(+this.value,$('#np_s').value);$('#np_est').textContent=t?t[0].toLocaleString()+'–'+t[1].toLocaleString()+' 吨':'—'"></div><div class="field"><label>阶段</label><select class="select" id="np_st">${STAGES.map(s => `<option value="${s[0]}">${s[1]}</option>`).join('')}</select></div><div class="field"><label>施工总包</label><input class="input" id="np_c"></div></div><div class="small">估算用钢量：<b id="np_est">—</b> <span class="muted xs">（住宅 40–55 / 商业 55–90 / 轻钢 30–60 / 重型 80–150 kg/㎡）</span></div>`, footer: `<button class="btn" data-close>取消</button><button class="btn primary" id="np_ok">创建</button>`, onMount(m, close) { $('#np_ok', m).onclick = () => { const n = $('#np_n', m).value.trim(); if (!n) return toast('请填写项目名称', 'warn'); const st = $('#np_s', m).value, area = +$('#np_a', m).value || null; const t = Engine.estimateTon(area, st); const id = 'PJ' + (ACQ.projects.length + 1); ACQ.projects.unshift({ id, name: n, type: STRUCT[st], region: $('#np_r', m).value, distanceKm: 50, stage: $('#np_st', m).value, stageText: '手工录入', area, structure: st, estTon: t, estTonBasis: area ? `${area.toLocaleString()} ㎡ × 经验系数` : '未填面积', window: {}, ownerOrg: '—', contractorOrg: $('#np_c', m).value || '（未知）', sources: [{ code: 'MANUAL', t: Date.now(), text: `${me.name} 手工录入` }], signals: 1, score: t ? Math.min(80, 40 + Math.round(t[1] / 400)) : 40, scoreDims: { ton: t ? Math.min(30, Math.round(t[1] / 400)) : 5, window: 8, chain: 4, credit: 10, logistics: 10 }, owner: me.id, status: 'NEW', companyIds: [], contacts: [], nextAction: '补充联系人 → 首触', createdAt: Date.now(), updatedAt: Date.now() }); ACQ.save(); close(); render(); openProject(id); toast('项目已创建', 'ok'); }; } });
}
render(); if (qs('open')) openProject(qs('open'));
App.note('<b>演示提示</b>：点「PJ1 产业园二期」看三来源叠加、决策链与评分维度；点「电话」体验 Q13 电话记录并推进流程 Call 节点。');
</script>

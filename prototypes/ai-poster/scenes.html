<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>场景样张 · 6 大类 37 场景 · AI 经营海报原型</title><style>body{margin:0;background:#e9edf3;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.grp{padding:18px 20px 6px;font-size:18px;font-weight:800;color:#111827}.grp small{font-weight:500;color:#6b7280;margin-left:8px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(var(--n,7),1fr);gap:14px;padding:0 20px 8px}
.it{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.08)}.it .f{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden}.it .f .in{transform-origin:0 0;position:absolute;left:0;top:0}
.it .c{padding:8px 10px;font-size:12px}.it .c b{display:block;font-size:13px}.it .c span{color:#6b7280;display:block;margin-top:2px;line-height:1.4;font-size:11px;height:30px;overflow:hidden}
</style></head><body><script src="shared/engine.js"></script>
<div style="padding:22px 20px 0"><a href="index.html" style="font-size:13px;color:#1f5eff;text-decoration:none">← 返回原型总览</a><h1 style="font-size:22px;margin:8px 0 4px">场景样张：6 大类 37 场景</h1><p style="font-size:13px;color:#6b7280;margin:0">每张由各场景的示例提示词经 mockPlan 规划后由同一渲染引擎生成（3:4）。点击任意样张可在 PC 工作台中打开并继续微调。参数：<code>?g=supply|site|promo|brand|hr|notice</code> 只看某一类，<code>?n=4</code> 每行列数。</p></div><div id="root"></div>
<script>
const qp=new URLSearchParams(location.search);const only=qp.get('g');const W=1080;
const ctx={assets:AP.sampleAssets,brand:AP.defaultBrand,date:"2026.09.16"};
let html='';
for(const g of AP.GROUPS){ if(only&&g.id!==only)continue; const scs=AP.SCENES.filter(s=>s.g===g.id);
 html+=`<div class="grp">${g.name}<small>${scs.length} 个场景 · ${g.desc}</small></div><div class="grid" style="--n:${qp.get('n')||7}">`;
 for(const s of scs){const sp=AP.mockPlan(s.example,ctx);html+=`<a class="it" style="text-decoration:none;color:inherit" href="pc.html?demo=${s.id}"><div class="f" id="f_${s.id}"></div><div class="c"><b>${s.icon} ${s.name} <span style="display:inline;color:#1f5eff;height:auto">${AP.LAYOUT_NAMES[sp.layout]} · ${AP.STYLES[sp.style].name}</span></b><span>${AP.esc(s.example)}</span></div></a>`;}
 html+='</div>';}
document.getElementById('root').innerHTML=html;
for(const s of AP.SCENES){const f=document.getElementById('f_'+s.id);if(!f)continue;const sp=AP.mockPlan(s.example,ctx);const w=f.clientWidth;f.innerHTML=`<div class="in" style="transform:scale(${w/W})">${AP.renderPoster(sp,ctx,W)}</div>`;}
</script></body></html>

<style>

<div class="nav"><button onclick="back()">‹</button><b id="title">AI 经营海报</b><button class="r" id="navR" onclick="navRight()">重新开始</button></div>

<div class="page on" id="p-input">

  <div class="sec"><h3>想做什么海报？<a onclick="setScene(null)">不选，让 AI 识别</a></h3><div class="gtabs" id="gtabs"></div><div class="scenes" id="scenes"></div></div>
  <div class="sec"><h3>用一句话描述需求</h3>
    <div class="ta"><textarea id="prompt" placeholder="例如：招 5 名钢材销售，底薪 6000 加高提成，五险包住，电话 138 0000 8888。可以说风格：喜庆 / 商务 / 简洁 / 黑金…"></textarea>
      <div class="ex"><a id="exLink" onclick="useExample()">💡 试试示例：招 5 名钢材销售，底薪 6000 加高提成…</a><button onclick="toast('原型：调用微信 JS-SDK 语音识别，说话即输入')">🎤 语音</button></div></div>
  </div>
  <div class="sec"><h3>视觉冲击力<a onclick="toast('AI 营销海报默认「强冲击」：超大标题 + 焦点数字 + 光效层 + 高对比视觉；日签 / 感谢类可选柔和')">什么是冲击力？</a></h3>
    <div class="impseg" id="impseg"><button data-i="3" class="i3 on">🔥 强冲击</button><button data-i="2">标准</button><button data-i="1">柔和</button></div><div class="imphint" id="imphint"></div></div>
  <div class="sec"><h3>企业素材库<a id="libAct" onclick="$('file').click()">上传 / 拍照</a></h3>

    <div id="lib-img"><div class="cats" id="acats"></div><div class="assets" id="assets"></div><input type="file" id="file" accept="image/*" multiple hidden><div class="pickbar" id="pickInfo"></div></div>
    <div id="lib-kb" style="display:none"><div class="kbmode" id="kbmode"></div><div id="kbl"></div><div class="kbnew" onclick="editKB()">＋ 新增资料（粘贴一段介绍，AI 帮你提炼要点）</div></div>
  </div>
  <div class="sec" style="padding-bottom:16px"><h3>品牌信息（已保存，海报自动带上）<a onclick="$('b-company').focus()">编辑</a></h3>
    <div class="brand" id="brand">
      <div class="row"><label>企业</label><input id="b-company"></div><div class="row"><label>联系人</label><input id="b-person"></div><div class="row"><label>电话</label><input id="b-phone"></div><div class="row"><label>地址</label><input id="b-addr"></div>
    </div>
  </div>
</div>

<div class="page" id="p-gen"><div class="gen"><div class="orb"></div><h2 id="gtitle">AI 正在设计你的海报</h2><p id="gsub">理解需求 → 检索企业资料 → 设计版式 → 生成视觉 → 精确排版 → 质检</p><div class="steps" id="steps"></div></div></div>

<!-- 第三步：结果 + 微调 -->
<div class="page" id="p-result"><div class="result">
  <div class="view" id="view"><button class="arrow l" id="prev" onclick="goVer(S.cur-1)">‹</button><div class="frame" id="frame"><div class="inner" id="inner"></div></div><button class="arrow r" id="next" onclick="goVer(S.cur+1)">›</button></div>
  <div class="meta"><span id="minfo"></span><span class="dots" id="dots"></span></div>
  <div class="acts"><button onclick="openSheet()">⚙ 冲击力·版式</button><button onclick="regen()">🎲 再来一版</button><button onclick="exportPng()">⤓ 保存原图</button><button class="pri" onclick="AP.History.bump(S.sid,'shares');toast('原型：调用微信 JS-SDK，海报图分享到会话 / 朋友圈（已记入历史）')">分享微信</button></div>
  <div class="chatbox">
    <div class="msgs" id="msgs"></div>
    <div class="quick" id="quick"></div>
    <div class="input"><button class="mic" onclick="toast('原型：语音说「字大一点，换成红色」即可微调')">🎤</button><textarea id="refine" rows="1" placeholder="怎么改？如：字大一点 / 换成红色"></textarea><button onclick="sendRefine()">➤</button></div>
  </div>
</div></div>

<!-- 历史记录 -->
<div class="page" id="p-history">
  <div class="hstat" id="hstat"></div>
  <div class="hs"><input type="search" id="hq" placeholder="搜索标题 / 需求 / 文案" oninput="renderHist()"><select id="hrange" onchange="renderHist()"><option value="all">全部时间</option><option value="today">今天</option><option value="week">近 7 天</option><option value="month">近 30 天</option></select></div>
  <div class="hs" style="padding-top:8px"><div class="hview" id="hview"><button data-v="card" class="on" onclick="setHView('card')">▦ 卡片</button><button data-v="list" onclick="setHView('list')">☰ 列表</button><button data-v="stats" onclick="setHView('stats')">📈 扫码分析</button></div><select id="howner" onchange="renderHist()"><option value="">全部发布人</option></select><select id="hsort" onchange="renderHist()"><option value="updated">最近修改</option><option value="scans">扫码最多</option><option value="leads">咨询最多</option><option value="shares">分享最多</option></select></div>
  <div class="sec" style="padding-top:10px"><div class="gtabs" id="htabs"></div></div>
  <div id="hlist" style="padding-bottom:20px"></div>
</div>
<div class="sheet" id="rsheet" onclick="if(event.target===this)this.classList.remove('show')"><div class="card"><div class="rh" id="rsheetHead"></div><div class="list" id="rsheetList"></div></div></div>
<div class="sheet" id="kbsheet" onclick="if(event.target===this)this.classList.remove('show')"><div class="card"><h4 id="kbsheetT">编辑资料 <a onclick="$('kbsheet').classList.remove('show')">关闭</a></h4><div class="kbf" id="kbform"></div></div></div>
<div class="sheet" id="sheet" onclick="if(event.target===this)this.classList.remove('show')"><div class="card"><h4>视觉冲击力 <a onclick="$('sheet').classList.remove('show')">关闭</a></h4>
  <div class="g"><button onclick="quick('更有冲击力')"><span>🔥</span>更有冲击力</button><button onclick="quick('柔和一点')"><span>🌿</span>柔和一点</button><button onclick="quick('去掉光线装饰')"><span>✂️</span>去掉光效层</button><button onclick="quick('字大一点')"><span>Aa</span>字大一点</button></div>
  <h4 style="margin-top:16px">画幅与版式</h4>
  <div class="g"><button onclick="quick('改成 3:4 朋友圈')"><span>▯</span>3:4 朋友圈</button><button onclick="quick('改成竖屏 9:16')"><span>▮</span>9:16 竖屏</button><button onclick="quick('改成 1:1 方图')"><span>▢</span>1:1 方图</button><button onclick="quick('换个版式')"><span>⇄</span>换个版式</button><button onclick="quick('全图铺满')"><span>🖼</span>全图实拍</button><button onclick="quick('多图拼贴')"><span>▦</span>多图拼贴</button><button onclick="quick('版式改成要点')"><span>☰</span>要点卡</button><button onclick="quick('版式改成卡片')"><span>▣</span>居中卡片</button></div>
  <h4 style="margin-top:16px">风格</h4>
  <div class="g" id="styles"></div>
</div></div>
<div class="toast" id="toast"></div>

<script src="shared/engine.js"></script>
<script src="shared/knowledge.js"></script>
<script src="shared/history.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const S = { assets: AP.sampleAssets.map((a) => Object.assign({}, a)), brand: Object.assign({}, AP.defaultBrand), scene: null, picks: [], kbPick: [], acat: "", impact: 3, impactUser: false, versions: [], cur: -1, page: "input", busy: false, sid: null, prompt: "", hgroup: "", hview: "card" };
  const ctx = () => ({ assets: S.assets, brand: S.brand, scene: S.scene, ratio: "3:4", impact: S.impactUser ? S.impact : undefined, photoPick: S.picks, kbPick: S.kbPick, kb: AP.KB.load(), date: "2026.09.16" });
  const toast = (m) => { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 2200); }; window.toast = toast;
  const cur = () => S.versions[S.cur] && S.versions[S.cur].spec;

  function show(p) { S.page = p; ["input", "gen", "result", "history"].forEach((k) => $("p-" + k).classList.toggle("on", k === p)); $("f-input").style.display = p === "input" ? "" : "none"; $("title").textContent = { input: "AI 经营海报", gen: "生成中", result: "海报预览", history: "历史记录" }[p]; $("navR").style.display = p === "gen" ? "none" : ""; $("navR").textContent = { input: "🕘 历史", result: "重新开始", history: "＋ 新建" }[p] || ""; if (p === "history") renderHist(); if (p === "input") renderRecent(); }
  window.show = show;
  window.back = () => { if (S.page === "result" || S.page === "history") show("input"); else toast("返回营销工具首页（原型）"); };
  window.navRight = () => { if (S.page === "input") show("history"); else if (S.page === "history") { newPoster(); } else restart(); };
  window.restart = () => { newPoster(); };
  window.newPoster = () => { S.versions = []; S.cur = -1; S.sid = null; S.prompt = ""; S.picks = []; S.kbPick = []; $("prompt").value = ""; renderAssets(); renderKBList(); show("input"); };

  /* 场景 */
  S.group = AP.GROUPS[0].id;
  function renderScenes() { $("gtabs").innerHTML = AP.GROUPS.map((g) => `<button class="${S.group === g.id ? "on" : ""}" onclick="setGroup('${g.id}')">${g.name}<i>${AP.SCENES.filter((s) => s.g === g.id).length}</i></button>`).join(""); $("scenes").innerHTML = AP.SCENES.filter((s) => s.g === S.group).map((s) => `<button data-id="${s.id}" class="${S.scene === s.id ? "on" : ""}" onclick="setScene('${s.id}')"><span>${s.icon}</span>${s.name}</button>`).join(""); }
  window.setGroup = (id) => { S.group = id; renderScenes(); };
  renderScenes();
  window.setScene = (id) => { S.scene = S.scene === id ? null : id; if (S.scene) S.group = AP.SCENES.find((s) => s.id === S.scene).g; renderScenes(); const sc = AP.SCENES.find((s) => s.id === S.scene) || AP.SCENES[0]; $("exLink").textContent = `💡 试试示例：${sc.example.slice(0, 22)}…`; };
  window.useExample = () => { const sc = AP.SCENES.find((s) => s.id === S.scene) || AP.SCENES[0]; $("prompt").value = sc.example; };

  /* 企业素材库：图片库（可多选 3 张） */
  window.libTab = (t) => { $("lt-img").classList.toggle("on", t === "img"); $("lt-kb").classList.toggle("on", t === "kb"); $("lib-img").style.display = t === "img" ? "" : "none"; $("lib-kb").style.display = t === "kb" ? "" : "none"; $("libAct").textContent = t === "img" ? "上传 / 拍照" : "新增资料"; $("libAct").onclick = t === "img" ? () => $("file").click() : () => editKB(); if (t === "kb") renderKBList(); };
  function renderAssets() {
    const cnt = (c) => S.assets.filter((a) => (a.cat || "upload") === c).length;
    $("acats").innerHTML = `<button class="${!S.acat ? "on" : ""}" onclick="setACat('')">全部 ${S.assets.length}</button>` + AP.ASSET_CATS.filter((c) => cnt(c.id)).map((c) => `<button class="${S.acat === c.id ? "on" : ""}" onclick="setACat('${c.id}')">${c.icon} ${c.name} ${cnt(c.id)}</button>`).join("");
    const list = S.assets.filter((a) => !S.acat || (a.cat || "upload") === S.acat);
    $("assets").innerHTML = list.map((a) => { const n = S.picks.indexOf(a.id) + 1; return `<div class="ast ${a.type === "logo" ? "logo" : ""} ${a.uploaded ? "up" : ""} ${n ? "on" : ""}" data-n="${n === 1 ? "主视觉" : n ? `第 ${n} 张` : ""}" onclick="pick('${a.id}')"><img src="${a.url}"><small>${AP.esc(a.name)}</small></div>`; }).join("") + `<div class="ast add" onclick="$('file').click()"><span>＋</span>上传 / 拍照</div>`;
    $("imgN").textContent = S.assets.length; $("pickInfo").innerHTML = S.picks.length ? `已选 <b>${S.picks.length}</b> 张：${S.picks.map((id) => AP.esc((S.assets.find((a) => a.id === id) || {}).name)).join("、")}${S.picks.length >= 2 ? " · 将做多图拼贴" : " · 作主视觉"}` : "点图片选入本次海报（最多 3 张，第 1 张为主视觉）；不选则 AI 按场景从图片库挑";
  }
  window.setACat = (c) => { S.acat = c; renderAssets(); };
  window.pick = (id) => { const a = S.assets.find((x) => x.id === id); if (a.type === "logo") return toast("Logo 自动用于海报左上角"); if (S.picks.includes(id)) S.picks = S.picks.filter((x) => x !== id); else { if (S.picks.length >= 3) return toast("最多选 3 张，先取消一张"); S.picks.push(id); } renderAssets(); };
  $("file").addEventListener("change", (e) => { [...e.target.files].filter((f) => f.type.startsWith("image/")).forEach((f) => { const rd = new FileReader(); rd.onload = () => { const id = "up_" + Date.now(); S.assets.push({ id, type: "photo", cat: "upload", name: f.name.replace(/\.[^.]+$/, "").slice(0, 8), tags: ["上传", "实拍"], url: rd.result, uploaded: true }); if (S.picks.length < 3) S.picks.push(id); S.acat = ""; renderAssets(); toast("已上传并选入本次海报 · 正式版自动抠图、归类与打标"); }; rd.readAsDataURL(f); }); });
  /* 企业素材库：资料库 */
  function renderKBList() {
    const list = AP.KB.load(); $("kbN").textContent = list.length; const ptxt = $("prompt").value.trim(); const e = AP.extract(ptxt); e._t = ptxt;
    const auto = AP.KB.retrieve(S.scene || (AP.detectScene(ptxt) || { id: "intro" }).id, e, list, [], ptxt);
    $("kbmode").innerHTML = S.kbPick.length ? `<b>精确引用 ${S.kbPick.length} 条</b>：只结合勾选的资料生成。` : `<b>AI 自动检索</b>：按场景与需求匹配最相关的 1~2 条并标注来源${auto.items.length ? `，当前预计引用 ${auto.items.map((it) => `「${AP.KB.shortTitle(it)}」`).join("")}` : ""}。勾选可精确控制。`;
    $("kbl").innerHTML = list.map((it) => { const c = AP.KB.cat(it.cat); const img = (it.images || []).map((id) => S.assets.find((a) => a.id === id)).filter(Boolean)[0]; return `<div class="kbi ${S.kbPick.includes(it.id) ? "on" : ""}" onclick="toggleKB('${it.id}')"><span class="ck">✓</span>${img ? `<img class="th" src="${img.url}">` : `<span class="th" style="display:flex;align-items:center;justify-content:center;font-size:18px">${c.icon}</span>`}<div class="bd"><b><em>${c.name}</em>${AP.esc(AP.KB.shortTitle(it))}</b><small>${it.points.map(AP.esc).join(" · ")}</small></div><button class="ed" onclick="event.stopPropagation();editKB('${it.id}')">编辑</button></div>`; }).join("");
  }
  window.toggleKB = (id) => { S.kbPick = S.kbPick.includes(id) ? S.kbPick.filter((x) => x !== id) : [...S.kbPick, id]; renderKBList(); };
  window.editKB = (id) => {
    const it = id ? AP.KB.get(id) : { id: "", cat: "product", title: "", points: [], body: "", tags: [], images: [] }; if (!it) return;
    $("kbsheetT").firstChild.textContent = id ? `编辑：${AP.KB.shortTitle(it)} ` : "新增资料 ";
    $("kbform").innerHTML = `<div><label>分类</label><select id="kf-cat">${AP.KB.CATS.map((c) => `<option value="${c.id}" ${c.id === it.cat ? "selected" : ""}>${c.icon} ${c.name}</option>`).join("")}</select></div>
      <div><label>标题</label><input id="kf-title" value="${AP.esc(it.title)}" placeholder="如：产品 · 工字钢"></div>
      <div><label>完整介绍（供 AI 理解）<a onclick="distillKB()">✨ AI 提炼要点</a></label><textarea id="kf-body" placeholder="粘贴一段介绍，点「AI 提炼要点」自动生成海报短句">${AP.esc(it.body || "")}</textarea></div>
      <div><label>海报要点（每行一条，带数字更有说服力）</label><textarea id="kf-points">${AP.esc(it.points.join("\n"))}</textarea></div>
      <div><label>标签（检索匹配用，逗号分隔）</label><input id="kf-tags" value="${AP.esc((it.tags || []).join("，"))}"></div>
      <div><label>关联图片（生成时优先选用）</label><div class="imgs" id="kf-imgs">${S.assets.filter((a) => a.type !== "logo").map((a) => `<img src="${a.url}" data-id="${a.id}" class="${(it.images || []).includes(a.id) ? "on" : "dim"}" onclick="this.classList.toggle('on');this.classList.toggle('dim')">`).join("")}</div></div>
      <div class="btns">${id ? `<button class="del" onclick="delKB('${id}')">删除</button>` : ""}<button onclick="$('kbsheet').classList.remove('show')">取消</button><button class="pri" onclick="saveKB('${id || ""}')">保存</button></div>`;

    const ana = `<div class="rs"><div><b>${r.exports}</b>导出</div><div><b>${r.shares}</b>分享</div><div><b class="sk">${r.scans}</b>扫码</div><div><b class="ld">${r.leads}</b>咨询 · ${H.rate(r.leads, r.scans)}</div></div>` + (r.scans ? `<div class="rsrc">${H.SOURCES.filter(([k]) => r.scanFrom[k]).map(([k, n]) => `<span>${n} <b>${r.scanFrom[k]}</b></span>`).join("")}<span style="margin-left:auto">近 14 天</span>${H.spark(r.scanDays, 80, 18, "#d97706")}</div>` : `<div class="rsrc">${r.shares ? "已分享但还没有人扫码" : "分享后，客户扫码与咨询会在这里统计"}</div>`) + (r.leadList && r.leadList.length ? `<div style="font-size:10px;color:var(--mute);margin:-4px 0 10px;line-height:1.7">最近咨询：${r.leadList.slice(0, 3).map((l) => `${l.city} · ${l.type}${l.isNew ? "（新客）" : ""}`).join("；")}</div>` : "");
    $("rsheetList").innerHTML = ana + `<button onclick="openRecord('${r.id}')"><span>✏️</span>打开继续微调</button><button onclick="redoRecord('${r.id}')"><span>🔁</span>再做一张类似的（带入原需求）</button><button onclick="AP.History.bump('${r.id}','exports');window.open('poster.html?d='+encodeURIComponent(AP.encode(AP.History.get('${r.id}').versions[${r.cur}].spec)),'_blank');$('rsheet').classList.remove('show');renderHist()"><span>⤓</span>保存原图</button><button onclick="AP.History.star('${r.id}');renderHist();$('rsheet').classList.remove('show')"><span>★</span>${r.starred ? "取消收藏" : "收藏（置顶）"}</button><button class="del" onclick="if(confirm('删除这张海报及其 ${r.versions.length} 个版本？')){AP.History.remove('${r.id}');renderHist();$('rsheet').classList.remove('show');toast('已删除，正式版 30 天内可从回收站恢复')}"><span>🗑</span>删除</button>`; $("rsheet").classList.add("show"); };
  window.redoRecord = (id) => { const r = AP.History.get(id); if (!r) return; $("rsheet").classList.remove("show"); newPoster(); S.scene = null; setScene(r.scene); $("prompt").value = r.prompt || r.title; toast("已带入原需求，可修改后重新生成"); };

  /* 初始化 */
  renderAssets(); renderKBList(); setScene(null); show("input");
  const qp = new URLSearchParams(location.search);
  if (qp.get("lib") === "kb") libTab("kb");
  if (qp.get("kbedit")) editKB(qp.get("kbedit") === "new" ? "" : qp.get("kbedit"));
  if (qp.get("picks")) { S.picks = qp.get("picks").split(",").filter((id) => S.assets.some((a) => a.id === id)); renderAssets(); }
  if (qp.get("kbpick")) { S.kbPick = qp.get("kbpick").split(",").filter((id) => AP.KB.get(id)); renderKBList(); }
  if (qp.get("impact")) { S.impact = +qp.get("impact") || 3; S.impactUser = true; document.querySelectorAll("#impseg button").forEach((x) => x.classList.toggle("on", +x.dataset.i === S.impact)); impHint(); }
  if (qp.get("sheet") === "1") openSheet();
  if (qp.get("step") === "history") { if (qp.get("hview")) S.hview = qp.get("hview"); show("history"); if (qp.get("hgroup")) setHGroup(qp.get("hgroup")); if (qp.get("hopen")) recSheet(qp.get("hopen")); }
  if (qp.get("open")) openRecord(qp.get("open"));
  if (qp.get("rsheet")) recSheet(qp.get("rsheet"));
  if (qp.get("demo")) { const s = AP.SCENES.find((x) => x.id === qp.get("demo")); if (s) { setScene(s.id); $("prompt").value = qp.get("prompt") || s.example; if (qp.get("step") === "gen") { runSteps(["understand", "retrieve", "plan", "visual", "render", "qa"], 1e6, () => {}, "AI 正在设计你的海报", "理解需求 → 检索企业资料 → 设计版式 → 生成视觉 → 精确排版 → 质检"); setTimeout(() => { document.querySelectorAll(".step")[0].className = "step done"; document.querySelectorAll(".step")[0].querySelector("i").textContent = "✓"; document.querySelectorAll(".step")[1].className = "step done"; document.querySelectorAll(".step")[1].querySelector("i").textContent = "✓"; document.querySelectorAll(".step")[2].className = "step on"; }, 50); } else if (qp.get("step") !== "input") { generate(true); (qp.get("refine") || "").split("|").filter(Boolean).forEach((r) => { $("refine").value = r; sendRefine(true); }); } } }
</script>
</body>
</html>
